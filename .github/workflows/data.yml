# Робот сайта. Ночью и кнопкой — свежие данные outerpedia: собрать, проверить и предложить PR (сам не публикует).
# На push в main с правками приложения — пересобрать сайт на тех же данных и, если проверки зелёные, сразу выложить.
# Схема и что делать с красным PR или issue — AUTOUPDATE.md.
name: Обновление сайта

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC каждый день (не ровно в час: в это время очередь раннеров длиннее)
  workflow_dispatch:        # кнопка «Run workflow» на вкладке Actions — пересобрать PR данных, не дожидаясь ночи
  push:
    branches: [main]
    paths:                  # код приложения — те же пути, по которым vite.config.ts берёт версию для подвала
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'update.py'
      - 'pwa/**'

permissions:
  contents: write           # PR данных — ветка data/auto; публикация кода — коммит docs/ в main
  pull-requests: write
  issues: write             # не собралось или проверки не прошли — issue с причиной
  pages: write              # явный запрос выкладки после публикации кода

concurrency:
  group: site-robot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}      # gh: PR, issue, запрос выкладки
      GITHUB_TOKEN: ${{ github.token }}  # update.py и check-data: запросы к GitHub API без лимита 60 в час
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # версия кода в подвале — последний коммит, менявший приложение: нужна история
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm run -s build
      - run: scripts/autoupdate.sh ${{ github.event_name == 'push' && 'code' || 'data' }}
