# Каждый день проверяет outerpedia, пересобирает PWA и выкладывает на GitHub Pages.
# Коммит появляется, только если данные действительно изменились.
name: Обновление данных и публикация

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'   # каждый день в 04:23 UTC
  workflow_dispatch:        # ручной запуск: Actions → «Обновление данных и публикация» → Run workflow

permissions:
  contents: write   # закоммитить обновлённый docs/
  pages: write      # опубликовать на GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Собрать PWA из свежих данных outerpedia
        run: python update.py --pwa docs

      - name: Закоммитить изменения данных
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Обновление данных outerpedia"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
