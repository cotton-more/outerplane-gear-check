 that gives the character almost nothing, dashed — not on the item. Flat and % are different stats of one parameter: % counts in full, flat by its value for the character, never above %. Marked main — the parameter is in the item's main (grows with Enhance, not Reforge); if the other stat of the pair can still roll as a substat (flat ATK with an ATK% main, EFF% with a flat EFF), it sits next to it after «/», dashed if it isn't there: only the substat counts. Crossed out — the build does not need it. Dashed with a dot — the Reforge dice: with this 4th substat the piece becomes a "Keep" (green dot) or a "Stopgap" (yellow).`,altGroup:`Below — the set is only in an alternative combo of the build`,showAll:e=>`show all (${e})`,scoreTitle:(e,t,n)=>`Useful substats: ${e} of ${t}; weighted by priority — ${n}%`,openBuilds:`Open builds`,alsoBuilds:e=>` · also: ${e}`,anyMain:`any`,toEval:`← Evaluate`,verdictDetails:`Verdict — show details`,backToEval:`Back to evaluation`,reset:`Next`,undoText:`Item cleared`,undoAction:`Undo`,menu:`Menu`,details:`details`,charsHint:`☆ — mark yours: the evaluation will consider only them`,charSearch:`Name: Stella, Demiurge, Gnosis…`,onlyMine:`only mine`,withoutBuilds:`show those without builds`,rosterCount:`In roster:`,markShown:`mark all shown`,exportImport:`export / import`,nobodyFound:`Nobody found.`,rosterToggle:(e,t)=>`${e} — ${t?`remove from roster`:`add to roster`}`,clearRoster:`clear roster`,clearConfirm:`really clear? tap again`,rosterSelected:`Selected — press Ctrl/Cmd+C`,rosterApplied:(e,t,n)=>`${e?`Replaced`:`Added`}: ${t}${n?`; not recognized: ${n}`:``}`,rosterCodeLabel:`Roster code (comma-separated slugs). Copy it to move to another browser, or paste yours: "Replace" replaces the current roster, "Add" appends to it.`,replace:`Replace`,add:`Add`,charBuilds:`Character builds`,pickChar:`Pick a character — I'll show the recommended sets, weapons, accessories and substat priority from outerpedia builds.`,toList:`← to list`,inRosterBtn:`★ in roster`,addToRoster:`☆ add to roster`,builds:`Builds`,noBuilds:`outerpedia doesn't have gear recommendations for this character yet.`,gameSets:e=>`The game itself suggests sets: ${e}.`,armorSets:`Armor sets`,or:`or`,weapon:`Weapon`,accessory:`Accessory`,subPriority:`Substat priority`,notSub:`doesn't drop as a substat on 6★ gear`,prioGap:`gap in the priority`,talismans:`Talismans`,buildNote:`outerpedia note`,badMain:`this item can't have this main stat — probably a typo on outerpedia`,flatEqual:e=>` — flat and ${e}% are about equal, take either.`,flatBetter:(e,t)=>` — flat is better: a flat ${e} segment gives ≈${t}% of an ${e}% segment (i.e. more).`,pctBetter:(e,t)=>` — ${e}% is better: a flat ${e} segment gives only ≈${t}% of an ${e}% segment.`,flatFor:(e,t)=>`For lv ${e}${t?` with upgraded Quirks`:` without Quirks`} — change it in "Evaluation settings".`,howTo:`How to use`,steps:[`**Mark your characters** — until you do, the evaluation considers every character in the game.`,`**Enter the item:** slot, grade (L — Etheric, E — Steel), set or item; substats in the grid, in the in-game order, yellow segments in the rows.`,`**The verdict** appears right away, with an explanation. "Next" — on to the next item; slot, grade, set and main stay, substats are cleared.`],markChars:`Mark characters`,canInstall:`You can install it as an app — works offline too.`,install:`Install`,iosInstall:`**iPhone and iPad:** Safari → Share → "Add to Home Screen" — works offline too.`,helpInput:`Entering an item`,helpInputItems:[`**Armor** — the set: it's in the name after "of" (Etheric Gloves of Speed → Speed Set).`,`**Legendary weapon and accessory** — find the item and mark the main stat. Brand new and not listed yet — "not listed".`,`**Epic weapon and accessory** (Steel…) — no passive, straight to the main stat.`,`**Main stat** on a weapon — the ATK% / DEF% / HP% buttons next to the grade; on an accessory — the first tap in the grid, after that the grid marks substats. Brighter — a main someone needs. Tap the chosen one again to remove it.`,`**Substats** — tap them in the grid; brighter ones are needed by builds with the chosen set. Stats sit in pairs by parameter, one above the other: ATK% over ATK, HP% over HP, DEF% over DEF, CHC over CHD, DMG UP% over DMG RED%, EFF% over RES%. A cell marked main never rolls as a substat on this piece — it is already in the main (HP% on helmets and boots, flat DEF on chest armor and gloves, flat ATK on weapons). A flat EFF or flat RES main doesn't block EFF% and RES% substats — in the game they are different stats. The grid has all 13 substats in the game; PEN%, CDMG RED%, flat EFF and flat RES never roll as substats — only as mains.`,`**4th substat on an Epic** — Epics drop with three; the first Reforge adds a fourth: one of the stats not on the piece, all equally likely. The **dice** next to the stamp — "3/9": that many of the possible stats save the piece, even with one segment; which ones and for whom — in the details, and they carry a dot in the "+ 4th substat from Reforge" window. Did the Reforge — mark what rolled.`,`Tap a stat in its row to replace it (yellow segments stay) or remove it. When replacing, you can also pick a stat from another row: it moves here and that row is freed — handy for entering the next piece over the last one. Tapping it again in the grid removes it too. Code, help and settings are in the ☰ menu.`],helpRoutine:`How to clean up fast`,helpRoutineItems:[`Everything below 6★ and below Epic — dismantle right away.`,`Go through the inventory by date received: consecutive drops usually come from one run, and the set stays from the previous piece.`,`**Epic armor:** pick the slot and set and look at the grid. 0–1 bright stats on the piece — dismantle without entering anything: "Keep" and "Stopgap" are impossible then. For Speed, Immunity and Swiftness almost everything is bright — enter those.`,`For Epic, the verdict appears after two useless substats — no need to enter the third.`,`**Dice on "Dismantle"** — one Reforge may save the piece. Don't dismantle it right away: set it aside, do the Reforge and mark the 4th substat. No luck — dismantle, invest no more.`,`"Keep" — lock it so you don't dismantle it by accident; "Stopgap" — wear it until you find better.`,`**Epic Breakthrough** takes only the same piece: an Epic of the same set and slot, any substats. Have an Epic "Keep" below T4 — set Epics of the same set and slot aside for it instead of dismantling, you need 4.`,`**Epic weapon and accessory:** in "Endgame" — dismantle; in "Progression" the main stat first: faded — no one needs it, dismantle.`,`**Legendary** with "I save Legendary armor for Breakthrough": the verdict shows which to upgrade and which to keep for Breakthrough.`],helpVerdicts:[`**Keep** — the piece is needed: wear it and upgrade it; what exactly is in the "Upgrading" block in the details. "Worth reforging" — a good roll: after Reforge its useful stats get many segments, invest here first. A piece already in a build is a "Keep" too, without "Upgrading": it's worn.`,`**Stopgap** — wear it until you find better: a weapon or accessory without the needed passive, or Epic armor with only one key stat. A dice next to it — one Reforge may make it a "Keep".`,`**Fodder** — keep it for Breakthrough of the same item with the right main stat — or of the one already worn below T4 (see "Equipment"). Also a Legendary that won't improve anyone: everyone it suits already wears as good or better.`,`**Maybe** — your call: the details say what's in doubt (e.g. it's good for a character outside your roster). A dice next to it — one Reforge may make it useful for your roster.`,`**Dismantle** — doesn't suit your characters, the roll is weak, or everyone it suits already wears as good or better (see "Equipment"). A dice next to it — a chance one Reforge saves the piece: how many of the possible stats do, it says on the dice.`],helpChars:[`The star adds a character to your roster; with "only my characters" checked, the evaluation considers only them. "Export / import" moves the roster to another device as a code.`,`Tap a character to open their builds: sets, weapons, substat priority.`,`**Equipment** — what is worn in each build. A piece goes into a build from a verdict: "Equip on…" in the details, and on a phone also the button under the card. Then tap the piece on the character card to mark orange segments after Reforge and the Breakthrough tier; the number of Reforges done is counted for you. Enhance isn't tracked: everything worn is assumed to be +10. Who wears what — ☰ → "Gear"; on a computer, the "with gear" filter in Characters. During a tutorial there's no gear code: the page shows an example.`,`**Try-on** — a check for one build: "Gear up this build", "Try on" on an empty slot or "Try a replacement" on a piece in the character card. The comparison is with that build only, "Equip" goes straight to it, "Next" keeps the try-on, ✕ checks for everyone again.`,`**On your characters now** — in the verdict details: for whom the piece suits, an empty slot in a build you're gearing, or whether the new piece is better or worse than the one on — two chains side by side and by how much in useful segments, counting the Reforges ahead; for weapons and accessories, where the passive decides, "recommended" or "stopgap". What's worn changes the stamp like this. "Dismantle" → "Fodder" when the same piece is worn below T4 with its Breakthrough marked — this one is its material; and if this one beats the worn one, wear it and feed the old one to it. "Keep" and "Stopgap" → "Dismantle" when all substats are entered and everyone it suits already wears as good or better in the builds you're gearing (a Legendary "Keep" becomes "Fodder"; armor only if you keep fodder). What keeps the stamp: a character with nothing in Gear, an empty slot (the try-on build counts too), a different recommended passive, "on par" only because the one on is T4. "Dismantle", "Fodder" and "Maybe" on a piece that is already in a build become "Keep". Backup — the OGC-GEAR1 code in "Export / import".`],helpCode:`Code for your guild`,helpCodeText:e=>`The verdict details show the item's code, e.g. ${e}. Copy it into the game chat; whoever gets it taps "Enter code" and types it in. Everyone gets the verdict for their own roster.`,helpInstall:`Installing`,helpInstallItems:[`**Android (Chrome):** menu ⋮ → "Install app" or "Add to Home screen".`,`**iPhone and iPad:** in Safari, Share → "Add to Home Screen".`,`The installed app works offline. When new outerpedia data is out, an "Update" banner appears; app improvements install by themselves on the next launch.`],wikiLink:`Full guide — in the Wiki ↗`,wikiUrl:`https://github.com/cotton-more/outerplane-gear-check/wiki/Getting-started`},material:{title:(e,t)=>`Fodder — Breakthrough material for the ${e} on ${t}`,need:(e,t,n,r)=>`${e} on ${t} — T${n}, ${r} more to T4`,line:e=>`**Material**: the same piece is worn below T4 — ${e}. One piece is one Breakthrough tier; substats don't matter.`,plan:`**Don't upgrade or dismantle it** — feed it to the worn one's Breakthrough: one piece is one tier.`,planGamble:`**Don't upgrade it** (except one Reforge for luck — the dice is next to it) **or dismantle it** — feed it to the worn one's Breakthrough: one piece is one tier.`,titleWear:(e,t)=>`Fodder — better than the ${e} on ${t}: wear it and feed the old one to it`,lineWear:e=>`**Better than the one on**: the same piece is worn below T4 but is weaker — ${e}. Wear this one and feed the old one to its Breakthrough.`,planReplace:e=>`**Wear it** on ${e}: it beats the one on, and the old one is the same piece — feed it to the new one's Breakthrough, one piece is one tier.`,planWear:e=>`**Wear it** on ${e} until you find better — don't feed it to the worn one's Breakthrough.`},worn:{title:(e,t,n)=>`${e===`fodder`?`Fodder`:`Dismantle`} — already ${n?`as good`:`better`} on ${t.length>2?`${t.slice(0,2).join(`, `)} and ${t.length-2} more`:t.join(` and `)}`,line:`**Won't improve anyone**: everyone it fits already wears as good or better. The piece itself isn't bad.`,stale:`Changed someone's gear in the game? Update it on their card and the verdict follows.`,keptTitle:e=>`Keep — it's already in ${e}`,kept:e=>`**Already in a build**: ${e}. Not needed there? Remove it on the character card.`},tryon:{label:`Try-on`,end:`End try-on`,others:e=>`${e.length>2?`${e.slice(0,2).join(`, `)} and ${e.length-2} more`:e.join(` and `)} ${e.length===1?`needs`:`need`} it`,clause:(e,t,n,r)=>({fill:r?`${t}: empty slot — fine for now`:`${t}'s slot is empty`,up:`better than what ${t} wears`,eq:`on par with what ${t} wears`,down:`${t} already wears better`,breaks:`breaks ${t}'s set`,worn:`already on ${t}`,off:`${t} · ${n} — off-build`})[e]??``,butWear:(e,t)=>`but ${e===`fill`?`${t}'s slot is empty`:`better than what ${t} wears`}: wear it until you find better`,offNote:(e,t)=>t?`${e} needs ${t} in this build.`:`This piece doesn't fit ${e}'s build.`,anyway:`Equip anyway`,slot:`Try on`,replace:`Try a replacement`,build:`Gear up this build`,empty:(e,t)=>`Gear up the ${e} build: enter the pieces ${t} wears now, and the verdict starts comparing new pieces with them.`,emptyOr:`Or press "Equip" in a verdict — the piece goes into the build by itself.`},tour:{start:`Tutorial`,startLong:`Take the tutorial`,welcomeCta:`Take it · 1 min`,next:`Continue`,done:`Done`,close:`Close tutorial`,stepOf:(e,t)=>`Step ${e} of ${t}`,choose:`Let's enter one piece of gear — about a minute. Use an example or a piece from the game?`,demo:`Example`,own:`My own piece`,inSheet:`Pick in the window — the tutorial will wait.`,closeSheet:`Close the window ✕, then press “Next”.`,backToEval:`← Back to tutorial`,endText:(e,t)=>`That's it: every piece is checked this way.${e?` To take it again, open ${t?`the ☰ menu or `:``}Help.`:` Mark your characters — the check will use them instead of every hero in the game.`}`,choice:`Another piece was on the form before the tutorial. Which one to keep?`,keepItem:`Keep this one`,restoreItem:`Bring back the old one`,invite:`New: a tutorial — enter one piece of gear, about a minute.`,pick:`Which tutorial?`,tours:{core:`Checking a piece · 1 min`,gear:`Gear · 1 min`},gearStepOf:(e,t)=>`Gear · ${e} of ${t}`,gearEnd:e=>`Done. That was an example — your gear is untouched. Who wears what: ${e?`the ☰ menu, “Gear”`:`Characters, the “with gear” filter`}.`,off:{item:`The example needs Epic armor: the shirt icon and E.`,set:`The example needs Speed Set — change it in the set field.`,subs:`The example needs only SPD, CHC and CHD: tap the extra stat in its row and replace or remove it.`},tips:{dice:`The dice: an Epic's first Reforge adds a random 4th substat. “3/9” — how many of the possible stats save the piece. No luck — invest no more.`,star:`Star your characters — the check will use them instead of every hero in the game.`,accMain:`For an accessory, the first tap in the grid is the main stat, as at the top of the piece in the game. Then come the substats.`,mainCell:`A “main” cell is a stat in the main line: it never rolls as a substat.`,fourth:`After the first Reforge, Epic gets a 4th substat — mark it, it may save the piece.`,replace:`Tap a stat in its row to replace or remove it. Handy for entering the next piece over the last one.`,move:`You can pick a stat from another row too: it moves here and that row is freed.`,chain:`The chain is the build’s stat priority: green is on the piece, dashed is not. Earlier places matter more.`,code:`The item code is for your guild chat: they enter it with “Enter code” and see the check for their roster.`,temp:`“Temporary” — wear it until you find something better. No rush to dismantle it.`,prio:`Substat priority: › is the order, = shares a place, crossed-out ones never roll as substats on 6★ gear. The verdict chain is built from this line.`,builds:`This character has several builds, each with its own 6 slots. The check counts all, but only builds you fill ask for pieces.`,gear:`Each build has its own 6 slots. Record what the character wears now, and the verdict compares new pieces with it.`,tryOn:`“Try on” checks for this character and build only, with the slot and set already picked. “Equip” goes straight to them.`,piece:`Did a Reforge or Breakthrough in the game? Mark it here, or the comparison treats the piece as un-upgraded.`,tryStrip:`Try-on is on: I compare with this build only, and “Equip” goes straight to it. “Next” keeps it; ✕ checks for everyone again.`,vs:`▲ the new piece beats the worn one, ▼ it is worse; I count useful segments, Reforges ahead included. The button equips or replaces.`,cardEquip:`Empty slot, or better than what they wear — equip it with one tap right below the card.`,equipAll:`Wearing something off-build right now? Turn on “show off-build too”, and the comparison uses what they really wear.`,material:`Fodder, not dismantle: the same piece is worn below T4 — this one feeds its Breakthrough.`,worn:`The piece is decent, but everyone it fits already wears as good or better — hence Dismantle. Changed someone’s gear in the game? Update their card.`},news:{dice:`Reforge dice — which 4th substat saves an Epic`,move:`on replace, a stat from another row moves over`,gear:`gear — character builds and comparing with what they wear`},newsStrip:(e,t)=>`New: ${e}${t?` and ${t} more`:``}.`,newsShow:`Show`,newsLater:`Later`,tipsTitle:`Tips`,tipsOn:`on`,tipsOff:`off`,tipsReset:`Show tips again`,newBadge:`new`,steps:{slot:e=>e.demo?`As an example, take Epic armor: tap ${e.narrow?`the armor icon (a shirt)`:`**Armor**`} and **E**.${e.keys?` Or press 4 and E.`:``}`:`Pick the slot and grade, as on the piece in the game. **E** is Epic (Steel), **L** is Legendary (Etheric).${e.keys?` Keys: 1–6, L and E.`:``}`,pick:e=>e.demo?`Tap the set field and pick **Speed Set**.`:e.kind===`armor`?`Pick the set — it is in the item name after “of”.`:e.kind===`weapon`?`Main stat — one of the buttons next to the grade${e.legend?`; below, find the weapon by name: the passive depends on it`:``}.`:e.legend?`Find the accessory by name — the passive and possible mains depend on it.`:`Mark the main stat: the first tap in the grid is the main, then come the substats.`,grid:e=>`${e.demo?`Mark **SPD**, **CHC** and **CHD** — in order, as in the game.`:`Mark the substats in order, as in the game.`}${e.kind===`armor`?` Bright cells are wanted by builds for this set.`:``} Marked ${e.n} of ${e.of}.`,verdict:e=>e.narrow?`The verdict is ready. Tap the card: who it suits, what to upgrade and the code for your guild.`:`On the right is the verdict: who it suits, what to upgrade and the code for your guild. Have a look and press “Continue”.`,gBuild:()=>`This is Caren's Speed build: what she wears in each slot. An empty slot has “Try on”. Tap the **helmet** to see what's on it.`,gPiece:()=>`Upgraded it in the game? Mark the orange segments after Reforge and the Breakthrough here — the comparison counts them. Now tap **Try a replacement**.`,gCard:e=>`Try-on: the piece on the form is compared with Caren's Speed build only. ${e.narrow?`The card shows how much it beats her helmet. Have a look and press “Continue”.`:`The verdict on the right shows how much it beats her helmet. Have a look and press “Continue”.`}`,gEquip:()=>`Better than what Caren wears — tap **Replace Caren's helmet**: the new one goes into the build, and the old one — the same Speed helmet — feeds its Breakthrough.`,gNext:()=>`“Next” keeps the try-on — enter pieces for Caren one after another. Done? ✕ on the Try-on strip, and the check is for everyone again.`,next:e=>`“Next” goes to a new piece: slot, grade, set and main stay, substats are cleared. Pressed it by accident? “Undo” brings the piece back for a few seconds — except in the tutorial.${e.keys?` Key: Esc.`:``}`}}},M=(e,t,n,r)=>{let i=e%10,a=e%100;return i===1&&a!==11?t:i>=2&&i<=4&&(a<12||a>14)?n:r},re=e=>`${e} ${M(e,`персонаж`,`персонажа`,`персонажей`)}`,ie=e=>`${e} ${M(e,`персонажа`,`персонажей`,`персонажей`)}`,N=e=>`${e} ${M(e,`персонажу`,`персонажам`,`персонажам`)}`,ae={weapon:[`оружие`,`оружия`,`оружии`],accessory:[`аксессуар`,`аксессуара`,`аксессуаре`]},oe=e=>ae[e][0],se=e=>ae[e][1],ce=e=>ae[e][2],le=e=>e===`weapon`?`Оружие`:`Аксессуар`,ue=e=>String(Math.round(e*10)/10).replace(`.`,`,`),de={persons:re,more:e=>` и ещё ${e}`,orList:(e,t)=>e.length<=1?e.join(``):e.length<=t?`${e.slice(0,-1).join(`, `)} или ${e[e.length-1]}`:`${e.slice(0,t).join(`, `)} или ещё ${e.length-t}`,anyClass:`любой класс`,verdict:{notInRoster:`Не из ростера`,suits:`Кому подходит`,tempFor:`Кому пойдёт временно`,markRest:(e,t)=>`Отмечено ${e} из ${t} — отметь остальные`,soFar:(e,t)=>`Пока полезных ${e}. Лучший кандидат: ${t}.`,topRoll:`Топ-ролл`,worthReforge:`Стоит Reforge`,flatHint:e=>`Проверь ${e}: без знака % это flat, а билдам нужен ${e}% — flat им почти ничего не даёт. Если на предмете ${e}%, выбери ${e}%.`,roll:(e,t,n,r,i,a,o,s)=>`Ролл: полезных ${e} из ${t}, жёлтых сегментов на них ${n} из ${r}${s?` (оранжевые — от уже сделанных Reforge — не отмечай)`:``}; ${s?`оставшиеся Reforge — до ${a} — добавят`:`Reforge добавит`} полезным в среднем ~${ue(i)} оранжевых${s?``:` из ${a}`} — ${{high:`высокий, стоит вкладываться в Reforge`,mid:`средний`,low:`низкий`}[o]}.`},plan:{title:`Прокачка`,enhance:`**Enhance** до +10 — сразу: растит main stat.`,reforgeFirst:e=>e===`started`?`**Reforge** — оставшиеся попытки, в первую очередь: ролл хороший. Одна из 6 уже ушла на 4-й сабстат.`:`**Reforge** — все 6 попыток, в первую очередь: ролл хороший${e===`adds`?`. Первая добавит 4-й сабстат, остальные — сегменты`:``}.`,reforgeLater:e=>e===`started`?`**Reforge** — оставшиеся попытки — после вещей с хорошим роллом: полезным достанется меньше сегментов.`:`**Reforge** — после вещей с хорошим роллом: полезным достанется меньше сегментов${e===`adds`?`. Первая попытка добавит 4-й сабстат`:``}.`,reforgeAfterReroll:`**Reforge** — после реролла сабстатов (Precise Craft или Transistone): сейчас сегменты уйдут в ненужные статы.`,reforgeUnknown:`**Reforge** — смотря по сабстатам: отметь их, и вердикт скажет, стоит ли.`,btArmorLegend:(e,t)=>`**Breakthrough** до T4: +5% к main stat за ступень и сильнее бонус сета. Материал — любой Legendary ${e} ${t} Set (тот самый фоддер) или Armor Glunite; одна вещь — одна ступень.`,btArmorEpic:(e,t)=>`**Breakthrough** до T4: +5% к main stat за ступень и сильнее бонус сета. Материал — такая же вещь: Epic ${e} ${t} Set (сабстаты не важны) или Glunite. Пока эта не на T4, такие Epic из разбора не выбрасывай — нужно 4 штуки.`,btGear:e=>`**Breakthrough** до T4 — обязательно: к T4 усиливается пассивка, и +20% к main stat. Материал — копии ${e} (годятся и с другим main stat) или Refined Glunite.`,noTransistone:e=>`**Transistone** — не трать: по гайду outerpedia их тратят только на Irregular и красную броню.${e?``:` Да и смена статов у Epic откроется, только когда первый Reforge добавит 4-й сабстат.`}`,tempNoInvest:`**Reforge** и **Breakthrough** — не вкладывай: вещь на замену, её сменит нужная.`,reforgeTemp:e=>`**Reforge** — можно, но после вещей «Оставить»: ролл высокий, а замена — Legendary с нужной пассивкой, тем же main и хорошими сабстатами сразу — может не выпадать долго${e===`adds`?`. Первая попытка добавит 4-й сабстат`:e===`started`?`. Одна попытка уже ушла на 4-й сабстат`:``}.`,noBreakTemp:`**Breakthrough** — не вкладывай: вещь на замену, её сменит нужная.`,gamble:e=>({temp:`**Reforge** — один, на удачу: какой 4-й сабстат сделает вещь «Оставить», — в блоке выше. Выпал другой — отметь его с сегментами, как в игре: вердикт пересчитается; осталась «Временно» — Reforge и **Breakthrough** дальше не вкладывай.`,junk:`**Reforge** — один, на удачу: какой 4-й сабстат вытянет вещь, — в блоке выше. Выпал другой — отметь его с сегментами, как в игре: вердикт пересчитается.`,maybe:`**Reforge** — один, на удачу: какой 4-й сабстат сделает вещь нужной твоим персонажам, — в блоке выше. Выпал другой — отметь его с сегментами, как в игре: вердикт пересчитается.`})[e],fodderArmor:(e,t)=>`**Не прокачивай** — это материал: одна вещь — одна ступень Breakthrough для Legendary ${e} ${t} Set, которую оставляешь. Исключение — если перебросишь ей сабстаты Transistone (Total).`,fodderGear:e=>`**Не прокачивай** — это материал: одна копия — одна ступень Breakthrough для ${e} с нужным main stat.`,junkEpicArmor:(e,t)=>`Есть Epic ${e} ${t} Set с вердиктом «Оставить», ещё не на T4? Эта вещь — ступень его Breakthrough: годится такая же вещь (Epic, тот же сет и слот) с любыми сабстатами. Нет — в разбор.`},armor:{foot:(e,t,n)=>`Броня: полезный сабстат — из 1–3 ступени приоритета билда (4-я — за ½, SPD — на любой; слабый flat — за ½ или не считается). Оставить — ${e}+ полезных под лучший билд или ${t} с SPD от ${n} жёлтых сегментов.`,pickSet:`Выбери сет`,pickSetHint:(e,t,n)=>`Сет написан в названии после «of»: **${e} ${t} of Speed** → ${n}, Speed Set.`,deadTitle:e=>`Скорее разбирай — ${e} Set нет ни в одном билде`,pieces:(e,t)=>`${e} шт.: ${t}`,deadLine:(e,t,n)=>`outerpedia не ставит **${e}** ни одному из ${t} персонажей с билдами${n?` (на T4 — ${n})`:``}.`,deadWhy:{"Critical Hit":`Шанс крита набирают и без сета — quirks, сабстаты CHC, аксессуары с main CHC, — а выше 100% он сгорает; у части DPS в заметках outerpedia прямо сказано «CHC до 50%». Поэтому место под сет отдают Critical Strike (CHD), Penetration или Speed. Разработчики сами называют Critical Hit сетом для начала игры.`,Lifesteal:`Вампиризм 7–12% слабее того, что дают Swiftness, Immunity или Life — их и берут сустейн-билды outerpedia.`},deadWhyDefault:`Эффект ситуативный: в каждом билде есть сет, который даёт больше.`,deadPvp:`Если сам играешь от этого сета (например, в PvP) — оставь экземпляры с хорошими сабстатами. Список обновится сам, когда сет появится в билдах outerpedia.`,whoWears:e=>`Кто носит ${e} Set`,notForRosterTitle:e=>`Разбирай — ${e} Set не нужен твоим персонажам`,onlyOthers:e=>`Сет стоит только в билдах тех, кого нет в ростере: ${e}.`,goodForOthersTitle:`Не для твоего р ановить`,iosInstall:`**iPhone и iPad:** Safari → «Поделиться» → «На экран „Домой“» — будет работать и без сети.`,helpInput:`Ввод вещи`,helpInputItems:[`**Броня** — сет: он в названии после «of» (Etheric Gloves of Speed → Speed Set).`,`**Legendary оружие и аксессуар** — найди предмет и отметь main stat. Совсем новый, которого нет в списке, — «нет в списке».`,`**Epic оружие и аксессуар** (Steel…) — пассивки нет, сразу main stat.`,`**Main stat** у оружия — кнопки ATK% / DEF% / HP% рядом с грейдом; у аксессуара — первое нажатие в сетке, дальше сетка отмечает сабстаты. Ярче — main, который кому-то нужен. Нажми выбранный ещё раз, чтобы убрать.`,`**Сабстаты** — нажми в сетке; ярче — статы, нужные билдам выбранного сета. Статы стоят парами по параметру, один над другим: ATK% над ATK, HP% над HP, DEF% над DEF, CHC над CHD, DMG UP% над DMG RED%, EFF% над RES%. Клетка с пометкой main — такого сабстата на этой вещи не бывает: он уже в main (HP% у шлема и ботинок, flat DEF у брони и перчаток, flat ATK у оружия). Flat EFF и flat RES в main сабстатам EFF% и RES% не мешают — в игре это разные статы. В сетке все 13 сабстатов игры; PEN%, CDMG RED%, flat EFF и flat RES сабстатами не бывают — только main.`,`**4-й сабстат у Epic** — Epic выпадает с тремя, четвёртый добавляет первый Reforge: один из статов, которых на вещи нет, с равными шансами. **Кубик** у штампа — «3/9»: столько из возможных вытянут вещь, даже с одним сегментом; какие и кому — в подробностях, в окне «+ 4-й сабстат от Reforge» они с точкой. Сделал Reforge — отметь выпавший.`,`Нажми на стат в строке, чтобы заменить его (жёлтые сегменты останутся) или убрать. При замене можно выбрать и стат из другой строки: он переедет сюда, а та строка освободится — так удобно вводить следующую вещь поверх прошлой. Убрать можно и повторным нажатием в сетке. Код, справка и настройки — в меню ☰.`],helpRoutine:`Как быстро разбирать`,helpRoutineItems:[`Всё ниже 6★ и ниже Epic — сразу в разбор.`,`Иди по инвентарю по дате получения: подряд обычно дропы одного забега, и сет остаётся с прошлой вещи.`,`**Epic-броня:** выбери слот и сет и посмотри на сетку. Ярких статов на вещи 0–1 — в разбор, ничего не вводя: «Оставить» и «Временно» так не бывает. У Speed, Immunity и Swiftness ярко почти всё — там вводи.`,`У Epic после двух ненужных сабстатов вердикт появляется сразу — третий можно не вводить.`,`**Кубик у «Разобрать»** — вещь может вытянуть один Reforge. Не разбирай её сразу: отложи, сделай Reforge и отметь 4-й сабстат. Не повезло — в разбор, дальше не вкладывай.`,`«Оставить» — поставь замок, чтобы не разобрать случайно; «Временно» — носи, пока не найдёшь лучше.`,`**Breakthrough у Epic** — только такой же вещью: Epic того же сета и слота, сабстаты не важны. Есть Epic-«Оставить» не на T4 — Epic того же сета и слота из разбора откладывай ему, нужно 4 штуки.`,`**Epic оружие и аксессуар:** на «Эндгейме» — в разбор; на «Развитии» сначала main stat: бледный — он никому не нужен, в разбор.`,`**Legendary** с «коплю фоддер»: вердикт покажет, какие прокачивать, а какие оставить на Breakthrough.`],helpVerdicts:[`**Оставить** — вещь нужна: носи и прокачивай, что именно — в блоке «Прокачка» в подробностях. «Стоит Reforge» — ролл хороший: после Reforge на полезных статах будет много сегментов, вкладывать в первую очередь. Вещь уже в билде — тоже «Оставить», без «Прокачки»: она надета.`,`**Временно** — носи, пока не найдёшь лучше: у оружия и аксессуара нет нужной пассивки, у Epic-брони только один главный стат. Кубик рядом — один Reforge может сделать её «Оставить».`,`**Фоддер** — оставь на Breakthrough такой же вещи с правильным main stat — или той, что уже надета не на T4 (см. «Экипировка»). Так же — у Legendary, которая никого не улучшит: всем, кому подходит, уже надето не хуже.`,`**Спорно** — решай сам: в подробностях написано, в чём сомнение (например, вещь хороша для персонажа не из твоего ростера). Кубик рядом — один Reforge может сделать её нужной твоим персонажам.`,`**Разобрать** — твоим персонажам не подходит, ролл слабый или всем, кому она подходит, уже надето не хуже (см. «Экипировка»). Кубик рядом — шанс, что вещь вытянет один Reforge: сколько статов из возможных, написано на нём.`],helpChars:[`Звёздочка отмечает персонажа в ростере; с галочкой «только мои персонажи» оценка учитывает только их. «Экспорт / импорт» переносит ростер кодом на другое устройство.`,`Нажми на персонажа — откроются его билды: сеты, оружие, приоритет сабстатов.`,`**Экипировка** — что надето в каждом билде. Вещь в билд кладёт вердикт: «Надеть на…» в подробностях, на телефоне — ещё и кнопка под карточкой. Потом в карточке персонажа нажми на вещь — отметь оранжевые сегменты после Reforge и Breakthrough; сколько Reforge сделано, приложение считает само. Enhance не отмечается: считаем, что надетое на +10. Кто что носит — ☰ → «Экипировка», на компьютере — фильтр «с экипировкой» в «Персонажах». Во время обучения кода экипировки нет: на странице пример.`,`**Примерка** — оценка для одного билда: «Собрать билд», «Примерить» у пустого слота или «Примерить замену» у вещи в карточке персонажа. Сравнение — только с ним, «Надеть» — сразу ему, «Следующий» примерку не сбрасывает, ✕ — снова для всех.`,`**Сейчас на персонажах** — в подробностях вердикта: у кого из тех, кому вещь подходит, в собираемом билде слот пуст, а у кого новая лучше или хуже надетой — две цепочки рядом и на сколько по полезным сегментам с учётом Reforge впереди; у оружия и аксессуара, где решает пассивка, — «рекомендованная» или «временная». Штамп от надетого меняется так. «Разобрать» → «Фоддер», если такая же вещь надета не на T4 и её Breakthrough отмечен — эта ей материал; а если эта лучше надетой — надень её, старую отдай ей в Breakthrough. «Оставить» и «Временно» → «Разобрать», если введены все сабстаты и всем, кому вещь подходит, в собираемых билдах уже надето не хуже (Legendary «Оставить» — «Фоддер», броня — если копишь фоддер). Штамп держат: персонаж, у которого в «Экипировке» ничего нет, пустой слот (и в билде примерки), другая рекомендованная пассивка, «на уровне» только из-за T4 у надетой. «Разобрать», «Фоддер» и «Спорно» у вещи, которая уже в билде, — «Оставить». Резервная копия — код OGC-GEAR1 в «Экспорт / импорт».`],helpCode:`Код для гильдии`,helpCodeText:e=>`В подробностях вердикта есть код вещи, например ${e}. Скопируй его в чат игры; кто получил — нажимает «Ввести код» и перепечатывает. Оценка у каждого — по своему ростеру.`,helpInstall:`Установка`,helpInstallItems:[`**Android (Chrome):** меню ⋮ → «Установить приложение» или «Добавить на главный экран».`,`**iPhone и iPad:** в Safari «Поделиться» → «На экран „Домой“».`,`Установленное приложение работает без сети. Когда выйдут новые данные outerpedia, появится плашка «Обновить»; улучшения приложения ставятся сами при следующем запуске.`],wikiLink:`Подробное руководство — в Wiki ↗`,wikiUrl:`https://github.com/cotton-more/outerplane-gear-check/wiki/Начало-работы`},material:{title:(e,t)=>`Фоддер — материал Breakthrough для ${e} ${t}`,need:(e,t,n,r)=>`${e} ${t} — T${n}, ещё ${r} шт. до T4`,line:e=>`**Материал**: такая же вещь надета не на T4 — ${e}. Одна вещь — одна ступень Breakthrough, сабстаты не важны.`,plan:`**Не прокачивай и не разбирай** — отдай в Breakthrough надетой: одна вещь — одна ступень.`,planGamble:`**Не прокачивай** (кроме одного Reforge на удачу — кубик рядом) **и не разбирай** — отдай в Breakthrough надетой: одна вещь — одна ступень.`,titleWear:(e,t)=>`Фоддер — лучше надетого ${e} ${t}: надень её, а старую — ей в Breakthrough`,lineWear:e=>`**Лучше надетой**: такая же вещь надета не на T4, но слабее этой — ${e}. Надень эту, а старую отдай ей в Breakthrough.`,planReplace:e=>`**Надень её** на ${e}: она лучше надетой, а старая — такая же вещь: отдай её новой в Breakthrough, одна вещь — одна ступень.`,planWear:e=>`**Надень её** на ${e}, пока нет лучше, — в Breakthrough надетой не отдавай.`},worn:{title:(e,t,n)=>`${e===`fodder`?`Фоддер`:`Разбирай`} — уже ${n?`не хуже`:`лучше`} у ${t.length>2?`${t.slice(0,2).join(`, `)} и ещё ${t.
