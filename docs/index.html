ttings.`,verdictLabel:{keep:`Keep`,temp:`Stopgap`,maybe:`Maybe`,fodder:`Fodder`,junk:`Dismantle`,idle:`…`},verdict:`Verdict`,tierLegend:`The chain is the build substat priority, left is more important. Green — on the item and counted, yellow — counts as ½, grey — on the item but beyond the chain's 4th place (doesn't count toward the "good" bar, except SPD; points still count) or a flat stat that gives the character almost nothing, dashed — not on the item. Flat and % are different stats of one parameter: % counts in full, flat by its value for the character, never above %. Marked main — the parameter is in the item's main (grows with Enhance, not Reforge); if the other stat of the pair can still roll as a substat (flat ATK with an ATK% main, EFF% with a flat EFF), it sits next to it after «/», dashed if it isn't there: only the substat counts. Crossed out — the build does not need it.`,altGroup:`Below — the set is only in an alternative combo of the build`,showAll:e=>`show all (${e})`,scoreTitle:(e,t,n)=>`Useful substats: ${e} of ${t}; weighted by priority — ${n}%`,openBuilds:`Open builds`,alsoBuilds:e=>` · also: ${e}`,anyMain:`any`,toEval:`← Evaluate`,verdictDetails:`Verdict — show details`,backToEval:`Back to evaluation`,reset:`Next`,undoText:`Item cleared`,undoAction:`Undo`,details:`details`,charsHint:`☆ — mark yours: the evaluation will consider only them`,charSearch:`Name: Stella, Demiurge, Gnosis…`,modeGroup:`Who to show`,modeMine:`Mine`,modeToDress:`To dress`,filter:`Filter`,filterReset:`Reset`,filterOff:e=>`${e} — clear filter`,tradeBtn:`Trade`,nobodyFound:`Nobody found.`,rosterToggle:(e,t)=>`${e} — ${t?`remove from roster`:`add to roster`}`,rosterSelected:`Selected — press Ctrl/Cmd+C`,rosterApplied:(e,t,n)=>`${e?`Replaced`:`Added`}: ${t}${n?`; not recognized: ${n}`:``}`,replace:`Replace`,charBuilds:`Character builds`,pickChar:`Pick a character — I'll show the recommended sets, weapons, accessories and substat priority from outerpedia builds.`,toList:`← to list`,opedia:`outerpedia`,opediaAria:e=>`${e} on outerpedia (opens in a new tab)`,builds:`Builds`,noBuilds:`outerpedia doesn't have gear recommendations for this character yet.`,gameSets:e=>`The game itself suggests sets: ${e}.`,armorSets:`Armor sets`,or:`or`,weapon:`Weapon`,accessory:`Accessory`,subPriority:`Substat priority`,notSub:`doesn't drop as a substat on 6★ gear`,prioGap:`gap in the priority`,talismans:`Talismans`,buildNote:`outerpedia note`,badMain:`this item can't have this main stat — probably a typo on outerpedia`,flatEqual:e=>` — flat and ${e}% are about equal, take either.`,flatBetter:(e,t)=>` — flat is better: a flat ${e} segment gives ≈${t}% of an ${e}% segment (i.e. more).`,pctBetter:(e,t)=>` — ${e}% is better: a flat ${e} segment gives only ≈${t}% of an ${e}% segment.`,flatFor:(e,t)=>`For lv ${e}${t?` with upgraded Quirks`:` without Quirks`} — change it in "Evaluation settings".`,howTo:`How to use`,steps:[`**Mark your characters** — until you do, the evaluation considers every character in the game.`,`**Enter the item:** slot, grade (L — Etheric, E — Steel), set or item; substats in the grid, in order, as in the game: tap a stat, then pick in the window how many segments are lit.`,`**The verdict** appears right away, with an explanation. "Next" — on to the next item; slot, grade, set and main stay, substats are cleared.`],markChars:`Mark characters`,canInstall:`You can install it as an app — works offline too.`,install:`Install`,iosInstall:`**iPhone and iPad:** Safari → Share → "Add to Home Screen" — works offline too.`,helpInput:`Entering an item`,helpInputItems:[`**Armor** — the set: it's in the name after "of" (Etheric Gloves of Speed → Speed Set).`,`**T4** next to the set, item or main stat (on an Epic weapon or accessory) — the piece is already at Breakthrough T4. For armor its set bonus (Speed ×2 and others) counts at T4; for any piece, no more copies are needed for its Breakthrough. A fresh drop is T0 — leave it off. "T?" on an older record means Breakthrough isn't set: it counts as below T4.`,`**Legendary weapon and accessory** — find the item and mark the main stat. The list is alphabetical; when the search leaves one item, it lights up and gets picked by itself. Brand new and not listed yet — "not listed".`,`**Epic weapon and accessory** (Steel…) — no passive, straight to the main stat.`,`**Main stat** on a weapon or accessory — the first tap in the grid (a weapon: ATK%, DEF% or HP%), after that the grid marks substats. Brighter — a main someone needs. Tap the chosen one again to remove it.`,`**Substats** — tap them in the grid; brighter ones are needed by builds with the chosen set. Stats sit in pairs by parameter, one above the other: ATK% over ATK, HP% over HP, DEF% over DEF, CHC over CHD, DMG UP% over DMG RED%, EFF% over RES%. A cell marked main never rolls as a substat on this piece — it is already in the main (HP% on helmets and boots, flat DEF on chest armor and gloves, flat ATK on weapons). A flat EFF or flat RES main doesn't block EFF% and RES% substats — in the game they are different stats. The grid has all 13 substats in the game; PEN%, CDMG RED%, flat EFF and flat RES never roll as substats — only as mains.`,`**Segments** — how many are lit on the substat in the game, 1–6 (yellow and orange together). You pick them in the window right after tapping the grid; tap outside the window and the stat isn't added. To fix them — the buttons in the row. A fresh drop has up to 4. The verdict takes the piece as it is: Reforges still ahead don't count.`,`**4th substat on an Epic** — usually an Epic drops with three and the first Reforge adds a fourth; some drop with four. If the piece has one — "+ 4th substat" under the rows.`,`Tap a stat in its row to replace it (its segments stay) or remove it. When replacing, you can also pick a stat from another row: it moves here and that row is freed — handy for entering the next piece over the last one. Tapping it again in the grid removes it too. Code, help, the tutorial and settings are in “More”: ☰ on the bar at the bottom, “⋯” in the header on a computer.`],helpRoutine:`How to clean up fast`,helpRoutineItems:[`Everything below 6★ and below Epic — dismantle right away.`,`Go through the inventory by date received: consecutive drops usually come from one run, and the set stays from the previous piece.`,`**Epic armor:** pick the slot and set and look at the grid. 0–1 bright stats on the piece — dismantle without entering anything: "Keep" and "Stopgap" almost never happen then. For Speed, Immunity and Swiftness almost everything is bright — enter those.`,`For Epic, the verdict appears after two useless substats — no need to enter the third.`,`"Keep" — lock it so you don't dismantle it by accident; "Stopgap" — wear it until you find better.`,`**Epic Breakthrough** — only Epic armor, and only with the same piece, any substats: an Epic of the same set and slot. One piece — one step; no need to save up four: "Fodder" says which piece to feed this one to now, or keeps it in reserve. Armor marked "Stopgap" can take Breakthrough too: T4 counts toward the set bonus. An Epic weapon or accessory is a stopgap — no Breakthrough, dismantle its copies. A weapon or accessory gets Breakthrough only when it is "Keep": a Legendary from the hero's builds with the right main stat.`,`**Epic weapon and accessory:** in "Endgame" — dismantle; in "Progression" the main stat first: grey — no one needs it, dismantle.`,`**Legendary:** the verdict shows whom to equip and what to upgrade; a weak one goes to reserve or to dismantle, as the verdict says.`,`**Batch** — many pieces from one filter? Tap "Batch" (on a phone — in More; it's there when your heroes are marked and "only my characters" is on) and enter the pieces in a row, as the game lists them: "Add" adds a piece, no verdict on the way. One filter per batch: one armor set, or weapons, or accessories, and one grade — the first piece's (both grades — two batches: Legendary first, then Epic); in the game show worn pieces, sorted by date. Enter a worn piece with "E" next to "Add" (pick the hero): no substats, it holds the number. A locked one — with the lock button next to it: enter its substats like a usual piece's — the list shows them so you know which piece it is; the plan doesn't rate it. ✕ in the list removes a piece, "Undo" in the message brings it back. "Plan it" — a plan for each: whom to equip it on, set it aside for, what to feed, what to dismantle; a piece the plan takes off a hero gets its own line; a recommended Legendary that loses points shows its cost on the row: "−4.9 pts, better passive". "Don't take" — plan again without that hero. A piece that would suit only heroes outside your roster is dismantled: there's no one to set it aside for.`,`**Walk ▸** — steps by game screen; at the top — the game filter, e.g. "Epic Speed · worn shown · by date". 1 — equip at the heroes ("Caren → helmet", on the right in grey "No. 7" — its place in the hero's helmet list in the game; the class icon in the element's colour by the name helps find the hero; check the substats), 2 — lock ("Row 3, no. 1 · #21", below — for whom and "reserve"), 3 — Breakthrough ("Caren's helmet → Breakthrough: up to 4": any piece from the game's list works; a target you set aside is named "Caren's set-aside helmet" with its substats), 4 — dismantle in one selection, last, so nothing meant for a Breakthrough goes (each piece's substats, for a weapon or accessory also its name and main; after a Breakthrough step, at the end "+ feed the Breakthrough didn't take"; unlock the locked ones first). Steps 3 and 4 have no numbers or places — find the pieces by their substats; several identical — take the first. Tick ✓ — the walk is saved. At the end "Record the plan" and confirm: equips and set-asides are recorded at once, "Undo" reverts all.`],helpVerdicts:[`**Keep** — worth wearing: equip it on the named hero or keep it for them. A Legendary no worse by points than the worn Epic of that slot is "Equip" too: its main stat is bigger. What to upgrade — in the "Upgrading" block in the details.`,`**Stopgap** — wear it until a good one drops: a weapon or accessory without the needed passive, or Epic armor with only one key stat.`,`**Fodder** — this piece is the material: Breakthrough with it now, or keep it in reserve for a future strong one. A hero keeps up to 4 reserves of one kind, all heroes together at most 8 of one kind; the rest is "Dismantle" — lock the reserves in the game. A T4 piece nobody wears is material too: the target goes straight to T4. Legendary armor takes only Legendary material: keep a weak Legendary in reserve even when a good Epic of that set and slot is worn. Don't feed a Legendary you replaced to Breakthrough: evaluate it first — it may suit another hero.`,`**Maybe** — your call: the details say what's in doubt (e.g. it's good for a character outside your roster).`,`**Dismantle** — nobody needs it: everyone already has as good, or it's weak.`,`**Points** — a segment of the chain's first stat = 1, later places less (0.8; 0.65; 0.5; 0.4…), a perfect line = 6. Half a set from the hero's builds is worth the hero's best stat bonus for 2 pieces.`,`**Good** — passes the old bar (usually 3 useful substats) or is worth 6+ points.`],helpChars:[`The star adds a character to your roster; with "only my characters" checked (More → Settings), the evaluation considers only them. The list shows "Mine" (all yours, with builds and without), "To dress" (yours with fewer than 6 of 6 equipped); with neither pressed — everyone with builds (a hero without builds is found by name), pressing again unpresses; element and class are under the filter button, the chosen ones show as chips above the list. More → Backup is the roster and gear in one code, to move to another device; "Replace" also reads the older roster and gear codes. Only roster characters have gear: "Equip" adds a character to the roster, loading a backup adds everyone who has gear, and unstarring a character with gear asks whether to remove the gear. Core Fusion replaces the hero: star Core Fusion Eternal and Eternal's gear moves to Core Fusion Eternal, while Eternal turns inactive (the pair keeps its place in the list: Core Fusion Eternal right after Eternal); the star on Eternal switches back.`,`Tap a character to open their card. The star is on the card too, next to the name; element and class are icons on the portrait, and "outerpedia ↗" opens the character's page on outerpedia. Three tabs: "Worn" — what they wear in the game; "Pool" — all their pieces and why each is kept; "Builds" — the outerpedia reference, view only.`,`**Equipment** — pieces kept for a character. The evaluation picks the best of them itself: stats and the sets from outerpedia builds count together, no build to pick. A piece reaches a character with "Equip" — in the verdict details, on a phone also the button under the card: the piece is recorded as worn in its slot. A verdict offers it to those who gain the most points. For another hero search by name in "Equip on…" or tap "Rate a piece for Caren": there "Equip" is on every piece, to record what the hero wears. "Equip" removes from the hero's gear what they no longer need, and says so. "Set aside for Caren" records a piece for the hero without wearing it: it stays in the Pool and counts in later evaluations. Rated a set-aside piece again (same stats in the same order)? The verdict says "Looks like the …" and offers no "Equip" or "Set aside" to anyone else; two such pieces in the game — "It's a different one". A character's piece can be edited only in segments, "T4" and an Epic's 4th substat: did a Reforge or Breakthrough? Tap it in the Pool and fix it. Transistone changed a stat? Enter the piece again and "Equip", and "Remove from Caren" this one. Enhance isn't tracked: pieces are assumed to be +10. Set bonuses follow the pieces' Breakthrough: ×2 at T4 when at least two pieces of the set are T4; ×4 at T4 when all four are. Dismantled a piece or used it for Breakthrough? "Remove from Caren" on the piece card. Who still needs gear — "To dress" above the list (on a phone also More → "To dress · N"). "Share" on the Worn tab gives a link: a friend sees what the hero wears and which set is pinned — view only, nothing changes on their side. During a tutorial there's no backup: the page shows an example.`,`**Worn** — next to the heading, the points of what is worn: pieces plus sets; each piece shows its points. Tap the heading ▾ — where they come from: stats per slot, sets, and the weapon and accessory passive ("recommended", "stopgap", "not in builds"; the passive isn't in points: a recommended weapon goes in before any substats). Under the heading, the hero's stat chain in its order (first — the most valuable) and how many segments the worn pieces give each stat: green counts in full, yellow (flat) at half, paler — fewer segments, dashed — no piece gives the stat. A hero with two chains (different builds) shows both, named by build; points follow the first. Below, each set stands on its own line with what it adds on the right (the points of its bonus on top of the pieces') and its bonuses under it; when Breakthrough T4 on worn armor would add 1+ points of set bonus, a faint line says on which pieces.`,`**Pool and "Re-dress"** — the Pool lists all the hero's pieces with the reason each is kept: "worn", "best {set}" (also "at T4"; only for a pinned set), "by stats", "reserve"; everything else is "no longer needed": dismantle it in the game and remove it with "Remove from Caren" (the app never deletes silently). On Worn, the "Re-dress: +N pts" button appears when the hero's own pieces can make a layout 1+ point better than what's worn; a Legendary in place of an Epic — already at equal points (or with a recommended weapon or accessory — "Re-dress: better passive"): the sheet shows the result, what turns on and off, and "Wear" per piece or "Wear all N". Under the slots — "What to look for": sets from the builds where the hero has 1–3 of 4 pieces, which slots are missing and what completing the set is worth in points (a set that would add nothing, or cost the one already worn, isn't listed; a pinned hero's set stays). In the game you do it yourself — the app only calculates.`,`**Pin a set** — by default a hero is evaluated "By stats": the chain of their builds and all the sets from them together. Need a specific set? "Pin a set" on the card: pieces of other sets with good stats will be dropped (what's worn stays until a piece of the set takes the slot). To change or remove — the same button, "By stats — not pinned".`,`**Rate a piece for Caren** — on the character card: above the form, "Only for · Caren". The card line, "On your characters now" and "Equip" are only about Caren; "Equip" is there even for a useless piece, to record what the hero wears; the stamp is shared. "Next" keeps the mode, ✕ — everyone again. "Enter" on an empty slot puts the slot on the form, "Try a replacement" on a piece — its slot and set; "Replace" removes exactly that piece, whether the new one is better or worse.`,`**On your characters now** — in the verdict details, a row per roster hero who gains the most: "+N pts" — how much stronger they get with the piece, "turns on / turns off" — set bonuses. "Replace" instead of "Equip" — the slot already has a piece. The stamp is about the piece itself. A weak piece that beats what's worn stays "Fodder" or "Dismantle" — a quiet line says whom it would help most and what to look for. Backup — the OGC-GEAR4 code in More → Backup: pieces, what's worn and pinned sets; older codes still read.`],helpTrade:`Trade gear`,helpTradeItems:[`Works out how to re-dress a hero (or a team of four) from the pieces already in your roster and inventory. Open it with "Trade ▸" on a hero card (that hero's plan) or "Trade" above the character list and "Team trade" in More on a phone (straight to the team). In the game you do it yourself — the app only calculates.`,`**Hero** — whom to re-dress; **Team** — four places in a diamond: they swap pieces among themselves and take from everyone else. A member is a tile; tap it to put another hero there or "Remove from team". Under the tile — the hero's order ("Order: … ▾"): "By stats" or one of the sets from their builds; tap to change. A hero with a pinned set has one order — "Pinned".`,`**Session:** while the trade window is open, what already re-dressed heroes wear is not taken by the next ones; their spares can be. Close the window — no restrictions.`,`The plan: for each receiver — how many points stronger ("+4.2 pts") or weaker ("Stats drop by N pts") they get, which set bonuses turn on, what to put on, how many points each piece gives over the worn one ("+1.6 pts"; a recommended weapon or accessory says "better passive", even with fewer points), where each piece comes from (a hero or the inventory) and how to find it in the game — the source is small under the piece, weapons and accessories also get Secondary ↓. If the order lacks pieces of its set, a line says so. "Don't take" looks for another piece. An empty slot shows "Search:" with a hint. The plan shows only whom you re-dress; heroes you take pieces from are not shown.`,`**Holes are not filled:** a piece taken off stays off until you enter a new one through evaluation.`,`**Done** — all done in the game: the plan is saved. **Cancel** — nothing changed. Right after "Done" there is "Undo". A copy that is in no pool leaves the app but stays in your game inventory.`,`**"Re-dress"** on the Worn tab uses the same threshold as the trade: the best layout from the hero's own pieces beats what's worn by at least 1 point (a Legendary in place of an Epic — no worse), turns on an effect-set bonus or puts on a recommended weapon or accessory.`],helpCode:`Code for your guild`,helpCodeText:e=>`The verdict details and a character's piece card show the item's code, e.g. ${e}. Copy it into the game chat; whoever gets it taps "Enter code" and types it in. Everyone gets the verdict for their own roster. A piece with 5–6 segments gets a code 1–2 letters longer.`,helpInstall:`Installing`,helpInstallItems:[`**Android (Chrome):** menu ⋮ → "Install app" or "Add to Home screen".`,`**iPhone and iPad:** in Safari, Share → "Add to Home Screen".`,`The installed app works offline. When new outerpedia data is out, an "Update" banner appears; app improvements install by themselves on the next launch.`],wikiLink:`Full guide — in the Wiki ↗`,wikiUrl:`https://github.com/cotton-more/outerplane-gear-check/wiki/Getting-started`},worn:{line:`**Won't improve anyone**: everyone it fits already wears as good or better. The piece itself isn't bad.`,stale:`Dismantled a piece in the game? Remove it on the character card and the verdict follows.`},tryon:{label:`Only for`,end:`Rate for everyone`,rateFor:e=>`Rate a piece for ${e}`,clause:(e,t,n=!1)=>({wearEmpty:n?`${t}: empty slot — fine for now`:`equip on ${t}`,wear:`better than on ${t}`,keep:`keep it for ${t}`,none:`${t} already has as good`,weak:`weak for ${t}`})[e]??``,butWear:(e,t)=>`but ${e===`fill`?`${t}'s slot is empty`:`better than what ${t} wears`}: wear it until you find better`,offHero:(e,t)=>`${e} doesn't need it: ${t} isn't in ${e}'s builds.`,offStats:e=>`It fits ${e} by stats, not by build.`,noStats:e=>`This piece gives ${e} nothing: no useful stats.`,noClass:e=>`${e} can't wear this item: it's for another class.`,replace:`Try a replacement`},trade:{title:`Trade gear`,open:`Trade ▸`,teamOpen:`Team trade`,modeHero:`Hero`,modeTeam:`Team`,pickHero:`Who to re-dress?`,noHeroes:`No characters with builds in roster — mark them with a star in "Characters".`,teamHint:`Four characters, like a team in game: swap gear and take from the rest.`,pickMember:`Who goes here?`,addMember:`Team slot`,removeMember:e=>`Remove from team: ${e}`,count:`Calculate`,counting:`Calculating…`,cancel:`Cancel`,done:`Done`,ok:`OK`,nothing:`Nothing to change`,gainPts:e=>e>0?`▲ +${N(e)} pts`:e<0?`▼ −${N(- писку`,opedia:`outerpedia`,opediaAria:e=>`${e} на outerpedia (откроется в новой вкладке)`,builds:`Билды`,noBuilds:`У outerpedia пока нет рекомендаций по шмоту для этого персонажа.`,gameSets:e=>`Сама игра советует сеты: ${e}.`,armorSets:`Сеты брони`,or:`или`,weapon:`Оружие`,accessory:`Аксессуар`,subPriority:`Приоритет сабстатов`,notSub:`не выпадает сабстатом на 6★ снаряжении`,prioGap:`разрыв в приоритете`,talismans:`Талисманы`,buildNote:`Заметка outerpedia`,badMain:`у этого предмета не бывает такого main stat — вероятно, опечатка в outerpedia`,flatEqual:e=>` — flat и ${e}% примерно равны, бери любой.`,flatBetter:(e,t)=>` — выгоднее flat: сегмент flat ${e} даёт ≈${t}% от сегмента ${e}% (то есть больше).`,pctBetter:(e,t)=>` — выгоднее ${e}%: сегмент flat ${e} даёт только ≈${t}% от сегмента ${e}%.`,flatFor:(e,t)=>`Для lv ${e}${t?` с прокачанными Quirks`:` без Quirks`} — меняется в «Настройках оценки».`,howTo:`Как пользоваться`,steps:[`**Отметь своих персонажей** — пока их нет, оценка идёт по всем персонажам игры.`,`**Вбей вещь:** слот, грейд (L — Etheric, E — Steel), сет или предмет; сабстаты — сеткой, по порядку, как в игре: нажал стат — в окне выбери, сколько сегментов горит.`,`**Вердикт** — сразу, с объяснением. «Следующий» — к следующей вещи: слот, грейд, сет и main остаются, сабстаты очищаются.`],markChars:`Отметить персонажей`,canInstall:`Можно установить как приложение — работает и без сети.`,install:`Установить`,iosInstall:`**iPhone и iPad:** Safari → «Поделиться» → «На экран „Домой“» — будет работать и без сети.`,helpInput:`Ввод вещи`,helpInputItems:[`**Броня** — сет: он в названии после «of» (Etheric Gloves of Speed → Speed Set).`,`**T4** рядом с сетом, предметом или main (у Epic оружия и аксессуара) — вещь уже на Breakthrough T4. У брони бонус сета (Speed ×2 и другие) считается на T4; у любой вещи такие же ей в Breakthrough больше не нужны. Свежий дроп — T0, не отмечай. «T?» у старой записи — Breakthrough не указан: считается ниже T4.`,`**Legendary оружие и аксессуар** — найди предмет и отметь main stat. Список по алфавиту; остался один подходящий по поиску — он подсветится и выберется сам. Совсем новый, которого нет в списке, — «нет в списке».`,`**Epic оружие и аксессуар** (Steel…) — пассивки нет, сразу main stat.`,`**Main stat** у оружия и аксессуара — первое нажатие в сетке (у оружия — ATK%, DEF% или HP%), дальше сетка отмечает сабстаты. Ярче — main, который кому-то нужен. Нажми выбранный ещё раз, чтобы убрать.`,`**Сабстаты** — нажми в сетке; ярче — статы, нужные билдам выбранного сета. Статы стоят парами по параметру, один над другим: ATK% над ATK, HP% над HP, DEF% над DEF, CHC над CHD, DMG UP% над DMG RED%, EFF% над RES%. Клетка с пометкой main — такого сабстата на этой вещи не бывает: он уже в main (HP% у шлема и ботинок, flat DEF у брони и перчаток, flat ATK у оружия). Flat EFF и flat RES в main сабстатам EFF% и RES% не мешают — в игре это разные статы. В сетке все 13 сабстатов игры; PEN%, CDMG RED%, flat EFF и flat RES сабстатами не бывают — только main.`,`**Сегменты** — сколько горит у сабстата в игре, 1–6 (жёлтые и оранжевые вместе). Их выбираешь в окне сразу после нажатия в сетке; нажал мимо окна — стат не добавится. Поправить — кнопками в строке. Свежий дроп — до 4. Вердикт — по вещи как есть: Reforge, которые впереди, не считаются.`,`**4-й сабстат у Epic** — обычно Epic выпадает с тремя, четвёртый добавляет первый Reforge; бывает и сразу с четырьмя. Есть он на вещи — «+ 4-й сабстат» под строками.`,`Нажми на стат в строке, чтобы заменить его (сегменты останутся) или убрать. При замене можно выбрать и стат из другой строки: он переедет сюда, а та строка освободится — так удобно вводить следующую вещь поверх прошлой. Убрать можно и повторным нажатием в сетке. Код, справка, обучение и настройки — в «Ещё»: ☰ на плашке внизу, на компьютере — «⋯» в шапке.`],helpRoutine:`Как быстро разбирать`,helpRoutineItems:[`Всё ниже 6★ и ниже Epic — сразу в разбор.`,`Иди по инвентарю по дате получения: подряд обычно дропы одного забега, и сет остаётся с прошлой вещи.`,`**Epic-броня:** выбери слот и сет и посмотри на сетку. Ярких статов на вещи 0–1 — в разбор, ничего не вводя: «Оставить» и «Временно» так почти не бывает. У Speed, Immunity и Swiftness ярко почти всё — там вводи.`,`У Epic после двух ненужных сабстатов вердикт появляется сразу — третий можно не вводить.`,`«Оставить» — поставь замок, чтобы не разобрать случайно; «Временно» — носи, пока не найдёшь лучше.`,`**Breakthrough у Epic** — только у брони и только такой же вещью, сабстаты не важны: Epic того же сета и слота. Одна вещь — одна ступень; копить до 4 не нужно: «Фоддер» скажет, какой вещи отдать эту сейчас, или оставит в запасе. Броне «Временно» Breakthrough тоже можно: T4 засчитывается в бонус сета. Epic оружие и аксессуар — вещи на замену: Breakthrough не делай, их копии — в разбор. Оружию и аксессуару Breakthrough — только если они «Оставить»: Legendary из билдов героя с нужным main.`,`**Epic оружие и аксессуар:** на «Эндгейме» — в разбор; на «Развитии» сначала main stat: серый — он никому не нужен, в разбор.`,`**Legendary:** вердикт покажет, кому её надеть и что прокачивать; слабую — в запас или в разбор, как скажет вердикт.`,`**Партия** — много вещей одного фильтра? Нажми «Партия» (на телефоне — в «Ещё»; она есть, когда отмечены твои герои и включено «только мои персонажи») и вводи вещи подряд, как в игре: «В партию» добавляет вещь, вердикта по дороге нет. В партии — один фильтр: один сет брони, или оружие, или аксессуары, и один грейд — как у первой вещи (оба грейда — двумя партиями: сначала Legendary, потом Epic); в игре надетые показывай, сортировка по дате. Надетую вещь вводи кнопкой «E» рядом с «В партию» (выбери героя): сабстаты не нужны, она держит номер. Заблокированную — кнопкой с замком рядом: введи её сабстаты, как обычной вещи, — по ним в списке видно, какая это вещь; план её не оценивает. ✕ в списке убирает вещь, «Вернуть» в сообщении — возвращает. «Посчитать» — план на каждую: кому надеть, кому отложить, чем кого кормить, что разобрать; вещь, которую план снимает с героя, получает свою строку; у рекомендованного Legendary, который проигрывает по очкам, на строке цена: «−4,9 очк., пассивка лучше». «Не брать» — пересчитать без этого героя. Вещь, которая подошла бы только героям не из ростера, план разбирает: откладывать её не для кого.`,`**Обход ▸** — шаги по экранам игры; вверху — фильтр игры, например «Epic Speed · надетые показывать · по дате». 1 — надеть у героев («Caren → шлем», справа серым «№ 7» — место в списке шлемов героя в игре; значок класса в цвете стихии у имени помогает найти героя; сверь сабстаты), 2 — замок («Ряд 3, 1-й · #21», ниже — для кого и «запас»), 3 — Breakthrough («Шлем Caren → Breakthrough: до 4»: подойдёт любая вещь из списка игры; цель, которую ты отложил, названа «Отложенный шлем Caren» с сабстатами), 4 — разобрать одним выбором, в самом конце, чтобы не разобрать корм (сабстаты каждой вещи, у оружия и аксессуара ещё название и main; если был шаг Breakthrough — внизу «+ корм, который Breakthrough не взял»; закрытые замком сначала разблокируй). В шагах 3 и 4 нет номеров и мест — ищи вещи по сабстатам; одинаковых несколько — бери первую. Отмечай ✓ — обход сохраняется. В конце «Записать план» и подтверди: надетое и отложенное запишутся разом, «Вернуть» отменит всё.`],helpVerdicts:[`**Оставить** — вещь стоит носить: надень на названного героя или держи для него. Legendary не хуже по очкам, чем надетый Epic того же слота, тоже «Надеть»: main у неё больше. Что прокачивать — в блоке «Прокачка» в подробностях.`,`**Временно** — носи, пока не найдёшь годную: у оружия и аксессуара нет нужной пассивки, у Epic-брони только один главный стат.`,`**Фоддер** — эта вещь и есть материал: сделай ею Breakthrough сейчас или держи в запасе для будущей сильной. В запасе — до 4 вещей одного вида на героя и не больше 8 одного вида на всех героев, остальное — «Разобрать»; в игре ставь на запасные замок. Вещь на T4, которую никто не носит, — тоже материал: цель сразу станет T4. Legendary-броне материал — только Legendary: слабый Legendary держи в запасе, даже если надет годный Epic того же сета и слота. Снятую при замене Legendary в Breakthrough не отдавай: сначала оцени её — может подойти другому герою.`,`**Спорно** — решай сам: в подробностях написано, в чём сомнение (например, вещь хороша для персонажа не из твоего ростера).`,`**Разобрать** — никому не нужна: у всех уже не хуже, или она слабая.`,`**Очки** — сегмент первого стата цепочки = 1, дальше меньше (0,8; 0,65; 0,5; 0,4…), идеальная строка = 6. Половина сета из билдов героя стоит как его лучший статовый бонус на 2 вещи.`,`**Годная** — проходит прежний порог (обычно 3 полезных сабстата) или стоит 6+ очков.`],helpChars:[`Звёздочка отмечает персонажа в ростере; с галочкой «только мои персонажи» («Ещё» → «Настройки») оценка учитывает только их. Список показывает «Мои» (все твои, с билдами и без), «Доодеть» (твои, у кого надето меньше 6 из 6); ничего не нажато — все с билдами (героя без билдов найдёшь по имени), повторное нажатие снимает выбор; стихия и класс — под кнопкой фильтра, выбранные видны чипами над списком. «Ещё» → «Резервная копия» — ростер и вещи одним кодом, для переноса на другое устройство; «Заменить» понимает и прежние коды ростера и экипировки. Вещи бывают только у персонажей ростера: «Надеть» добавляет в ростер, загрузка копии — всех, у кого есть вещи; снимешь звезду с персонажа с вещами — приложение спросит, убрать ли их. Core Fusion заменяет героя: отметишь Core Fusion Eternal — вещи Eternal перейдут к Core Fusion Eternal, а Eternal станет неактивным (в списке пара на прежнем месте: Core Fusion Eternal сразу за Eternal); звезда на Eternal вернёт всё назад.`,`Нажми на персонажа — откроется его карточка. Звёздочка есть и в карточке, рядом с именем; стихия и класс — значками на портрете, «outerpedia ↗» открывает страницу персонажа на outerpedia. Три вкладки: «Надето» — что на нём в игре; «Пул» — все его вещи и зачем каждая; «Билды» — справка outerpedia, только посмотреть.`,`**Экипировка** — вещи у персонажа. Оценка сама берёт из них лучшее: статы и сеты из билдов outerpedia считаются вместе, билд выбирать не нужно. Вещь к персонажу кладёт «Надеть» — в подробностях вердикта, на телефоне ещё и кнопка под карточкой: вещь записывается надетой в своём слоте. Вердикт предлагает её тем, кому она даст больше всего очков. Другого героя найди по имени в «Надеть на…» или нажми «Оценить вещь для Caren»: там «Надеть» есть у любой вещи, чтобы записать, что носит герой. «Надеть» убирает из вещей героя то, что ему больше не нужно, и говорит об этом. «Отложить для Caren» — записать вещь герою, не надевая: она остаётся в «Пуле» и участвует в следующих оценках. Ввёл отложенную вещь ещё раз (те же статы в том же порядке) — вердикт скажет «Похоже, это …» и не даст другим ни «Надеть», ни «Отложить»; в игре таких две — «Это другой». Вещь персонажа правится только в сегментах, «T4» и 4-м сабстате у Epic: сделал Reforge или Breakthrough — нажми её в «Пуле» и поправь. Transistone сменил стат — введи вещь заново и «Надеть», а эту — «Убрать у Caren». Enhance не отмечается: считаем, что вещь на +10. Бонус сета — по Breakthrough вещей: ×2 на T4, если хотя бы две вещи сета на T4; ×4 на T4 — если все четыре. Разобрал вещь или пустил на Breakthrough — «Убрать у Caren» в карточке вещи. Кого доодеть — «Доодеть» над списком (на телефоне ещё «Ещё» → «Доодеть · N»). «Поделиться» во вкладке «Надето» даёт ссылку: друг увидит, что на герое надето и какой набор закреплён, — только просмотр, у него ничего не изменится. Во время обучения резервной копии нет: на странице пример.`,`**Надето** — рядом с заголовком очки надетого: вещи плюс сеты; у каждой вещи — её очки. Нажми на заголовок ▾ — откуда они: статы по слотам, сеты и пассивка оружия и аксессуара («рекомендовано», «временно», «нет в билдах»; пассивка — не очки: рекомендованное оружие встаёт раньше любых сабстатов). Под заголовком — цепочка статов героя в её порядке (первый — самый ценный) и сколько сегментов каждому стату дают надетые вещи: зелёный засчитан целиком, жёлтый (flat) — наполовину, бледнее — меньше сегментов, пунктир — ни одна вещь стат не даёт. У героя с двумя цепочками (разные билды) — обе, с именем билда; очки — по первой. Ниже каждый сет стоит отдельной строкой: справа — сколько он добавляет (очки его бонуса сверх очков вещей), под ним — его бонусы; если Breakthrough T4 у надетой брони добавит от 1 очка бонуса сета, бледная строка скажет, у каких вещей.`,`**Пул и «Переодеть»** — «Пул» показывает все вещи героя и справа причину, почему она держится: «надета», «лучший {сет}» (в том числе «на T4»; только у закреплённого набора), «по статам», «в запасе»; остальное — «больше не нужна»: разбери в игре и убери кнопкой «Убрать у Caren» (молча приложение ничего не удаляет). На «Надето» кнопка «Переодеть: +N очк.» появляется, когда из своих вещей героя можно собрать на 1+ очко лучше надетого; Legendary на место Epic — уже при равных очках (или с рекомендованным оружием или аксессуаром — «Переодеть: пассивка лучше»): шторка покажет итог, что включится и выключится, и «Надеть» у каждой вещи или «Надеть все». Под слотами — «Что искать»: наборы из билдов, где у героя 1–3 вещи из 4, каких слотов не хватает и сколько очков стоит собрать набор (набор, который ничего не добавит или обойдётся дороже надетого, не показывается; набор закреплённого героя остаётся). В игре всё делаешь сам — приложение только считает.`,`**Закрепить набор** — по умолчанию герой оценивается «По статам»: цепочка его билдов и все наборы из них вместе. Нужен конкретный набор — «Закрепить набор» в карточке: вещи других сетов с хорошими статами будут отбрасываться (надетое остаётся, пока слот не займёт вещь набора). Сменить или снять — та же кнопка, «По статам — не закреплять».`,`**Оценить вещь для Caren** — в карточке персонажа: над формой «Только для · Caren». Строка карточки, «Сейчас на персонажах» и «Надеть» — только про Caren; «Надеть» есть и у вещи без пользы — записать, что носит герой; штамп — общий. «Следующий» режим не сбрасывает, ✕ — снова для всех. «Ввести» у пустого слота ставит на форму слот, «Примерить замену» у вещи — слот и сет вещи; «Заменить» уберёт именно её, лучше новая или хуже.`,`**Сейчас на персонажах** — в подробностях вердикта, строка на героя ростера, кому вещь даст больше всего: «+N очк.» — на сколько он станет сильнее с ней, «включится / выключится» — бонусы сетов. «Заменить» вместо «Надеть» — в слоте уже есть вещь. Штамп говорит про саму вещь. Слабая вещь, которая лучше надетой, остаётся «Фоддер» или «Разобрать» — тихая строка скажет, кому она дала бы больше и что искать. Резервная копия — код OGC-GEAR4 в «Ещё» → «Резервная копия»: вещи, надетое и закреплённые наборы; прежние коды читаются.`],helpTrade:`Обмен вещами`,helpTradeItems:[`Считает, как переодеть героя (или команду из четырёх) вещами, что уже есть в ростере и инвентаре. Вход — «К обмену ▸» на карточке героя (план для него) или «Обмен» над списком персонажей и «Обмен для команды» в «Ещё» на телефоне (сразу команда). В игре всё делаешь сам — приложение только считает.`,`**Герой** — кого переодеть; **Команда** — четыре места ромбом: они меняются вещами между собой и берут у остальных. Член — плитка; нажми — поставить другого или «Убрать из команды». Под плиткой — заказ героя («Заказ: … ▾»): «По статам» или один из наборов его билдов; нажми — сменить. У закреплённого набора заказ один — «Закреплено».`,`**Сеанс:** пока окно обмена открыто, надетое на уже переодетых героях следующие не берут; их запас — можно. Закрыл окно — ограничений нет.`,`План: у каждого получателя — на сколько очков он станет сильнее («+4,2 очк.») или слабее («Статы станут слабее на N очк.»), какие бонусы сетов включатся, что надеть, сколько очков даёт каждая вещь против надетой («+1,6 очк.»; рекомендованное оружие или аксессуар — «пассивка лучше», даже если очков меньше), откуда вещь (у кого или в инвентаре) и как её найти в игре — источник мелко под вещью, у оружия и аксессуара ещё Secondary ↓. Если для заказа не хватает вещей набора — строка об этом честно. «Не брать» — искать другую вещь. У пустого слота — «Искать:» с подсказкой. В плане — только те, кого переодеваешь; у кого забираешь, не показываем.`,`**Дыры не закрываются:** снятая вещь остаётся снятой, пока не введёшь новую через оценку.`,`**Сделал** — в игре всё сделано: план сохраняется. **Отмена** — ничего не менялось. Сразу после «Сделал» — «Вернуть». Копия, которой нет ни в одном пуле, из приложения уйдёт, в инвентаре игры останется.`,`**«Переодеть»** на вкладке «Надето» — тот же порог, что и в обмене: лучшая раскладка из своих вещей лучше надетой хотя бы на 1 очко (Legendary на место Epic — не хуже по очкам), включает бонус сета-эффекта или ставит рекомендованное оружие или аксессуар.`],helpCode:`Код для гильдии`,helpCodeText:e=>`В подробностях вердикта и в карточке вещи персонажа есть код вещи, например ${e}. Скопируй его в чат игры; кто получил — нажимает «Ввести код» и перепечатывает. Оценка у каждого — по своему ростеру. У вещи с 5–6 сегментами код на 1–2 буквы длиннее.`,helpInstall:`Установка`,helpInstallItems:[`**Android (Chrome):** меню ⋮ → «Установить приложение» или «Добавить на главный экран».`,`**iPhone и iPad:** в Safari «Поделиться» → «На экран „Домой“».`,`Установленное приложение работает без сети. Когда выйдут новые данные outerpedia, появится плашка «Обновить»; улучшения приложения ставятся сами при следующем запуске.`],wikiLink:`Подробное руководство — в Wiki ↗`,wikiUrl:`https://github.com/cotton-more/outerplane-gear-check/wiki/Начало-работы`},worn:{line:`**Никого не улучшит**: всем, кому она подходит, уже надето не хуже. Сама по себе вещь неплохая.`,stale:`Разобрал вещь в игре — убери её в карточке персонажа, и вердикт пересчитается.`},tryon:{label:`Только для`,end:`Оценивать для всех`,rateFor:e=>`Оценить вещь для ${e}`,clause:(e,t,n=!1)=>({wearEmpty:n?`${t}: пустой слот — пока сойдёт`:`надень на ${t}`,wear:`лучше, чем на ${t}`,keep:`держи для ${t}`,none:`на ${t} уже не хуже`,weak:`дл
