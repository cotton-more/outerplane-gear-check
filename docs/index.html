an ATK% main, EFF% with a flat EFF), it sits next to it after «/», dashed if it isn't there: only the substat counts. Crossed out — the build does not need it.`,altGroup:`Below — the set is only in an alternative combo of the build`,showAll:e=>`show all (${e})`,scoreTitle:(e,t,n)=>`Useful substats: ${e} of ${t}; weighted by priority — ${n}%`,openBuilds:`Open builds`,alsoBuilds:e=>` · also: ${e}`,anyMain:`any`,toEval:`← Evaluate`,verdictDetails:`Verdict — show details`,backToEval:`Back to evaluation`,reset:`Next`,undoText:`Item cleared`,undoAction:`Undo`,details:`details`,charsHint:`☆ — mark yours: the evaluation will consider only them`,charSearch:`Name: Stella, Demiurge, Gnosis…`,modeGroup:`Who to show`,modeMine:`Mine`,modeToDress:`To dress`,modeAll:`All`,filter:`Filter`,filterReset:`Reset`,filterOff:e=>`${e} — clear filter`,tradeBtn:`Trade`,nobodyFound:`Nobody found.`,rosterToggle:(e,t)=>`${e} — ${t?`remove from roster`:`add to roster`}`,rosterSelected:`Selected — press Ctrl/Cmd+C`,rosterApplied:(e,t,n)=>`${e?`Replaced`:`Added`}: ${t}${n?`; not recognized: ${n}`:``}`,replace:`Replace`,charBuilds:`Character builds`,pickChar:`Pick a character — I'll show the recommended sets, weapons, accessories and substat priority from outerpedia builds.`,toList:`← to list`,opedia:`outerpedia`,opediaAria:e=>`${e} on outerpedia (opens in a new tab)`,builds:`Builds`,noBuilds:`outerpedia doesn't have gear recommendations for this character yet.`,gameSets:e=>`The game itself suggests sets: ${e}.`,armorSets:`Armor sets`,or:`or`,weapon:`Weapon`,accessory:`Accessory`,subPriority:`Substat priority`,notSub:`doesn't drop as a substat on 6★ gear`,prioGap:`gap in the priority`,talismans:`Talismans`,buildNote:`outerpedia note`,badMain:`this item can't have this main stat — probably a typo on outerpedia`,flatEqual:e=>` — flat and ${e}% are about equal, take either.`,flatBetter:(e,t)=>` — flat is better: a flat ${e} segment gives ≈${t}% of an ${e}% segment (i.e. more).`,pctBetter:(e,t)=>` — ${e}% is better: a flat ${e} segment gives only ≈${t}% of an ${e}% segment.`,flatFor:(e,t)=>`For lv ${e}${t?` with upgraded Quirks`:` without Quirks`} — change it in "Evaluation settings".`,howTo:`How to use`,steps:[`**Mark your characters** — until you do, the evaluation considers every character in the game.`,`**Enter the item:** slot, grade (L — Etheric, E — Steel), set or item; substats in the grid, in order, as in the game: tap a stat, then pick in the window how many segments are lit.`,`**The verdict** appears right away, with an explanation. "Next" — on to the next item; slot, grade, set and main stay, substats are cleared.`],markChars:`Mark characters`,canInstall:`You can install it as an app — works offline too.`,install:`Install`,iosInstall:`**iPhone and iPad:** Safari → Share → "Add to Home Screen" — works offline too.`,helpInput:`Entering an item`,helpInputItems:[`**Armor** — the set: it's in the name after "of" (Etheric Gloves of Speed → Speed Set).`,`**T4** next to the set, item or main stat (on an Epic weapon or accessory) — the piece is already at Breakthrough T4. For armor its set bonus (Speed ×2 and others) counts at T4; for any piece, no more copies are needed for its Breakthrough. A fresh drop is T0 — leave it off. "T?" on an older record means Breakthrough isn't set: it counts as below T4.`,`**Legendary weapon and accessory** — find the item and mark the main stat. Brand new and not listed yet — "not listed".`,`**Epic weapon and accessory** (Steel…) — no passive, straight to the main stat.`,`**Main stat** on a weapon — the ATK% / DEF% / HP% buttons next to the grade; on an accessory — the first tap in the grid, after that the grid marks substats. Brighter — a main someone needs. Tap the chosen one again to remove it.`,`**Substats** — tap them in the grid; brighter ones are needed by builds with the chosen set. Stats sit in pairs by parameter, one above the other: ATK% over ATK, HP% over HP, DEF% over DEF, CHC over CHD, DMG UP% over DMG RED%, EFF% over RES%. A cell marked main never rolls as a substat on this piece — it is already in the main (HP% on helmets and boots, flat DEF on chest armor and gloves, flat ATK on weapons). A flat EFF or flat RES main doesn't block EFF% and RES% substats — in the game they are different stats. The grid has all 13 substats in the game; PEN%, CDMG RED%, flat EFF and flat RES never roll as substats — only as mains.`,`**Segments** — how many are lit on the substat in the game, 1–6 (yellow and orange together). You pick them in the window right after tapping the grid; tap outside the window and the stat isn't added. To fix them — the buttons in the row. A fresh drop has up to 4. The verdict takes the piece as it is: Reforges still ahead don't count.`,`**4th substat on an Epic** — usually an Epic drops with three and the first Reforge adds a fourth; some drop with four. If the piece has one — "+ 4th substat" under the rows.`,`Tap a stat in its row to replace it (its segments stay) or remove it. When replacing, you can also pick a stat from another row: it moves here and that row is freed — handy for entering the next piece over the last one. Tapping it again in the grid removes it too. Code, help, the tutorial and settings are in “More”: ☰ on the bar at the bottom, “⋯” in the header on a computer.`],helpRoutine:`How to clean up fast`,helpRoutineItems:[`Everything below 6★ and below Epic — dismantle right away.`,`Go through the inventory by date received: consecutive drops usually come from one run, and the set stays from the previous piece.`,`**Epic armor:** pick the slot and set and look at the grid. 0–1 bright stats on the piece — dismantle without entering anything: "Keep" and "Stopgap" are impossible then. For Speed, Immunity and Swiftness almost everything is bright — enter those.`,`For Epic, the verdict appears after two useless substats — no need to enter the third.`,`"Keep" — lock it so you don't dismantle it by accident; "Stopgap" — wear it until you find better.`,`**Epic Breakthrough** takes only the same piece, any substats: for armor an Epic of the same set and slot, for a weapon any Steel Sword, for an accessory any Steel Necklace, with any main stat. Have an Epic "Keep" below T4 — set such Epics aside for it instead of dismantling, you need 4. An Epic weapon or accessory that is a "Stopgap" gets only dismantle fodder — don't spend Glunite.`,`**Epic weapon and accessory:** in "Endgame" — dismantle; in "Progression" the main stat first: grey — no one needs it, dismantle.`,`**Legendary** with "I save Legendary armor for Breakthrough": the verdict shows which to upgrade and which to keep for Breakthrough.`],helpVerdicts:[`**Keep** — the piece is needed: wear it and upgrade it; what exactly is in the "Upgrading" block in the details.`,`**Stopgap** — wear it until you find better: a weapon or accessory without the needed passive, or Epic armor with only one key stat.`,`**Fodder** — keep it for Breakthrough of the same item with the right main stat — or of the same piece a character has below T4 (see "Equipment"). Also a Legendary that won't improve anyone: it gives nothing to anyone it suits. Don't feed a Legendary you replaced to Breakthrough: evaluate it first — it may suit another hero.`,`**Maybe** — your call: the details say what's in doubt (e.g. it's good for a character outside your roster).`,`**Dismantle** — doesn't suit your characters, the roll is weak, or it gives nothing to anyone it suits (see "Equipment").`],helpChars:[`The star adds a character to your roster; with "only my characters" checked (More → Settings), the evaluation considers only them. The list shows "Mine" (all yours, with builds and without), "To dress" (yours with fewer than 6 of 6 equipped) or "All" (with builds; a hero without builds is found by name); element and class are under the filter button, the chosen ones show as chips above the list. More → Backup is the roster and gear in one code, to move to another device; "Replace" also reads the older roster and gear codes. Only roster characters have gear: "Equip" adds a character to the roster, loading a backup adds everyone who has gear, and unstarring a character with gear asks whether to remove the gear. Core Fusion replaces the hero: star Core Fusion Eternal and Eternal's gear moves to Core Fusion Eternal, while Eternal turns inactive (the pair keeps its place in the list: Core Fusion Eternal right after Eternal); the star on Eternal switches back.`,`Tap a character to open their builds: sets, weapons, substat priority. The card has the star too, next to the name; element and class are icons on the portrait, and "outerpedia ↗" opens the character's page on outerpedia. A roster hero's first tab is "Worn": what they wear in the game; the build they're dressed for is outlined; another build's tab has "Re-dress for … ▸".`,`**Equipment** — pieces belong to the character, and builds assemble themselves from them: one Speed helmet counts in both Speed and Speed/Immu. A build with several set combos has a variant per combo: the most complete is shown, the others are in the chips and "N more". A piece reaches a character with "Equip" — "Equip on…" in the verdict details, on a phone also the button under the card: the piece is recorded as worn in its slot. A verdict offers it to those whose build it fits. Off-build pieces aren't offered by themselves — search the character by name in "Equip on…" or tap "Rate a piece for Caren": there "Equip" is on every piece, to record what the hero wears. "Equip" reassembles the builds; the slot's old piece leaves unless a build holds it, and whatever is neither worn nor in any build is removed. A character's piece can be edited only in segments, "T4" and an Epic's 4th substat: did a Reforge or Breakthrough? Tap it in "Caren's gear" and fix it. Transistone changed a stat? Enter the piece again and "Equip", and "Remove from Caren" this one. Enhance isn't tracked: pieces are assumed to be +10. Set bonuses follow the pieces' Breakthrough: ×2 at T4 when at least two pieces of the set are T4; ×4 at T4 when all four are. Dismantled a piece or used it for Breakthrough? "Remove from Caren" on the piece. Who still needs gear — "To dress" above the list (on a phone also More → "To dress · N"). "Share" on the Worn tab gives a link: a friend sees what the hero wears and for which build — view only, nothing changes on their side. During a tutorial there's no backup: the page shows an example.`,`**Filling** — which builds wait for pieces: marked "Filling" and every started build — one with at least one piece of its sets or a listed weapon or accessory with a listed main, at any Breakthrough. The stamp and "On your characters now" follow them. Not filling one? Turn off "Filling": its pieces stop holding the stamp but don't leave — the character keeps the pieces of every build's best layout and what's worn. "By stats" — a separate build for every character: all their pieces by the chain, no sets. It holds the stamp while no build is started; after that its line is quiet. It doesn't hold pieces itself: a piece only it needs is "no longer needed" unless worn.`,`**Rate a piece for Caren** — on the character card: above the form, "Only for · Caren". The card line, "On your characters now" and "Equip" are only about Caren, across all builds; "Equip" is there even for a useless piece, to record what the hero wears; the stamp is shared. "Next" keeps the mode, ✕ — everyone again. "Try on" on an empty slot puts the slot and set on the form. "Try a replacement" on a piece — "Replace" removes exactly that piece, whether the new one is better or worse.`,`**On your characters now** — in the verdict details, a row per roster character: what the piece does to their builds — "completes", "set 3 of 4", "empty slot", ▲ better or ▼ worse than what's in the build or the character's piece of its set in that slot (two chains side by side and by how much in useful segments), "breaks a set", "stats only"; the other builds are in the "More" line. A set is broken only for a net gain; a set with an effect bonus (Immunity, Penetration) is never traded for stats. "Replace" instead of "Equip" — the slot already has a piece; it leaves unless a build holds it. The stamp: "Dismantle" → "Fodder" when the same piece (same slot, set and grade; for weapons and accessories the same item and grade) sits below T4 in a build a character is filling — this one is its material; if this one is better — "Keep": wear it. "Keep" and "Stopgap" → "Dismantle" when all substats are entered and it gives nothing to anyone it suits (a Legendary "Keep" becomes "Fodder"; armor only if you keep fodder). What keeps the stamp: a character with no gear, the piece starting a build for them, "completes", "set 3 of 4", an empty slot, "better", "breaks a set" and "on par because of T4" when better by segments, a different recommended passive; for weapons and accessories, also an off-build piece in the slot. Backup — the OGC-GEAR2 code in More → Backup.`],helpTrade:`Trade gear`,helpTradeItems:[`Works out how to re-dress a hero (or a team of four) from the pieces already in your roster and inventory. Open it with "Trade ▸" on a hero card (that hero's plan) or "Trade" above the character list and "Team trade" in More on a phone (straight to the team). In the game you do it yourself — the app only calculates.`,`**Hero** — whom to re-dress; **Team** — four places in a diamond: they swap pieces among themselves and take from everyone else. A member is a tile with the pin in the corner; tap it to put another hero there or "Remove from team". Under the tile — the yardstick ("Name ▾" — a build or "by stats"), tap to change.`,`**Pin "Keep worn gear"** — on the hero card and tile: others do not take what the hero wears (spares can be taken). Team members can still swap among themselves.`,`The plan: for each receiver — the gain in build points ("▲ +13%", for a hero with nothing worn "▲ +41 pts"), what to put on, where each piece comes from (a hero or the inventory) and how to find it in the game — the source is small under the piece, weapons and accessories also get Secondary ↓. "Skip" looks for another piece. An empty slot shows "Search:" with a hint. The plan shows only whom you re-dress (the hero or the team members); heroes you take pieces from are not shown.`,`**Holes are not filled:** a piece taken off stays off until you enter a new one through evaluation.`,`**Done** — all done in the game: the plan is saved ("Keep worn gear after the trade" for a receiver, on by default). **Cancel** — nothing changed. Right after "Done" there is "Undo". A copy that is in no pool leaves the app but stays in your game inventory.`,`**"Better in own pieces"** on the "Worn" tab uses the same threshold as the trade: a spare piece beats the worn one by at least 1 point for the build, or turns on a set, or gives a recommended weapon.`],helpCode:`Code for your guild`,helpCodeText:e=>`The verdict details and a character's piece card show the item's code, e.g. ${e}. Copy it into the game chat; whoever gets it taps "Enter code" and types it in. Everyone gets the verdict for their own roster. A piece with 5–6 segments has no code.`,helpInstall:`Installing`,helpInstallItems:[`**Android (Chrome):** menu ⋮ → "Install app" or "Add to Home screen".`,`**iPhone and iPad:** in Safari, Share → "Add to Home Screen".`,`The installed app works offline. When new outerpedia data is out, an "Update" banner appears; app improvements install by themselves on the next launch.`],wikiLink:`Full guide — in the Wiki ↗`,wikiUrl:`https://github.com/cotton-more/outerplane-gear-check/wiki/Getting-started`},material:{title:(e,t)=>`Fodder — Breakthrough material for the ${e} on ${t}`,need:(e,t,n,r)=>`${e} on ${t} — T${n}, ${r} more to T4`,needBelow:(e,t)=>`${e} on ${t}`,line:e=>`**Material**: the same piece is worn below T4 — ${e}. One piece is one Breakthrough tier; substats don't matter.`,plan:`**Don't upgrade or dismantle it** — feed it to the worn one's Breakthrough: one piece is one tier.`,titleWear:(e,t)=>`Keep — better than the ${y[e]} on ${t}: wear it and feed the old one to it`,lineWear:e=>`**Better than the one on**: the same piece is worn below T4 but is weaker — ${e}. Wear this one and feed the old one to its Breakthrough.`,titleWearT4:(e,t)=>`Keep — better than the ${y[e]} on ${t}: wear it`,lineWearT4:e=>`**Better than the one on**: the same piece is worn below T4 and is weaker — ${e}. Wear this one.`,planReplace:e=>`**Wear it** on ${e}: it beats the one on, and the old one is the same piece — feed it to the new one's Breakthrough, one piece is one tier.`,planWear:e=>`**Wear it** on ${e} until you find better — don't feed it to the worn one's Breakthrough.`},worn:{title:(e,t,n)=>`${e===`fodder`?`Fodder`:`Dismantle`} — already ${n?`as good`:`better`} on ${t.length>2?`${t.slice(0,2).join(`, `)} and ${t.length-2} more`:t.join(` and `)}`,line:`**Won't improve anyone**: everyone it fits already wears as good or better. The piece itself isn't bad.`,stale:`Dismantled a piece in the game? Remove it on the character card and the verdict follows.`},tryon:{label:`Only for`,end:`Rate for everyone`,rateFor:e=>`Rate a piece for ${e}`,others:e=>`${e.length>2?`${e.slice(0,2).join(`, `)} and ${e.length-2} more`:e.join(` and `)} ${e.length===1?`needs`:`need`} it`,clause:(e,t,n,r,i={})=>({fill:r?`${t}: empty slot — fine for now`:`${t}'s slot is empty`,up:`better than what ${t} wears`,eq:`on par with what ${t} wears`,down:`${t} already wears better`,breaks:`breaks ${t}'s set`,completes:`completes ${n} on ${t}`,closer:`${t} · ${n}: set ${i.n} of ${i.m}`,capped:`on ${t} — on par: ${i.part} at T4`,surplus:`on ${t} — beyond ${i.part}`})[e]??``,butWear:(e,t)=>`but ${e===`fill`?`${t}'s slot is empty`:`better than what ${t} wears`}: wear it until you find better`,offHero:(e,t)=>`${e} doesn't need it: ${t} isn't in ${e}'s builds.`,offStats:e=>`It fits ${e} by stats, not by build.`,noStats:e=>`This piece gives ${e} nothing: no useful stats.`,noClass:e=>`${e} can't wear this item: it's for another class.`,slot:`Try on`,replace:`Try a replacement`,build:`Gear up this build`,empty:(e,t)=>`Gear up ${e}: enter ${t}'s pieces from your inventory, and the verdict starts comparing new pieces with them.`,emptyOr:`Or press "Equip" in a verdict — the piece joins the character's gear by itself.`,emptyStats:e=>`"By stats" — ${e}'s pieces by the chain, no sets. Record what ${e} wears off-build on the "Worn" tab.`},trade:{title:`Trade gear`,open:`Trade ▸`,teamOpen:`Team trade`,pin:`Keep worn gear`,pinTile:e=>`${e}: keeps worn`,pinned:`Pinned:`,unpin:e=>`Unpin: ${e}`,modeHero:`Hero`,modeTeam:`Team`,pickHero:`Who to re-dress?`,noHeroes:`No characters with builds in roster — mark them with a star in "Characters".`,teamHint:`Four characters, like a team in game: swap gear and take from the rest.`,pickMember:`Who goes here?`,addMember:`Team slot`,removeMember:e=>`Remove from team: ${e}`,count:`Calculate`,counting:`Calculating…`,cancel:`Cancel`,done:`Done`,ok:`OK`,nothing:`Nothing to change`,pinAfter:`After the trade, keep worn gear`,gainPct:e=>e>0?`▲ +${e}%`:e<0?`▼ −${-e}%`:`0%`,gainPts:e=>e>0?`▲ +${_(e)} pts`:e<0?`▼ −${_(-e)} pts`:`0 pts`,setOn:(e,t)=>`${e} ×${t} activates`,setOff:(e,t)=>`${e} ×${t} deactivates`,fromWorn:e=>`on ${e}`,fromStock:e=>`in inventory · ${e}'s stock`,fromInventory:`in inventory`,skip:`Don't take`,search:`Search:`,anyGrade:`6★`,sortTitle:`Secondary Stat — sort by it`,keySub:e=>`${e} ↓`,emptySlot:e=>`${(y[e]??e).replace(/^./,e=>e.toUpperCase())}: empty`,gone:e=>`The old copy of ${e} stays in inventory, removed from the app.`,pinnedBetter:(e,t)=>`Better with ${e}'s gear (pinned): +${_(t)} pts`,take:`Take`,stale:`Gear changed — plan recalculated. Check and tap "Done" again.`,savedHero:e=>`Trade for ${e} saved.`,savedTeam:`Team trade saved.`,savedPin:(e,t)=>t?`${e}: keeps worn gear.`:`${e}: worn gear can be taken.`},tour:{start:`Tutorial`,startLong:`Take the tutorial`,welcomeCta:`Take it · 1 min`,next:`Continue`,done:`Done`,close:`Close tutorial`,stepOf:(e,t)=>`Step ${e} of ${t}`,choose:`Let's enter one piece of gear — about a minute. Use an example or a piece from the game?`,demo:`Example`,own:`My own piece`,inSheet:`Pick in the window — the tutorial will wait.`,closeSheet:`Close the window ✕, then press “Next”.`,backToEval:`← Back to tutorial`,endText:e=>`That's it: every piece is checked this way.${e?` To take it again, open “More” or Help.`:` Mark your characters — the check will use them instead of every hero in the game.`}`,choice:`Another piece was on the form before the tutorial. Which one to keep?`,keepItem:`Keep this one`,restoreItem:`Bring back the old one`,invite:`New: a tutorial — enter one piece of gear, about a minute.`,pick:`Which tutorial?`,tours:{core:`Checking a piece · 1 min`,gear:`Gear · 1 min`},gearStepOf:(e,t)=>`Gear · ${e} of ${t}`,gearEnd:e=>`Done. That was an example — your gear is untouched. Who still needs gear: ${e?`“More”, “To dress”`:`Characters, the “To dress” switch`}.`,off:{item:`The example needs Epic armor: the shirt icon and E.`,set:`The example needs Speed Set — change it in the set field.`,subs:`The example needs only SPD, CHC and CHD: tap the extra stat in its row and replace or remove it.`},tips:{more:`Evaluation settings, backup, language and help are in “More”.`,star:`Star your characters — the check will use them instead of every hero in the game.`,accMain:`For an accessory, the first tap in the grid is the main stat, as at the top of the piece in the game. Then come the substats.`,mainCell:`A “main” cell is a stat in the main line: it never rolls as a substat.`,fourth:`An Epic can have a 4th substat — from the first Reforge or straight from the drop. Mark it, it may save the piece.`,replace:`Tap a stat in its row to replace or remove it. Handy for entering the next piece over the last one.`,move:`You can pick a stat from another row too: it moves here and that row is freed.`,chain:`The chain is the build’s stat priority: green is on the piece, dashed is not. Earlier places matter more.`,code:`The item code is for your guild chat: they enter it with “Enter code” and see the check for their roster.`,temp:`“Temporary” — wear it until you find something better. No rush to dismantle it.`,prio:`Substat priority: › is the order, = shares a place, crossed-out ones never roll as substats on 6★ gear. The verdict chain is built from this line.`,builds:`Each build assembles itself from the character's whole pool. The stamp follows started builds (one set piece or listed weapon starts one) and “Filling” ones.`,gear:`Pieces belong to the character, and builds assemble themselves: one Speed helmet counts in both Speed and Speed/Immu.`,tryOn:`“Try on” rates for this character only; the slot and set are already on the form. “Equip” puts it straight on.`,piece:`Did a Reforge or Breakthrough in the game? Fix the segments and “T4” here, as on the piece in the game: comparisons use what's there.`,tryStrip:`Rating for this character only: the card line and “Equip” are for this character; the stamp is shared. ✕ — everyone again.`,vs:`▲ better than what's in the build, ▼ worse; “set 3 of 4” — the build gets closer to done. The button equips or replaces.`,cardEquip:`Equip with one tap below the card: it’s recorded as worn. Whatever is neither worn nor in any build leaves the character's gear.`,equipAll:`Here: characters whose builds can use the piece. Off-build? Search a name — “Equip” records it as worn.`,material:`Fodder, not dismantle: the same piece is in a build being assembled and is below T4 — this one feeds its Breakthrough.`,worn:`The piece is decent, but everyone it fits already has as good or better — hence Dismantle. Dismantled a piece in the game? Remove it on the character card.`,pool:`All of the character's pieces by slot. Dismantled one or used it for Breakthrough? Tap it and “Remove”: builds reassemble.`,want:`Not filling this build? Turn off “Filling”: its pieces stop holding :`Вердикт — показать подробности`,backToEval:`Вернуться к оценке`,reset:`Следующий`,undoText:`Предмет убран`,undoAction:`Вернуть`,details:`подробнее`,charsHint:`☆ — отметь своих: оценка будет учитывать только их`,charSearch:`Имя: Stella, Demiurge, Gnosis…`,modeGroup:`Кого показывать`,modeMine:`Мои`,modeToDress:`Доодеть`,modeAll:`Все`,filter:`Фильтр`,filterReset:`Сбросить`,filterOff:e=>`${e} — снять фильтр`,tradeBtn:`Обмен`,nobodyFound:`Никого не нашлось.`,rosterToggle:(e,t)=>`${e} — ${t?`убрать из ростера`:`добавить в ростер`}`,rosterSelected:`Выделено — нажми Ctrl/Cmd+C`,rosterApplied:(e,t,n)=>`${e?`Заменено`:`Добавлено`}: ${t}${n?`; не распознано: ${n}`:``}`,replace:`Заменить`,charBuilds:`Билды персонажа`,pickChar:`Выбери персонажа — покажу рекомендованные сеты, оружие, аксессуары и приоритет сабстатов по билдам outerpedia.`,toList:`← к списку`,opedia:`outerpedia`,opediaAria:e=>`${e} на outerpedia (откроется в новой вкладке)`,builds:`Билды`,noBuilds:`У outerpedia пока нет рекомендаций по шмоту для этого персонажа.`,gameSets:e=>`Сама игра советует сеты: ${e}.`,armorSets:`Сеты брони`,or:`или`,weapon:`Оружие`,accessory:`Аксессуар`,subPriority:`Приоритет сабстатов`,notSub:`не выпадает сабстатом на 6★ снаряжении`,prioGap:`разрыв в приоритете`,talismans:`Талисманы`,buildNote:`Заметка outerpedia`,badMain:`у этого предмета не бывает такого main stat — вероятно, опечатка в outerpedia`,flatEqual:e=>` — flat и ${e}% примерно равны, бери любой.`,flatBetter:(e,t)=>` — выгоднее flat: сегмент flat ${e} даёт ≈${t}% от сегмента ${e}% (то есть больше).`,pctBetter:(e,t)=>` — выгоднее ${e}%: сегмент flat ${e} даёт только ≈${t}% от сегмента ${e}%.`,flatFor:(e,t)=>`Для lv ${e}${t?` с прокачанными Quirks`:` без Quirks`} — меняется в «Настройках оценки».`,howTo:`Как пользоваться`,steps:[`**Отметь своих персонажей** — пока их нет, оценка идёт по всем персонажам игры.`,`**Вбей вещь:** слот, грейд (L — Etheric, E — Steel), сет или предмет; сабстаты — сеткой, по порядку, как в игре: нажал стат — в окне выбери, сколько сегментов горит.`,`**Вердикт** — сразу, с объяснением. «Следующий» — к следующей вещи: слот, грейд, сет и main остаются, сабстаты очищаются.`],markChars:`Отметить персонажей`,canInstall:`Можно установить как приложение — работает и без сети.`,install:`Установить`,iosInstall:`**iPhone и iPad:** Safari → «Поделиться» → «На экран „Домой“» — будет работать и без сети.`,helpInput:`Ввод вещи`,helpInputItems:[`**Броня** — сет: он в названии после «of» (Etheric Gloves of Speed → Speed Set).`,`**T4** рядом с сетом, предметом или main (у Epic оружия и аксессуара) — вещь уже на Breakthrough T4. У брони бонус сета (Speed ×2 и другие) считается на T4; у любой вещи такие же ей в Breakthrough больше не нужны. Свежий дроп — T0, не отмечай. «T?» у старой записи — Breakthrough не указан: считается ниже T4.`,`**Legendary оружие и аксессуар** — найди предмет и отметь main stat. Совсем новый, которого нет в списке, — «нет в списке».`,`**Epic оружие и аксессуар** (Steel…) — пассивки нет, сразу main stat.`,`**Main stat** у оружия — кнопки ATK% / DEF% / HP% рядом с грейдом; у аксессуара — первое нажатие в сетке, дальше сетка отмечает сабстаты. Ярче — main, который кому-то нужен. Нажми выбранный ещё раз, чтобы убрать.`,`**Сабстаты** — нажми в сетке; ярче — статы, нужные билдам выбранного сета. Статы стоят парами по параметру, один над другим: ATK% над ATK, HP% над HP, DEF% над DEF, CHC над CHD, DMG UP% над DMG RED%, EFF% над RES%. Клетка с пометкой main — такого сабстата на этой вещи не бывает: он уже в main (HP% у шлема и ботинок, flat DEF у брони и перчаток, flat ATK у оружия). Flat EFF и flat RES в main сабстатам EFF% и RES% не мешают — в игре это разные статы. В сетке все 13 сабстатов игры; PEN%, CDMG RED%, flat EFF и flat RES сабстатами не бывают — только main.`,`**Сегменты** — сколько горит у сабстата в игре, 1–6 (жёлтые и оранжевые вместе). Их выбираешь в окне сразу после нажатия в сетке; нажал мимо окна — стат не добавится. Поправить — кнопками в строке. Свежий дроп — до 4. Вердикт — по вещи как есть: Reforge, которые впереди, не считаются.`,`**4-й сабстат у Epic** — обычно Epic выпадает с тремя, четвёртый добавляет первый Reforge; бывает и сразу с четырьмя. Есть он на вещи — «+ 4-й сабстат» под строками.`,`Нажми на стат в строке, чтобы заменить его (сегменты останутся) или убрать. При замене можно выбрать и стат из другой строки: он переедет сюда, а та строка освободится — так удобно вводить следующую вещь поверх прошлой. Убрать можно и повторным нажатием в сетке. Код, справка, обучение и настройки — в «Ещё»: ☰ на плашке внизу, на компьютере — «⋯» в шапке.`],helpRoutine:`Как быстро разбирать`,helpRoutineItems:[`Всё ниже 6★ и ниже Epic — сразу в разбор.`,`Иди по инвентарю по дате получения: подряд обычно дропы одного забега, и сет остаётся с прошлой вещи.`,`**Epic-броня:** выбери слот и сет и посмотри на сетку. Ярких статов на вещи 0–1 — в разбор, ничего не вводя: «Оставить» и «Временно» так не бывает. У Speed, Immunity и Swiftness ярко почти всё — там вводи.`,`У Epic после двух ненужных сабстатов вердикт появляется сразу — третий можно не вводить.`,`«Оставить» — поставь замок, чтобы не разобрать случайно; «Временно» — носи, пока не найдёшь лучше.`,`**Breakthrough у Epic** — только такой же вещью, сабстаты не важны: броня — Epic того же сета и слота, оружие — любой Steel Sword, аксессуар — любой Steel Necklace, с любым main. Есть Epic-«Оставить» не на T4 — такие Epic из разбора откладывай ему, нужно 4 штуки. Epic оружию и аксессуару «Временно» — только вещами из разбора, Glunite не трать.`,`**Epic оружие и аксессуар:** на «Эндгейме» — в разбор; на «Развитии» сначала main stat: серый — он никому не нужен, в разбор.`,`**Legendary** с «коплю фоддер»: вердикт покажет, какие прокачивать, а какие оставить на Breakthrough.`],helpVerdicts:[`**Оставить** — вещь нужна: носи и прокачивай, что именно — в блоке «Прокачка» в подробностях.`,`**Временно** — носи, пока не найдёшь лучше: у оружия и аксессуара нет нужной пассивки, у Epic-брони только один главный стат.`,`**Фоддер** — оставь на Breakthrough такой же вещи с правильным main stat — или такой же вещи персонажа не на T4 (см. «Экипировка»). Так же — у Legendary, которая никого не улучшит: всем, кому подходит, она ничего не даёт. Снятую при замене Legendary в Breakthrough не отдавай: сначала оцени её — может подойти другому герою.`,`**Спорно** — решай сам: в подробностях написано, в чём сомнение (например, вещь хороша для персонажа не из твоего ростера).`,`**Разобрать** — твоим персонажам не подходит, ролл слабый или всем, кому она подходит, она ничего не даёт (см. «Экипировка»).`],helpChars:[`Звёздочка отмечает персонажа в ростере; с галочкой «только мои персонажи» («Ещё» → «Настройки») оценка учитывает только их. Список показывает «Мои» (все твои, с билдами и без), «Доодеть» (твои, у кого надето меньше 6 из 6) или «Все» (с билдами; героя без билдов найдёшь по имени); стихия и класс — под кнопкой фильтра, выбранные видны чипами над списком. «Ещё» → «Резервная копия» — ростер и вещи одним кодом, для переноса на другое устройство; «Заменить» понимает и прежние коды ростера и экипировки. Вещи бывают только у персонажей ростера: «Надеть» добавляет в ростер, загрузка копии — всех, у кого есть вещи; снимешь звезду с персонажа с вещами — приложение спросит, убрать ли их. Core Fusion заменяет героя: отметишь Core Fusion Eternal — вещи Eternal перейдут к Core Fusion Eternal, а Eternal станет неактивным (в списке пара на прежнем месте: Core Fusion Eternal сразу за Eternal); звезда на Eternal вернёт всё назад.`,`Нажми на персонажа — откроются его билды: сеты, оружие, приоритет сабстатов. Звёздочка есть и в карточке, рядом с именем; стихия и класс — значками на портрете, «outerpedia ↗» открывает страницу персонажа на outerpedia. У героя ростера первая вкладка — «Надето»: что на нём в игре; билд, в который он одет, обведён; на вкладке другого билда — «Переодеть в … ▸».`,`**Экипировка** — вещи у персонажа, а билды собираются из них сами: один Speed-шлем идёт и в Speed, и в Speed/Immu. У билда с несколькими связками сетов каждая связка — отдельный вариант: показан самый собранный, остальные — в чипах и «ещё N». Вещь к персонажу кладёт «Надеть» — в подробностях вердикта, на телефоне ещё и кнопка под карточкой: вещь записывается надетой в своём слоте. Вердикт предлагает её тем, кому она встанет в билд. Вещь не по билду сама не предлагается — найди персонажа по имени в «Надеть на…» или нажми «Оценить вещь для Caren»: там «Надеть» есть у любой вещи, чтобы записать, что носит герой. «Надеть» пересобирает билды; прежняя вещь слота уходит, если её не держит ни один билд, и что не надето и не вошло ни в один билд — убирается. Вещь персонажа правится только в сегментах, «T4» и 4-м сабстате у Epic: сделал Reforge или Breakthrough — нажми её в «Вещи Caren» и поправь. Transistone сменил стат — введи вещь заново и «Надеть», а эту — «Убрать у Caren». Enhance не отмечается: считаем, что вещь на +10. Бонус сета — по Breakthrough вещей: ×2 на T4, если хотя бы две вещи сета на T4; ×4 на T4 — если все четыре. Разобрал вещь или пустил на Breakthrough — «Убрать у Caren» в карточке вещи. Кого доодеть — «Доодеть» над списком (на телефоне ещё «Ещё» → «Доодеть · N»). «Поделиться» во вкладке «Надето» даёт ссылку: друг увидит, что на герое надето и под какой билд, — только просмотр, у него ничего не изменится. Во время обучения резервной копии нет: на странице пример.`,`**Собираю** — какие билды ждут вещи: отмеченные «Собираю» и все начатые — где стоит хоть одна вещь из сетов билда или оружие либо аксессуар из его списка с нужным main, при любом Breakthrough. По ним — штамп и «Сейчас на персонажах». Не собираешь — выключи «Собираю»: вещи для него перестанут держать штамп, но не уйдут — у персонажа остаются вещи лучшей раскладки каждого билда и надетое. «По статам» — отдельный билд у каждого персонажа: все его вещи по цепочке, без сетов. Штамп он держит, пока ни один билд не начат; потом его строка — тихая. Сам вещи он не держит: вещь, которая нужна только ему, «больше не нужна», если она не надета.`,`**Оценить вещь для Caren** — в карточке персонажа: над формой «Только для · Caren». Строка карточки, «Сейчас на персонажах» и «Надеть» — только про Caren, по всем билдам; «Надеть» есть и у вещи без пользы — записать, что носит герой; штамп — общий. «Следующий» режим не сбрасывает, ✕ — снова для всех. «Примерить» у пустого слота сразу ставит на форму слот и сет. «Примерить замену» у вещи — «Заменить» уберёт именно её, лучше новая или хуже.`,`**Сейчас на персонажах** — в подробностях вердикта, строка на персонажа ростера: что с вещью станет с его билдами — «соберёт», «сет 3 из 4», «пустой слот», ▲ лучше или ▼ хуже того, что стоит в билде, или такой же вещи её сета у персонажа (две цепочки рядом и на сколько по полезным сегментам), «ломает сет», «только статы»; остальные билды — строкой «Ещё». Сет можно сломать, только если в итоге выгоднее; сет с бонусом-эффектом (Immunity, Penetration) ради статов не ломается. «Заменить» вместо «Надеть» — в слоте уже есть вещь; она уйдёт, если её не держит ни один билд. Штамп: «Разобрать» → «Фоддер», если такая же вещь (тот же слот, сет и грейд; у оружия и аксессуара — тот же предмет и грейд) стоит в собираемом билде персонажа ниже T4 — эта ей материал; а если эта лучше — «Оставить»: надень её. «Оставить» и «Временно» → «Разобрать», если введены все сабстаты и никому из тех, кому вещь подходит, она ничего не даёт (Legendary «Оставить» — «Фоддер», броня — если копишь фоддер). Штамп держат: персонаж без вещей, вещь начнёт ему билд, «соберёт», «сет 3 из 4», пустой слот, «лучше», «ломает сет» и «на уровне из-за T4», когда по сегментам лучше, другая рекомендованная пассивка; у оружия и аксессуара — ещё и вещь не по билду в слоте. Резервная копия — код OGC-GEAR2 в «Ещё» → «Резервная копия».`],helpTrade:`Обмен вещами`,helpTradeItems:[`Считает, как переодеть героя (или команду из четырёх) вещами, что уже есть в ростере и инвентаре. Вход — «К обмену ▸» на карточке героя (план для него) или «Обмен» над списком персонажей и «Обмен для команды» в «Ещё» на телефоне (сразу команда). В игре всё делаешь сам — приложение только считает.`,`**Герой** — кого переодеть; **Команда** — четыре места ромбом: они меняются вещами между собой и берут у остальных. Член — плитка с булавкой в углу; нажми — поставить другого или «Убрать из команды». Под плиткой — мерило («Имя ▾» — билд или «по статам»), нажми — сменить.`,`**Булавка «Не отдавать надетое»** — у карточки героя и плитки: надетое на нём другие не берут (запас берут). Члены команды между собой меняться могут.`,`План: у каждого получателя — выигрыш в очках билда («▲ +13%», у героя без надетого — «▲ +41 очк.»), что надеть, откуда вещь (у кого или в инвентаре) и как её найти в игре — источник мелко под вещью, у оружия и аксессуара ещё Secondary ↓. «Не брать» — искать другую вещь. У пустого слота — «Искать:» с подсказкой. В плане — только те, кого переодеваешь (герой или члены команды); у кого забираешь, не показываем.`,`**Дыры не закрываются:** снятая вещь остаётся снятой, пока не введёшь новую через оценку.`,`**Сделал** — в игре всё сделано: план сохраняется (после него «После обмена не отдавать надетое» у получателя, по умолчанию вкл.). **Отмена** — ничего не менялось. Сразу после «Сделал» — «Вернуть». Копия, которой нет ни в одном пуле, из приложения уйдёт, в инвентаре игры останется.`,`**«Лучше из своих»** на вкладке «Надето» — тот же порог, что и в обмене: своя запасная вещь лучше надетой хотя бы на 1 очко по билду, либо включает сет, либо даёт рекомендованное оружие.`],helpCode:`Код для гильдии`,helpCodeText:e=>`В подробностях вердикта и в карточке вещи персонажа есть код вещи, например ${e}. Скопируй его в чат игры; кто получил — нажимает «Ввести код» и перепечатывает. Оценка у каждого — по своему ростеру. У вещи с 5–6 сегментами кода нет.`,helpInstall:`Установка`,helpInstallItems:[`**Android (Chrome):** меню ⋮ → «Установить приложение» или «Добавить на главный экран».`,`**iPhone и iPad:** в Safari «Поделиться» → «На экран „Домой“».`,`Установленное приложение работает без сети. Когда выйдут новые данные outerpedia, появится плашка «Обновить»; улучшения приложения ставятся сами при следующем запуске.`],wikiLink:`Подробное руководство — в Wiki ↗`,wikiUrl:`https://github.com/cotton-more/outerplane-gear-check/wiki/Начало-работы`},material:{title:(e,t)=>`Фоддер — материал Breakthrough для ${e} ${t}`,need:(e,t,n,r)=>`${e} ${t} — T${n}, ещё ${r} шт. до T4`,needBelow:(e,t)=>`${e} ${t}`,line:e=>`**Материал**: такая же вещь надета не на T4 — ${e}. Одна вещь — одна ступень Breakthrough, сабстаты не важны.`,plan:`**Не прокачивай и не разбирай** — отдай в Breakthrough надетой: одна вещь — одна ступень.`,titleWear:(e,t)=>`Оставляй — лучше ${re(e,`надетого`,`надетой`,`надетого`,`надетых`)} ${L[e]} ${t}: надень её, а старую — ей в Breakthrough`,lineWear:e=>`**Лучше надетой**: такая же вещь надета не на T4, но слабее этой — ${e}. Надень эту, а старую отдай ей в Breakthrough.`,titleWearT4:(e,t)=>`Оставляй — лучше ${re(e,`надетого`,`надетой`,`надетого`,`надетых`)} ${L[e]} ${t}: надень её`,lineWearT4:e=>`**Лучше надетой**: такая же вещь надета не на T4 и слабее этой — ${e}. Надень эту.`,planReplace:e=>`**Надень её** на ${e}: она лучше надетой, а старая — такая же вещь: отдай её новой в Breakthrough, одна вещь — одна ступень.`,planWear:e=>`**Надень её** на ${e}, пока нет лучше, — в Breakthrough надетой не отдавай.`},worn:{title:(e,t,n)=>`${e===`fodder`?`Фоддер`:`Разбирай`} — уже ${n?`не хуже`:`лучше`} у ${t.length>2?`${t.slice(0,2).join(`, `)} и ещё ${t.length-2}`:t.join(` и `)}`,line:`**Никого не улучшит**: всем, кому она подходит, уже надето не хуже. Сама по себе вещь неплохая.`,stale:`Разобрал вещь в игре — убери её в карточке персонажа, и вердикт пересчитается.`},tryon:{label:`Только для`,end:`Оценивать для всех`,rateFor:e=>`Оценить вещь для ${e}`,others:(e,t=!0)=>`${t?`нужна`:`нужен`} ${e.length>2?`${e.slice(0,2).join(`, `)} и ещё ${e.length-2}`:e.join(` и `)}`,clause:(e,t,n,r,i={})=>({fill:r?`${t}: пустой слот — пока сойдёт`:`у ${t} слот пуст`,up:`лучше, чем на ${t}`,eq:`на ${t} — на уровне`,down:`на ${t} уже лучше`,breaks:`на ${t} сломает сет`,completes:`у ${t} соберёт ${n}`,closer:`${t} · ${n}: сет ${i.n} из ${i.m}`,capped:`на ${t} — на уровне: ${i.part} на T4`,surplus:`у ${t} — сверх ${i.part}`})[e]??``,butWear:(e,t)=>`но ${e===`fill`?`у ${t} слот пуст`:`лучше, чем на ${t}`}: надень, пока нет лучше`,offHero:(e,t)=>`${e} она не нужна: ${t} нет в билдах ${e}.`,offStats:e=>`${e} она подходит по статам, не по билду.`,noStats:e=>`${e} эта вещь ничего не даст: полезных статов нет.`,noClass:e=>`${e} не носит этот предмет: он для другого класса.`,slot:`Примерить`,replace:`Примерить замену`,build:`Собрать билд`,empty:(e,t)=>`Собери билд ${e}: вводи вещи ${t} из инвентаря — и вердикт начнёт сравнивать новые вещи с ними.`,emptyOr:`Или жми «Надеть» в вердикте — вещь сама добавится к вещам персонажа.`,emptyStats:e=>`«По статам» — вещи ${e} по цепочке, без сетов. Что ${e} носит в игре не по билду, отметь на вкладке «Надето».`},trade:{title:`Обмен вещами`,open:`К обмену ▸`,teamOpen:`Обмен для команды`,pin:`Не отдавать надетое`,pinTile:e=>`${e}: надетое не отдаёт`,pinned:`Закреплены:`,unpin:e=>`Снять закрепление: ${e}`,modeHero:`Герой`,modeTeam:`Команда`,pickHero:`Кого переодеть?`,noHeroes:`В ростере нет героев с билдами — отметь их звездой на «Персонажах».`,teamHint:`Четыре героя, как команда в игре: меняются вещами между собой и берут у остальных.`,pickMember:`Кого поставить на это место?`,addMember:`Место в команде`,removeMember:e=>`Убрать из команды: ${e}`,count:`Посчитать`,counting:`Считаю…`,cancel:`Отмена`,done:`Сделал`,ok:`Ок`,nothing:`Менять нечего`,pinAfter:`После обмена не отдавать надетое`,gainPct:e=>e>0?`▲ +${e}%`:e<0?`▼ −${-e}%`:`0%`,gainPts:e=>e>0?`▲ +${F(e)} очк.`:e<0?`▼ −${F(-e)} очк.`:`0 очк.`,setOn:(e,t)=>`включится ${e} ×${t}`,setOff:(e,t)=>`выключится ${e} ×${t}`,fromWorn:e=>`у ${e}`,fromStock:e=>`в инвентаре · запас ${e}`,fromInventory:`в инвентаре`,skip:`Не брать`,search:`Искать:`,anyGrade:`6★`,sortTitle:`Secondary Stat — сортировка по нему`,keySub:e=>`${e} ↓`,emptySlot:e=>`${ae(I[e]??e)}: пусто`,gone:e=>`Старая копия ${e} останется в инвентаре, из приложения уйдёт.`,pinnedBetter:(e,t)=>`У ${e} (закреплены) лучше: +${F(t)} очк.`,take:`Взять`,stale:`Вещи поменялись — план пересчитан. Проверь и нажми «Сделал» ещё раз.`,savedHero:e=>`Обмен для ${e} сохранён.`,savedTeam:`Обмен команды сохранён.`,savedPin:(e,t)=>t?`${e}: надетое не отдаёт.`:`${e}: надетое можно брать.`},tour:{start:`Обучение`,startLong:`Пройти обучение`,welcomeCta:`Пройти · 1 мин`,next:`Дальше`,done:`Готово`,close:`Закрыть обучение`,stepOf:(e,t)=>`Шаг ${e} из ${t}`,choose:`Пройдём ввод одной вещи — около минуты. Возьмём пример или вещь из игры?`,demo:`На примере`,own:`На своей вещи`,inSheet:`Выбери в окне — обучение подождёт.`,closeSheet:`Закрой окно ✕, затем нажми «Следующий».`,backToEval:`← К обучению`,endText:e=>`Вот и всё: так оценивается каждая вещь.${e?` Пройти снова — в «Ещё» или в «Справке».`:` Отметь своих персонажей — оценка будет по ним, а не по всем героям игры.`}`,choice:`До обучения на форме была другая вещь. Какую оставить?`,keepItem:`Оставить эту`,restoreItem:`Вернуть прежнюю`,invite:`Появилось обучение: ввод одной вещи, около минуты.`,pick:`Какое обучение?`,tours:{core:`Оценка вещи · 1 мин`,gear:`Экипировка · 1 мин`},gearStepOf:(e,t)=>`Экипировка · ${e} из ${t}`,gearEnd:e=>`Готово. Это был пример — твоя экипировка не тронута. Кого доодеть — ${e?`в «Ещё», «Доодеть»`:`в «Персонажах», переключатель «Доодеть»`}.`,off:{item:`Для примера нужна броня Epic: значок футболки и E.`,set:`Для примера нужен Speed Set — поменяй его в поле сета.`,subs:`Для примера нужны только SPD, CHC и CHD: нажми лишний стат в строке и замени его или убери.`},tips:{more:`Настройки оценки, резервная копия, язык и справка — в «Ещё».`,star:`Отметь звёздочкой своих персонажей — оценка будет по ним, а не по всем героям игры.`,accMain:`У аксессуара первое нажатие в сетке — это main stat, как сверху на вещи в игре. Дальше идут сабстаты.`,mainCell:`Клетка «main» — стат из main вещи: сабстатом такой не выпадает.`,fourth:`У Epic бывает 4-й сабстат — от первого Reforge или сразу с дропа. Есть — отметь его, он может вытянуть вещь.`,replace:`Нажми на стат в строке, чтобы заменить его или убрать. Так удобно вводить следующую вещь поверх прошлой.`,move:`Можно выбрать и стат из другой строки: он переедет сюда, а та строка освободится.`,chain:`Цепочка — приоритет статов билда: зелёные есть на вещи, пунктирные — нет. Первые места важнее.`,code:`Код вещи — для чата гильдии: там его вводят через «Ввести код» и видят оценку по своему ростеру.`,temp:`«Временно» — вещь пойдёт, пока не найдёшь лучше. В разбор её не торопись.`,prio:`Приоритет сабстатов: › — по порядку, = — одно место, зачёркнутые на 6★ сабстатом не выпадают. По этой строке считается цепочка в вердикте.`,builds:`Билды собираются из вещей персонажа сами — каждый из всего пула. Штамп держат начатые (начинает одна вещь сета или оружие из списка) и отмеченные «Собираю».`,gear:`Вещи — у персонажа, а билды собираются из них сами: один Speed-шлем идёт и в Speed, и в Speed/Immu.`,tryOn:`«Примерить» — оценка только для этого персонажа, слот и сет уже на форме. «Надеть» — сразу этому персонажу.`,piece:`Сделал в игре Reforge или Breakthrough — поправь здесь сегменты и «T4», как на вещи в игре: сравнение идёт по тому, что есть.`,tryStrip:`Оценка только для этого персонажа: строка карточки и «Надеть» — про этого персонажа, штамп — общий. ✕ — снова для всех.`,vs:`▲ — лучше того, что стоит в билде, ▼ — хуже; «сет 3 из 4» — билд станет ближе к сборке. Кнопка — надеть или заменить.`,cardEquip:`Надень одной кнопкой под карточкой: вещь запишется надетой. Что не надето и не вошло ни в один билд, уйдёт из вещей персонажа.`,equipAll:`Здесь — те, кому вещь встанет в билд. Не по билду — найди персонажа по имени: «Надеть» запишет её как надетую.`,material:`Фоддер, а не разбор: такая же вещь стоит в собираемом билде не на T4 — эта пойдёт ей в Breakthrough.`,worn:`Вещь неплохая, но всем, кому она подходит, уже надето не хуже — поэтому «Разобрать». Разобрал вещь в игре — убери её в карточке персонажа.`,pool:`Все вещи персонажа по слотам. Разобрал вещь или пустил на Breakthrough — нажми на неё и «Убрать»: билды соберутся заново.`,want:`Не собираешь этот билд — выключи «Собираю»: вещи для него перестанут держать вердикт.`,variants:`У билда несколько связок сетов — показываю самую собранную. Другие — в чипах, «ещё N» — весь список.`,stats:`«По статам» — все вещи по цепочке, без сетов. Вещей не держит. Вещь не по билду: «Надеть на…» → поиск по имени.`,fusion:`Отметишь Core Fusion Eternal — Eternal станет неактивным, а его вещи перейдут к Core Fusion Eternal. Звезда на Eternal вернёт всё назад.`,bt:`Вещь уже на Breakthrough T4 — нажми «T4»: бонус сета и материал для Breakthrough посчитаются как в игре. Свежий дроп — T0, отмечать не нужно.`,wornTab:`Здесь — что на герое сейчас в игре. Пустой слот — «Ввести»: откроется оценка для этого слота.`,trade:`Обмен вещами: кто что наденет из всех вещей — у других, запасных, из инвентаря. «Сделал» — когда переоделся в игре. Булавка — вещи героя другим не отдаём.`,aimChange:`Переодеть в … — покажу, что надеть из своих. Билд, в который герой одет, обведён.`,share:`Поделись героем: по ссылке друг увидит, что на нём надето и под какой билд. Только просмотр — у друга ничего не изменится.`},news:{more:`настройки, резервная копия, язык и справка — в «Ещё»`,wornTab:`вкладка «Надето»: отметь, что сейчас на героях`,trade:`Обмен вещами — переодеть героя или команду из всех вещей`,move:`при замене стат из другой строки переезжает`,gear:`вещи персонажа — билды собираются сами`,bt:`отметка «T4» на форме`,share:`«Поделиться» героем — ссылка только для просмотра`},newsStrip:(e,t)=>`Новое: ${e}${t?` и ещё ${t}`:``}.`,newsShow:`Показать`,newsLater:`Позже`,tipsTitle:`Подсказки`,tipsOn:`вкл`,tipsOff:`выкл`,tipsReset:`Показать подск
