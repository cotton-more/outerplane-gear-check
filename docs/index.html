// Сколько стоит сегмент flat-стата относительно сегмента %-версии у ЭТОГО персонажа.
// %-сабстат умножает только собственную базу (уровень + эволюции + flat-quirks) — см. update.py.
function flatFactor(c, axis) {
  const f = c && c.flat && c.flat[axis];
  const t = TICK[axis];
  if (!f || !t || !f[0] || !f[1]) return CFG.flatFallback[axis]; // нет своей базы — берём средние
  const base = f[state.lv120 ? 1 : 0] + (state.quirks ? f[2] : 0);
  return t[0] / (base * t[1] / 100);
}
const flatCredit = (r) => (r >= CFG.flatFull ? 1 : r >= CFG.flatHalf ? 0.5 : 0);

function subWeights(build, c) {
  // «ключ сабстата предмета → вес / ступень / засчитывается (1, ½, 0)» по приоритету билда
  const out = new Map();
  const put = (key, w, tier, credit) => {
    const prev = out.get(key);
    credit = credit >= 1 ? 1 : credit >= 0.5 ? 0.5 : 0;
    if (!prev || prev.credit < credit || (prev.credit === credit && prev.w < w)) out.set(key, { w, tier, credit });
  };
  build.subs.forEach((tier, t) => {
    const w = CFG.tierWeights[Math.min(t, CFG.tierWeights.length - 1)];
    const tc = CFG.tierCredit[t] ?? 0;
    for (const raw of tier) {
      const tok = raw.trim();
      const axis = tok.replace(/%$/, '');
      if (FLAT.has(axis)) {
        // ATK/DEF/HP в приоритете — ось: подходит и flat, и %; лучшая из двух версий получает полный вес
        const r = flatFactor(c, axis);
        put(axis + '%', r > 1 ? w / r : w, t, tc * (r > 1 ? flatCredit(1 / r) : 1));
        put(axis, r > 1 ? w : w * r, t, tc * flatCredit(Math.min(r, 1)));
      } else if (tok === 'SPD') {
        put(tok, w, t, 1); // скорость полезна на любой ступени — так её и оценивают игроки
      } else if (SUB[tok]) {
        put(tok, w, t, tc); // токены, которые не выпадают сабстатом (CDMG RED%), пропускаем
      }
    }
  });
  return out;
}

function scoreBuild(c, build, subs, excluded) {
  const W = subWeights(build, c);
  const keys = Object.keys(subs);
  const n = Math.max(keys.length, state.grade === 'rare' ? 3 : 4);
  const ideal = [...W.entries()].filter(([k]) => !excluded.has(k)).map(([, v]) => v.w).sort((a, b) => b - a).slice(0, n);
  const max = ideal.reduce((a, b) => a + b, 0) || 1;
  let got = 0, good = 0, yellow = 0;
  const parts = keys.map((k) => {
    const w = W.get(k);
    const m = CFG.rollMult[Math.min(Math.max(subs[k] || 1, 1), CFG.rollMult.length - 1)];
    if (w) { got += w.w * m; good += w.credit; if (w.credit) yellow += subs[k] || 1; }
    return { key: k, ok: !!(w && w.credit), half: !!(w && w.credit > 0 && w.credit < 1), tier: w ? w.tier : null };
  });
  return { ratio: got / max, good, yellow, spd: !!(W.get('SPD') && 'SPD' in subs), parts };
}

function buildsOf(pred) {
  const out = [];
  for (const c of D.chars) c.builds.forEach((b, i) => { if (pred(b, c)) out.push({ c, b, i }); });
  return out;
}
const combosWith = (b, setId) => b.sets.filter((combo) => combo.some((p) => p.set === setId));
const comboText = (combo) => combo.map((p) => `${SET[p.set] ? SET[p.set].short : p.set} ×${p.n}`).join(' + ');
const gearList = (b, kind) => (kind === 'weapon' ? b.weapons : b.amulets);
const gearRef = (b, kind, key) => gearList(b, kind).find((g) => g.key === key) || { mains: [] };
const slotMains = (b, kind) => new Set(gearList(b, kind).flatMap((g) => g.mains));
const uniqChars = (list) => [...new Map(list.map((x) => [x.c.id, x.c])).values()];
const namesLine = (list, max = 6) => {
  const u = uniqChars(list).map((c) => c.name);
  return esc(u.slice(0, max).join(', ')) + (u.length > max ? ` и ещё ${u.length - max}` : '');
};

// строки списка: оценка каждого билда + один персонаж — одна строка (лучший билд), остальные — в «ещё»
function rows(list, subs, excluded, extra) {
  const hasSubs = Object.keys(subs).length > 0;
  return list.map((x) => ({
    ...x,
    ...(hasSubs ? scoreBuild(x.c, x.b, subs, excluded) : { ratio: null, good: null, parts: [], spd: false, yellow: 0 }),
    ...(extra ? extra(x) : {}),
  }));
}
function dedupe(list, rank) {
  list.sort((a, b) => rank(b) - rank(a) || a.c.name.localeCompare(b.c.name));
  const seen = new Map();
  for (const r of list) {
    const prev = seen.get(r.c.id);
    if (prev) { if (!prev.alt.includes(r.b.name)) prev.alt.push(r.b.name); } else seen.set(r.c.id, { ...r, alt: [] });
  }
  return [...seen.values()];
}

function evaluate() {
  const res = { v: 'idle', title: '', lines: [], sections: [], badge: '', foot: '' };
  return isArmor(state.slot) ? evalArmor(res, state.subs) : evalGear(res, state.subs);
}

function evalArmor(res, subs) {
  const s = state;
  const legend = s.grade === 'unique';
  const nSubs = Object.keys(subs).length;
  const expected = legend ? 4 : 3;
  res.foot = `Броня: полезный сабстат — из 1–3 ступени приоритета билда (4-я — за ½, SPD — на любой; слабый flat — за ½ или не считается). Оставить — ${CFG.keepCount}+ полезных под лучший билд или ${CFG.spdKeep} с SPD от ${CFG.spdRoll} жёлтых сегментов.`;
  const set = SET[s.setId];
  if (!set) {
    res.title = 'Выбери сет';
    res.lines = [`Сет написан в названии после «of»: <b>${GRADE_PREFIX[s.grade]} ${esc(SLOT[s.slot].game)} of Speed</b> → ${GRADE_NAME[s.grade]}, Speed Set.`];
    return res;
  }
  const all = buildsOf((b) => combosWith(b, set.id).length);
  if (!all.length) {
    res.v = 'junk';
    res.title = `Скорее разбирай — ${set.short} Set нет ни в одном билде`;
    const eff = [set.p2 && `2 шт.: ${esc(set.p2)}`, set.p4 && `4 шт.: ${esc(set.p4)}`].filter(Boolean).join('; ');
    res.lines = [
      `outerpedia не ставит <b>${esc(set.name)}</b> ни одному из ${D.meta.counts.withBuilds} персонажей с билдами${eff ? ` (на T4 — ${eff})` : ''}.`,
      DEAD_SET_WHY[set.short] || 'Эффект ситуативный: в каждом билде есть сет, который даёт больше.',
      'Если сам играешь от этого сета (например, в PvP) — оставь экземпляры с хорошими сабстатами. Список обновится сам, когда сет появится в билдах outerpedia.',
    ];
    return res;
  }
  const judged = all.filter((x) => x.b.subs.some((t) => t.length));
  const spdRoll = subs.SPD || 0;
  const qualifies = (m) => m.good != null && (m.good >= CFG.keepCount || (m.spd && m.good >= CFG.spdKeep && spdRoll >= CFG.spdRoll));
  res.qualifies = qualifies;
  const rank = (r) => (qualifies(r) ? 100 : 0) + (r.good ?? 0) * 2 + (r.ratio ?? 0) + (r.combos.some((cb) => cb.some((p) => p.n >= 4)) ? 0.001 : 0);
  const extra = (x) => ({ combos: combosWith(x.b, set.id) });
  const scoped = dedupe(rows(judged.filter((x) => inScope(x.c)), subs, new Set(), extra), rank);
  const others = dedupe(rows(judged.filter((x) => !inScope(x.c)), subs, new Set(), extra), rank);
  const whoWears = `Кто носит ${set.short} Set`;
  const othersSection = () => { if (others.length) res.sections.push({ title: 'Не из ростера', rows: others, dim: true, limit: 6 }); };

  if (!scoped.length) {
    res.v = 'junk';
    res.title = `Разбирай — ${set.short} Set не нужен твоим персонажам`;
    res.lines = [`Сет стоит только в билдах тех, кого нет в ростере: ${namesLine(others)}.`];
    const good = others.filter(qualifies);
    if (good.length) {
      res.v = 'maybe'; res.title = 'Не для твоего ростера — но предмет хороший';
      res.lines.push(`Для ${namesLine(good, 4)} это «Оставить». Если планируешь их качать — не разбирай.`);
    }
    othersSection();
    return res;
  }
  if (!nSubs) {
    res.title = `${set.short} Set нужен ${personsDat(scoped.length)}`;
    res.lines = ['Отметь сабстаты предмета — посчитаю, кому он подходит.'];
    res.sections.push({ title: whoWears, rows: scoped, limit: 12 });
    othersSection();
    return res;
  }

  const keepers = scoped.filter(qualifies);
  const best = keepers[0] || scoped[0];
  const okList = best.parts.filter((p) => p.ok).map((p) => esc(p.key) + (p.half ? ' (½)' : ''));
  const who = `<b>${esc(best.c.name)}</b> — ${esc(best.b.name)}`;
  const partial = nSubs < expected;
  const canStillKeep = best.good + (expected - nSubs) >= CFG.spdKeep;
  // SPD уже среди полезных, но выпало мало сегментов: если на самом деле их больше — это «Оставить»
  const spdHint = spdRoll < CFG.spdRoll && scoped.some((m) => m.spd && m.good >= CFG.spdKeep);

  if (keepers.length) {
    res.v = 'keep';
    res.title = `Оставляй — подходит ${personsDat(keepers.length)}`;
    res.lines.push(`Лучше всего: ${who}. Полезны ${fmtGood(best.good)} из ${nSubs}: ${okList.join(', ')}.`);
    if (best.good < CFG.keepCount) res.lines.push(`Полезных всего ${fmtGood(best.good)}, но SPD с ${spdRoll} жёлтыми сегментами вытягивает.`);
    const roll = rollInfo(best, nSubs);
    if (roll) res.lines.push(roll.text);
    if (best.yellow >= CFG.godYellow || (best.spd && spdRoll >= 3)) res.badge = 'Топ-ролл';
    else if (roll && roll.level === 'high') res.badge = 'Стоит прокачать';
    if (legend && nSubs === 4 && Object.values(subs).every((r) => r >= 3)) res.lines.push('Все 4 сабстата с 3 жёлтыми сегментами (3×4) — ивентовое качество.');
    res.sections.push({ title: 'Кому подходит', rows: keepers, limit: 12, count: keepers.length });
    const rest = scoped.filter((m) => !qualifies(m));
    if (rest.length) res.sections.push({ title: `Носят ${set.short} Set, но сабстаты не те`, rows: rest, collapsed: true });
    othersSection();
    return res;
  }
  if (partial && canStillKeep) {
    res.title = `Отмечено ${nSubs} из ${expected} — отметь остальные`;
    res.lines.push(`Пока полезных ${fmtGood(best.good)}. Лучший кандидат: ${who}.`);
    res.sections.push({ title: whoWears, rows: scoped, limit: 12 });
    othersSection();
    return res;
  }
  if (legend && s.fodder && !partial) {
    res.v = 'fodder';
    res.title = 'Фоддер — сабстаты не дотянули';
    res.lines.push(best.good ? `Лучший вариант: ${who}, полезны только ${fmtGood(best.good)}: ${okList.join(', ')}.` : `Ни один сабстат не нужен билдам с ${esc(set.short)} Set.`);
    res.lines.push(`Для Breakthrough и реролла Transistone (Total) сабстаты не важны — годится любой Legendary ${esc(SLOT[s.slot].game)} ${esc(set.short)} Set. Держи не больше 4 на сет и слот: столько нужно, чтобы довести один предмет до T4.`);
  } else {
    res.v = 'junk';
    res.title = partial ? 'Разбирай — даже с последним сабстатом не вытянет' : 'Разбирай — сабстаты мимо';
    res.lines.push(best.good ? `Даже лучшему варианту (${who}) полезны только ${fmtGood(best.good)}: ${okList.join(', ')}.` : `Ни один сабстат не нужен билдам с ${esc(set.short)} Set.`);
    if (!legend && best.good >= 2) res.lines.push('Для Epic двух полезных без хорошего SPD мало: Transistone на Epic не тратят, а в Breakthrough для Legendary он не годится.');
    if (legend && !partial) res.lines.push(`Копишь фоддер для T4 ${esc(set.short)} Set? Включи это в «Настройках оценки» — такие предметы станут «Фоддер».`);
  }
  if (spdHint) res.lines.push(`Проверь SPD: если у него ${CFG.spdRoll}+ жёлтых сегмента — отметь, это уже «Оставить».`);
  res.sections.push({ title: whoWears, rows: scoped, collapsed: true });
  // предмет хорош для тех, кого нет в ростере — не даём разобрать молча
  if (others.some(qualifies)) {
    res.v = 'maybe';
    res.title = 'Твоим не подходит, но предмет хороший';
    res.lines.unshift(`Для персонажей не из ростера это «Оставить»: ${namesLine(others.filter(qualifies), 4)}. Если планируешь их качать — не разбирай.`);
  }
  othersSection();
  return res;
}

// «Ролл» предмета: сколько сабстатов полезны лучшему кандидату и сколько на них жёлтых сегментов.
// Жёлтые — стартовое качество; от него зависит, сколько получится после Reforge, то есть стоит ли вкладываться.
function rollInfo(m, n) {
  if (!m || m.good == null || !n) return null;
  const max = 3 * n;
  const level = m.yellow >= CFG.rollHigh * max ? 'high' : m.yellow >= CFG.rollMid * max ? 'mid' : 'low';
  const word = { high: 'высокий, стоит вкладываться в прокачку', mid: 'средний', low: 'низкий' }[level];
  return { level, text: `Ролл: полезных ${fmtGood(m.good)} из ${n}, жёлтых сегментов на них ${m.yellow} из ${max} возможных — ${word}.` };
}

function evalGear(res, subs) {
  const s = state;
  const kind = s.slot;
  const sl = SLOT[kind];
  const epic = s.grade === 'rare';
  const nSubs = Object.keys(subs).length;
  const expected = epic ? 3 : 4;
  res.foot = `Оружие и аксессуары: ценность Legendary — в уникальной пассивке и правильном main stat; сабстаты правят Precise Craft и Transistone. Временная замена (без нужной пассивки) стоит места, только если ролл хороший: ${CFG.tempGood} полезных сабстата или ${CFG.tempGood2} полезных с ${CFG.tempYellow}+ жёлтыми сегментами на них.`;

  // кто взял бы предмет с таким main как временный: класс подходит, и билд просит этот main в этом слоте
  const stopgapFor = (main, classLimits) => buildsOf((b, c) => (!classLimits.length || classLimits.includes(c.class)) && slotMains(b, kind).has(main));
  // «2 полезных + много жёлтых» — только для 3 сабстатов; у 4-сабстатного предмета нужно 3 полезных
  const tempOk = (m) => m.good != null && (m.good >= CFG.tempGood || (m.good >= Math.max(CFG.tempGood2, nSubs - 1) && m.yellow >= CFG.tempYellow));
  res.qualifies = tempOk;
  const tempRank = (r) => (tempOk(r) ? 100 : 0) + (r.good ?? 0) * 2 + (r.yellow ?? 0) * 0.1 + (r.ratio ?? 0) * 0.01;

  // общий вердикт для временной замены (Epic или Legendary с пассивкой не из билдов)
  const judgeStopgap = (cands, what) => {
    if (!cands.length) return false;
    if (!nSubs) {
      res.title = `Как временная замена подойдёт ${personsDat(cands.length)} — отметь сабстаты`;
      res.lines.push(`${what} Держать стоит только с хорошим роллом: ${CFG.tempGood} полезных сабстата или ${CFG.tempGood2} полезных с ${CFG.tempYellow}+ жёлтыми сегментами на них.`);
      res.sections.push({ title: 'Кому подошёл бы по main stat', rows: cands, limit: 8, mainNote: s.main });
      return true;
    }
    const good = cands.filter(tempOk);
    const best = good[0] || cands[0];
    const roll = rollInfo(best, nSubs);
    const who = `<b>${esc(best.c.name)}</b> — ${esc(best.b.name)}`;
    if (good.length) {
      res.v = 'temp';
      res.title = `Временно — хороший ролл для ${personsGen(good.length)}`;
      res.lines.push(`${what} Лучше всего: ${who}.`);
      if (roll) res.lines.push(roll.text);
      res.lines.push(`Носи, пока у персонажа нет рекомендованного Legendary. Держи 1–2 лучших экземпляра на main ${esc(s.main)}; остальные такие — в разбор.`);
      if (roll && roll.level === 'high') res.badge = 'Стоит прокачать';
      res.sections.push({ title: 'Кому пойдёт временно', rows: good, limit: 12, count: good.length, mainNote: s.main });
      const rest = cands.filter((m) => !tempOk(m));
      if (rest.length) res.sections.push({ title: 'Подошёл бы по main stat, но сабстаты не те', rows: rest, collapsed: true, mainNote: s.main });
    } else if (nSubs < expected && best.good + (expected - nSubs) >= CFG.tempGood2) {
      res.title = `Отмечено ${nSubs} из ${expected} — отметь остальные`;
      res.lines.push(`Пока полезных ${fmtGood(best.good)}. Лучший кандидат: ${who}.`);
      res.sections.push({ title: 'Кому подошёл бы по main stat', rows: cands, limit: 8, mainNote: s.main });
    } else {
      res.v = 'junk';
      res.title = 'Разбирай — слабый ролл';
      res.lines.push(`Main ${esc(s.main)} подошёл бы ${personsDat(cands.length)}, но сабстаты слабые: даже лучшему варианту (${who}) полезны только ${fmtGood(best.good)}.`);
      if (roll) res.lines.push(roll.text);
      if (best.good >= CFG.tempGood2) res.lines.push(`Отметь жёлтые сегменты, если их больше одного: при ${CFG.tempYellow}+ на полезных статах такой предмет стоит оставить.`);
      res.sections.push({ title: 'Кому подошёл бы по main stat', rows: cands, collapsed: true, mainNote: s.main });
    }
    return true;
  };

  if (epic) {
    // у Epic нет пассивки — важен main и ролл; Steel Sword/Necklace и [Settlement Support] равноценны
    if (!s.main) {
      res.title = `Epic ${sl.ru}: какой main stat?`;
      res.lines = [`У Epic ${sl.ruGen} нет уникальной пассивки: это временная замена, пока нет Legendary. Решают main stat (цифры на кнопках — скольким персонажам он нужен) и ролл сабстатов.`];
      if (s.stage === 'end') res.lines.push('Этап «Эндгейм»: Epic без пассивки идёт в разбор.');
      return res;
    }
    if (s.stage === 'end') {
      res.v = 'junk'; res.title = `Разбирай — Epic ${sl.ru} без пассивки`;
      res.lines = ['Этап «Эндгейм»: в билдах outerpedia только Legendary с уникальной пассивкой. Если у кого-то слот пустой — переключи этап на «Развитие» в настройках.'];
      return res;
    }
    const cands = dedupe(rows(stopgapFor(s.main, []).filter((x) => inScope(x.c)), subs, new Set([s.main])), tempRank);
    if (!judgeStopgap(cands, `Пассивки нет, но main ${esc(s.main)} — тот, что просят в слоте ${sl.ruGen}.`)) {
      res.v = 'junk'; res.title = `Разбирай — ${s.main} на ${sl.ruPrep} никому не нужен`;
      res.lines = [`Ни один билд${scopeActive() ? ' твоих персонажей' : ''} не просит main ${esc(s.main)} в этом слоте.`];
    }
    return res;
  }

  const item = ITEM[kind][s.itemKey];
  if (!item) {
    res.title = `Выбери ${sl.ru}`;
    res.lines = ['Найди по названию или пассивке — на английском, как в игре.'];
    const low = LOW_STAR_USED.filter((i) => i.kind === kind);
    for (const i of low) {
      const who = buildsOf((b) => gearList(b, kind).some((g) => g.key === i.key)).filter((x) => inScope(x.c));
      if (who.length) res.lines.push(`Всё ниже 6★ — в разбор, кроме <b>${esc(i.name)}</b> ${i.star}★: его носит ${namesLine(who, 3)}.`);
    }
    return res;
  }
  const noMainChoice = !item.mains.length && !item.extraMains.length;
  const all = buildsOf((b) => gearList(b, kind).some((g) => g.key === item.key));
  const scopedAll = all.filter((x) => inScope(x.c));
  const wanted = [...new Set(scopedAll.flatMap((x) => gearRef(x.b, kind, item.key).mains))];
  if (!s.main && !noMainChoice) {
    res.title = scopedAll.length ? `Нужен ${personsDat(uniqChars(scopedAll).length)} — какой main stat?` : 'Какой main stat?';
    res.lines = scopedAll.length
      ? [`Для этой пассивки билды просят main <b>${wanted.map(esc).join(', ')}</b>.`]
      : ['Пассивка не из билдов твоих персонажей — по main stat и роллу посчитаю, годится ли предмет как временная замена.'];
    return res;
  }
  const excluded = new Set(s.main ? [s.main] : []);
  const mainOkFor = (x) => { const m = gearRef(x.b, kind, item.key).mains; return noMainChoice || !m.length || m.includes(s.main); };
  const extra = (x) => ({ mains: gearRef(x.b, kind, item.key).mains, mainOk: mainOkFor(x) });
  const rank = (r) => (r.mainOk ? 100 : 0) + (r.good ?? 0) * 2 + (r.ratio ?? 0);
  const scoped = dedupe(rows(scopedAll, subs, excluded, extra), rank);
  const others = dedupe(rows(all.filter((x) => !inScope(x.c)), subs, excluded, extra), rank);
  const ok = scoped.filter((r) => r.mainOk);
  const temp = s.main && s.stage === 'grow'
    ? dedupe(rows(stopgapFor(s.main, item.classLimits).filter((x) => inScope(x.c) && !ok.some((o) => o.c.id === x.c.id)), subs, excluded), tempRank)
    : [];

  if (ok.length) {
    res.v = 'keep';
    res.qualifies = null;
    res.title = noMainChoice ? `Оставляй — нужен ${personsDat(ok.length)}` : `Оставляй — ${s.main} подходит ${personsDat(ok.length)}`;
    res.lines.push(`Уникальная пассивка + правильный main stat — это главное. ${nSubs ? 'Сабстаты правятся Precise Craft и Transistone.' : 'Отметь сабстаты, чтобы увидеть качество ролла.'}`);
    if (item.irregular) res.lines.push('Irregular-предмет — первый кандидат на Transistone.');
    const roll = nSubs ? rollInfo(ok[0], nSubs) : null;
    if (roll) {
      res.lines.push(roll.text);
      if (roll.level === 'high') res.badge = 'Стоит прокачать';
      else if (ok[0].good < 2) res.lines.push('Сабстаты слабые — кандидат на реролл, если под эту пассивку нет экземпляра лучше.');
    }
    res.sections.push({ title: 'Кому подходит', rows: ok, limit: 12, count: ok.length });
    const wrong = scoped.filter((r) => !r.mainOk);
    if (wrong.length) res.sections.push({ title: 'Нужен, но с другим main stat', rows: wrong, collapsed: true });
  } else if (scoped.length) {
    // предмет в билдах, но main не тот
    res.v = 'fodder'; res.qualifies = null;
    res.title = `Фоддер — ${s.main} для этой пассивки не берут`;
    res.lines.push(`Билды просят main <b>${wanted.map(esc).join(' / ')}</b>, а main stat не перебрасывается. Гайд outerpedia советует такие не разбирать: это фоддер для Breakthrough такого же предмета с правильным main (до T4 — 4 копии).`);
    const goodTemp = temp.filter(tempOk);
    if (goodTemp.length) res.lines.push(`А пока — хорошая временная замена для ${personsGen(goodTemp.length)} (список ниже).`);
    res.sections.push({ title: 'Кому нужен (с другим main)', rows: scoped, collapsed: !!goodTemp.length });
    if (goodTemp.length) res.sections.push({ title: 'Кому пойдёт временно', rows: goodTemp, limit: 8, mainNote: s.main });
  } else if (!judgeStopgap(temp, `<b>${esc(item.name)}</b> ${all.length ? 'не стоит в билдах твоих персонажей' : 'не стоит ни в одном билде outerpedia'}, но main ${esc(s.main)} — тот, что просят в слоте ${sl.ruGen}${item.classLimits.length ? ` у класса ${item.classLimits.map((c) => D.classes[c]).join('/')}` : ''}.`)) {
    res.v = 'junk';
    res.title = all.length ? 'Разбирай — не нужен твоим персонажам' : 'Разбирай — предмет никому не нужен';
    res.lines.push(all.length
      ? `Рекомендуют только тем, кого нет в ростере: ${namesLine(all.filter((x) => !inScope(x.c)))}.`
      : `<b>${esc(item.name)}</b> не стоит ни в одном билде outerpedia${s.stage === 'grow' && s.main ? `, а main ${esc(s.main)} в этом слоте никому из подходящего класса не нужен` : ''}.`);
    if (s.stage === 'end' && s.main) res.lines.push('Этап «Эндгейм»: временные замены не учитываются.');
  }
  if (res.v !== 'keep' && res.v !== 'fodder' && others.some((r) => r.mainOk)) {
    if (res.v === 'junk') { res.v = 'maybe'; res.title = 'Твоим не нужен, но предмет хороший'; }
    res.lines.unshift(`С этим main stat его берут персонажи не из ростера: ${namesLine(others.filter((r) => r.mainOk), 4)}.`);
  }
  if (others.length) res.sections.push({ title: 'Не из ростера', rows: others, dim: true, limit: 6 });
  return res;
}

function epicMains(kind) {
  const out = [];
  for (const i of ITEMS[kind]) if (i.grade === 'rare' && i.star === 6) for (const m of [...i.mains, ...i.extraMains]) if (!out.includes(m)) out.push(m);
  return out;
}

/* =====================================================================
   Рендер: оценка
   ===================================================================== */
function renderEvalInput() {
  const s = state;
  let html = `<div class="step"><div class="step-h"><h2>Слот</h2><span class="hint">что за предмет</span></div><div class="slots">`;
  SLOTS.forEach((sl, i) => {
    html += `<button type="button" class="slot" data-slot="${sl.id}" aria-pressed="${s.slot === sl.id}">${img('eq:' + D.slotIcons[sl.id], '', '')}<span>${sl.name}</span><kbd>${i + 1}</kbd></button>`;
  });
  html += `</div></div>`;
  html += `<div class="step"><div class="step-h"><h2>Грейд</h2><span class="hint">6★ · Etheric = Legendary, Steel = Epic</span></div><div class="grades">`;
  for (const g of ['unique', 'rare']) html += `<button type="button" class="grade ${g}" data-grade="${g}" aria-pressed="${s.grade === g}">${img('frame:' + g, '', '')}<span class="gname">${GRADE_NAME[g]}</span></button>`;
  html += `</div></div>`;
  if (isArmor(s.slot)) html += renderSetStep();
  else if (s.grade === 'rare') html += renderEpicMainStep();
  else html += renderItemStep();
  html += renderSubStep();

  html += `<div class="actions"><button type="button" class="btn primary" data-act="next">Следующий предмет</button>
    <label class="toggle"><input type="checkbox" id="opt-roster" ${s.rosterOnly ? 'checked' : ''}> только мои персонажи${roster.size ? ` (${roster.size})` : ' — отметь их во вкладке «Персонажи»'}</label>
    <span class="hk">${hotkeysHint()}</span></div>`;
  const cur = [s.stage === 'end' ? 'эндгейм' : 'развитие', s.fodder ? 'коплю фоддер' : 'без фоддера брони', s.lv120 ? 'lv 120' : 'lv 100', s.quirks ? 'Quirks' : 'без Quirks'];
  html += `<details class="settings" id="settings"${s.settingsOpen ? ' open' : ''}><summary>Настройки оценки <span class="cur">· ${esc(cur.join(' · '))}</span></summary><div class="settings-body">
      <div class="seg" role="group" aria-label="Этап аккаунта"><span class="muted small">Этап:</span>
        <button type="button" class="fbtn" data-stage="grow" aria-pressed="${s.stage === 'grow'}">Развитие — держу временные замены</button>
        <button type="button" class="fbtn" data-stage="end" aria-pressed="${s.stage === 'end'}">Эндгейм — только рекомендованное</button></div>
      <label class="toggle"><input type="checkbox" id="opt-fodder" ${s.fodder ? 'checked' : ''}> коплю Legendary броню для Breakthrough <span class="muted">(не дотянувшие по сабстатам станут «Фоддер», а не «Разобрать»)</span></label>
      <div class="seg" role="group" aria-label="Уровень персонажей"><span class="muted small">Уровень персонажей:</span>
        <button type="button" class="fbtn" data-lv="100" aria-pressed="${!s.lv120}">lv 100</button><button type="button" class="fbtn" data-lv="120" aria-pressed="${s.lv120}">lv 120 (Limit Break)</button></div>
      <label class="toggle"><input type="checkbox" id="opt-quirks" ${s.quirks ? 'checked' : ''}> Quirks прокачаны <span class="muted">(Base → Quirk: бонусы статов по элементу и классу)</span></label>
      <p class="muted small">Уровень и Quirks влияют только на сравнение flat и % у ATK/DEF/HP: %-сабстат умножает собственную базу персонажа (уровень + эволюции + flat-бонусы Quirks), а flat прибавляет фиксированное число. Чем выше база, тем выгоднее %.</p>
    </div></details>`;
  $('#eval-in').innerHTML = html;
}

function hotkeysHint() {
  return matchMedia('(hover: hover) and (pointer: fine)').matches ? '<kbd>1</kbd>–<kbd>6</kbd> слот · <kbd>L</kbd>/<kbd>E</kbd> грейд · <kbd>/</kbd> поиск · <kbd>Esc</kbd> сброс' : '';
}

function setTitle(set) {
  const t4 = [set.p2 && '2: ' + set.p2, set.p4 && '4: ' + set.p4].filter(Boolean).join(', ');
  const t0 = [set.p2base && '2: ' + set.p2base, set.p4base && '4: ' + set.p4base].filter(Boolean).join(', ');
  return t0 && t0 !== t4 ? `T0 — ${t0}\nT4 — ${t4}` : t4;
}

function renderSetStep() {
  const s = state;
  const scoped = scopeActive();
  const usersIn = (id) => uniqChars(buildsOf((b) => combosWith(b, id).length).filter((x) => inScope(x.c))).length;
  const sel = SET[s.setId];
  let html = `<div class="step"><div class="step-h"><h2>Сет</h2><span class="hint">в названии после «of»</span>${sel ? '<button type="button" class="linkbtn" data-act="unset">сменить</button>' : ''}</div>`;
  if (sel) {
    const n = sel.users ? (scoped ? `${usersIn(sel.id)} из ростера · ${sel.users} всего` : `в билдах у ${sel.users}`) : 'нет в билдах outerpedia';
    html += `<div class="picked">${img('eq:' + sel.icon, 'pi', '')}<div><b>${esc(sel.name)}</b><span>${esc(n)}</span></div></div>`;
    return html + `<p class="note-line">${esc(setTitle(sel).replace('\n', ' · '))}</p></div>`;
  }
  const live = D.sets.filter((x) => x.users > 0).map((set) => ({ set, n: scoped ? usersIn(set.id) : set.users })).sort((a, b) => b.n - a.n || b.set.users - a.set.users);
  html += `<div class="sets">${live.map(({ set, n }) => `<button type="button" class="set" data-set="${set.id}" aria-pressed="false" title="${esc(setTitle(set))}">${img('eq:' + set.icon, '', '')}<b>${esc(set.short)}</b><span>${scoped ? `${n} из ростера` : persons(n)}</span></button>`).join('')}</div>`;
  const dead = D.sets.filter((x) => x.users === 0);
  if (dead.length) {
    html += `<p class="dead-h">Нет ни в одном билде outerpedia — обычно в разбор (нажми, чтобы узнать почему):</p><div class="dead">`;
    html += dead.map((set) => `<button type="button" class="deadchip" data-set="${set.id}" title="${esc(setTitle(set))}">${img('eq:' + set.icon, '', '')}${esc(set.short)}</button>`).join('');
    html += `</div>`;
  }
  return html + `</div>`;
}

const itemPool = () => ITEMS[state.slot].filter((i) => i.star === 6 && i.grade === 'unique');

function renderEpicMainStep() {
  const s = state;
  const kind = s.slot;
  let html = `<div class="step"><div class="step-h"><h2>Main stat</h2><span class="hint">Epic: Steel ${kind === 'weapon' ? 'Sword' : 'Necklace'}, без пассивки</span></div><div class="chips">`;
  const demand = (m) => uniqChars(buildsOf((b) => slotMains(b, kind).has(m)).filter((x) => inScope(x.c))).length;
  for (const m of epicMains(kind)) {
    const n = demand(m);
    html += `<button type="button" class="chip" data-main="${esc(m)}" aria-pressed="${s.main === m}">${statIcon(m)}${esc(m)}${n ? `<span class="want">${n}</span>` : ''}</button>`;
  }
  return html + `</div><p class="note-line">Цифра — скольким${scopeActive() ? ' твоим' : ''} персонажам этот main нужен в слоте ${SLOT[kind].ruGen}.</p></div>`;
}

function renderItemStep() {
  const s = state;
  const kind = s.slot;
  const item = ITEM[kind][s.itemKey];
  let html = `<div class="step"><div class="step-h"><h2>${kind === 'weapon' ? 'Оружие' : 'Аксессуар'}</h2><span class="hint">название или пассивка — на английском</span>${item ? '<button type="button" class="linkbtn" data-act="unpick">сменить</button>' : ''}</div>`;
  if (item) {
    const multi = item.key.includes(':');
    html += `<div class="picked">${frame(item)}<div><b>${esc(item.name)}${item.irregular ? ' <span class="tok">Irregular</span>' : ''}</b><span>${esc(classText(item))} · ${item.users ? `в билдах у ${item.users}` : 'нет в билдах outerpedia'}${item.src ? ' · ' + esc(item.src) : ''}</span></div></div>`;
    html += item.passives.map((p) => `<p class="passive"><b>${esc(p.name)}.</b> ${esc(p.desc)}</p>`).join('');
    if (multi) html += `<p class="note-line">В игре у всех классовых версий одно имя — класс видно по иконке на плитке и суффиксу пассивки: Aggression — Striker, Determination — Defender, Precision — Ranger, Mystery — Mage, Blessing — Healer.</p>`;
    const mains = [...item.mains, ...item.extraMains];
    if (mains.length) {
      const wanted = new Set(buildsOf((b) => gearList(b, kind).some((g) => g.key === item.key)).filter((x) => inScope(x.c)).flatMap((x) => gearRef(x.b, kind, item.key).mains));
      html += `<div class="step-h" style="margin-top:14px"><h2>Main stat</h2><span class="hint">«нужен» — что просят билды для этой пассивки</span></div><div class="chips">`;
      for (const m of mains) {
        const rare = item.extraMains.includes(m);
        html += `<button type="button" class="chip${rare ? ' rare-main' : ''}" data-main="${esc(m)}" aria-pressed="${s.main === m}"${rare ? ' title="Только у фиксированных копий (ивенты, Dimensional Supply)"' : ''}>${statIcon(m)}${esc(m)}${wanted.has(m) ? '<span class="want">нужен</span>' : ''}</button>`;
      }
      html += `</div>`;
      if (item.extraMains.length) html += `<p class="note-line">Пунктиром — main stat, который бывает только у фиксированных копий этого предмета.</p>`;
    }
    return html + `</div>`;
  }
  html += `<div class="tools"><input class="search" id="item-q" type="search" placeholder="Например: Caracal, Destruction…" value="${esc(s.q)}" autocomplete="off" enterkeyhint="search">
    <div class="filt">${Object.entries(D.classes).map(([k, v]) => `<button type="button" class="fbtn" data-cls="${k}" aria-pressed="${s.cls === k}">${img('class:' + k, '', '')}${esc(v)}</button>`).join('')}</div></div>`;
  html += `<div class="items" id="items">${renderItems()}</div></div>`;
  return html;
}

function renderItems() {
  const s = state;
  const q = s.q.trim().toLowerCase();
  const scoped = scopeActive();
  const kind = s.slot;
  const usersIn = (item) => uniqChars(buildsOf((b) => gearList(b, kind).some((g) => g.key === item.key)).filter((x) => inScope(x.c))).length;
  const list = itemPool()
    .filter((i) => !s.cls || !i.classLimits.length || i.classLimits.includes(s.cls))
    .filter((i) => !q || i.name.toLowerCase().includes(q) || i.passives.some((p) => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)))
    .map((i) => ({ i, n: scoped ? usersIn(i) : i.users }))
    .sort((a, b) => (b.i.users > 0) - (a.i.users > 0) || b.n - a.n || a.i.name.localeCompare(b.i.name));
  if (!list.length) return `<p class="empty">Ничего не нашлось. Проверь написание${s.cls ? ' или сними фильтр класса' : ''}.</p>`;
  return list.map(({ i, n }) => `<button type="button" class="item${i.users ? '' : ' unused'}" data-item="${esc(i.key)}">${frame(i)}<div style="min-width:0"><b>${esc(i.name)}</b><span>${esc(i.passives[0] ? i.passives[0].name : 'без пассивки')} · ${i.users ? (scoped ? `${n} из ростера` : `в билдах у ${n}`) : 'нет в билдах'}</span></div></button>`).join('');
}

function frame(item) {
  return `<span class="frame">${img('frame:' + (item.grade === 'rare' ? 'rare' : 'unique'), '', '')}${img('eq:' + item.icon, 'ic', '')}</span>`;
}
function classText(item) {
  return item.classLimits.length ? item.classLimits.map((c) => D.classes[c] || c).join(', ') : 'любой класс';
}

function renderSubStep() {
  const s = state;
  const keys = Object.keys(s.subs);
  const n = keys.length;
  const blocked = new Set(s.main ? [s.main] : []);
  let html = `<div class="step"><div class="step-h"><h2>Сабстаты</h2><span class="hint">до 4${s.grade === 'rare' ? ' · у Epic изначально 3' : ''}</span><button type="button" class="linkbtn${n ? '' : ' ghost'}" data-act="clearsubs"${n ? '' : ' tabindex="-1" aria-hidden="true"'}>очистить</button></div><div class="subs">`;
  for (const k of SUB_LIST) {
    const on = k in s.subs;
    const r = s.subs[k] || 0;
    const dis = blocked.has(k) || (!on && n >= 4);
    let segs = '';
    for (let i = 1; i <= 6; i++) segs += `<i class="${on && i <= r ? 'on' : ''}"></i>`;
    html += `<button type="button" class="sub${FLAT.has(k) ? ' flat' : ''}" data-sub="${esc(k)}" aria-pressed="${on}" ${dis ? 'disabled' : ''} title="${esc((D.statNames[k] || k) + (FLAT.has(k) ? ' (flat)' : '') + (SUB[k] ? ` · +${SUB[k].step}${SUB[k].pct ? '%' : ''} за сегмент` : ''))}">${statIcon(k)}<span class="lab">${esc(k)}</span><span class="segs" aria-hidden="true">${segs}</span></button>`;
  }
  html += `</div>`;
  if (n) {
    html += `<div class="rolls"><p class="rolls-h">Жёлтых сегментов <span class="muted">— 1 по умолчанию; снять стат — нажать на него ещё раз</span></p>`;
    for (const k of keys) {
      const r = s.subs[k] || 1;
      html += `<div class="roll"><span class="roll-k">${statIcon(k)}<span class="lab">${esc(k)}</span></span><span class="roll-b" role="group" aria-label="Жёлтые сегменты ${esc(k)}">`;
      for (let i = 1; i <= 4; i++) html += `<button type="button" data-roll="${esc(k)}" data-n="${i}" aria-pressed="${r === i}" class="${i < r ? 'lit' : ''}${i === 4 ? ' r4' : ''}"${i === 4 ? ' title="4 жёлтых — только из спец. магазинов и Dimensional Supply"' : ''}>${i}</button>`;
      html += `</span></div>`;
    }
    html += `<p class="note-line">Жёлтые — стартовый ролл: обычно 1–3, 4 — редкость из спец. магазинов и Dimensional Supply. Оранжевые (от Reforge) не считай — это вложения, а не качество дропа.</p></div>`;
  } else {
    html += `<p class="note-line">Отметь статы, которые видишь на предмете. Flat ATK/DEF/HP подписаны тоньше: их ценность зависит от базы персонажа.</p>`;
  }
  return html + `</div>`;
}

const LABEL = { keep: 'Оставить', temp: 'Временно', maybe: 'Спорно', fodder: 'Фоддер', junk: 'Разобрать', idle: '…' };

function renderVerdict() {
  const s = state;
  const r = evaluate();
  const item = !isArmor(s.slot) ? ITEM[s.slot][s.itemKey] : null;
  const set = isArmor(s.slot) ? SET[s.setId] : null;
  let html = `<div class="v-head v-${r.v}"><div class="v-row"><span class="stamp">${LABEL[r.v]}</span>${r.badge ? `<span class="badge">${esc(r.badge)}</span>` : ''}`;
  if ((item && s.grade === 'unique') || set) {
    const icon = item ? item.icon : set.pieces[s.slot] || set.icon;
    html += `<span class="v-item"><span class="frame">${img('frame:' + s.grade, '', '')}${img('eq:' + icon, 'ic', '')}</span>${set ? img('eq:' + set.icon, 'seticon', '') : ''}</span>`;
  }
  html += `</div><p class="v-summary">${esc(r.title)}</p>`;
  if (r.lines.length) html += `<ul class="v-reasons">${r.lines.map((l) => `<li>${l}</li>`).join('')}</ul>`;
  html += `</div>`;

  for (const sec of r.sections) {
    if (!sec.rows.length) continue;
    const key = sec.title;
    const count = sec.count ?? sec.rows.length;
    html += `<div class="v-sec">`;
    if (sec.collapsed && !s.expand[key]) {
      html += `<button type="button" class="v-toggle" data-expand="${esc(key)}"><span>${esc(sec.title)} · ${count}</span><span aria-hidden="true">▾</span></button></div>`;
      continue;
    }
    html += `<div class="v-list-h"><h3>${esc(sec.title)}</h3><span class="muted small">${persons(count)}</span></div>`;
    const limit = s.expand[key + ':all'] ? 999 : (sec.limit || 12);
    html += `<ul class="matches">${sec.rows.slice(0, limit).map((m) => matchRow(m, sec, r)).join('')}</ul>`;
    if (sec.rows.length > limit) html += `<div class="more"><button type="button" class="linkbtn" data-expand="${esc(key + ':all')}">показать всех (${sec.rows.length})</button></div>`;
    html += `</div>`;
  }
  const legend = Object.keys(s.subs).length ? '<span>Цифра у стата — ступень приоритета билда (1 — важнее всего); жёлтый — засчитан за ½; зачёркнут — билду не нужен.</span>' : '';
  html += `<div class="v-foot">${legend}<span>${esc(r.foot)}</span></div>`;
  $('#verdict').innerHTML = html;

  const bar = $('#vbar');
  const show = s.tab === 'eval' && r.v !== 'idle';
  bar.hidden = !show;
  if (document.body) document.body.classList.toggle('has-vbar', show);
  if (show) {
    bar.className = `vbar v-${r.v}`;
    bar.querySelector('.vb-main').innerHTML = `<span class="stamp">${LABEL[r.v]}</span><span class="vt">${esc(r.title)}</span>`;
  }
}

function matchRow(m, sec, r) {
  const c = m.c;
  const tokens = [];
  if (m.combos && m.combos.length) tokens.push(...m.combos.map((cb) => `<span class="tok cmb">${esc(comboText(cb))}</span>`));
  if (m.mainOk !== undefined) tokens.push(`<span class="tok ${m.mainOk ? 'ok' : 'bad'}">main ${esc(m.mains.join('/') || 'любой')}</span>`);
  else if (sec.mainNote) tokens.push(`<span class="tok ok">main ${esc(sec.mainNote)}</span>`);
  for (const p of m.parts) tokens.push(`<span class="tok ${p.ok ? (p.half ? 'half' : 'ok') : 'no'}" title="${p.ok ? `ступень ${p.tier + 1}${p.half ? ' — засчитан за ½' : ''}` : 'билду не нужен'}">${esc(p.key)}${p.ok ? `<sup>${p.tier + 1}</sup>` : ''}</span>`);
  if (!m.parts.length && m.b.subs.length) tokens.push(`<span class="tok">${esc(m.b.subs.filter((t) => t.length).map((t) => t.join('=')).join(' › '))}</span>`);
  let score = '<span></span>';
  if (m.good != null) {
    const n = Object.keys(state.subs).length;
    const ok = r.qualifies ? r.qualifies(m) : m.good >= CFG.keepCount;
    const cls = ok ? 'hi' : m.good >= 2 ? 'mid' : 'lo';
    score = `<span class="score ${cls}" title="Полезных сабстатов ${fmtGood(m.good)} из ${n}; взвешенно по приоритету — ${Math.round(Math.min(m.ratio, 1) * 100)}%">${fmtGood(m.good) || 0}/${n}</span>`;
  }
  return `<li class="match${sec.dim ? ' dim' : ''}">${img('face:' + c.icon, 'face', '')}
    <div class="nm"><button type="button" data-open="${c.id}" title="Открыть билды">${esc(c.name)}</button><span class="bn">${esc(m.b.name)}${m.alt.length ? ` · ещё: ${esc(m.alt.join(', '))}` : ''}</span></div>
    ${score}<div class="det">${tokens.join('')}</div></li>`;
}

/* =====================================================================
   Рендер: персонажи
   ===================================================================== */
function charMatches(c) {
  const s = state;
  const q = s.cq.trim().toLowerCase();
  if (q && !(c.name.toLowerCase().includes(q) || c.slug.includes(q) || (c.nick || '').toLowerCase().includes(q))) return false;
  if (s.cel && c.element !== s.cel) return false;
  if (s.ccl && c.class !== s.ccl) return false;
  if (s.cOwned && !roster.has(c.id)) return false;
  if (!s.cAll && !c.builds.length && !q) return false;
  return true;
}

function renderCharList() {
  const s = state;
  let html = `<div class="step"><div class="step-h"><h2>Персонажи</h2><span class="hint">☆ — отметь своих: оценка будет учитывать только их</span></div>
    <div class="tools"><input class="search" id="char-q" type="search" placeholder="Имя: Stella, Demiurge, Gnosis…" value="${esc(s.cq)}" autocomplete="off" enterkeyhint="search"></div>
    <div class="tools"><div class="filt">${Object.entries(D.elements).map(([k, v]) => `<button type="button" class="fbtn" data-cel="${k}" aria-pressed="${s.cel === k}">${img('elem:' + k, '', '')}${esc(v)}</button>`).join('')}</div>
    <div class="filt">${Object.entries(D.classes).map(([k, v]) => `<button type="button" class="fbtn" data-ccl="${k}" aria-pressed="${s.ccl === k}">${img('class:' + k, '', '')}${esc(v)}</button>`).join('')}</div></div>
    <div class="filt"><label class="toggle"><input type="checkbox" id="c-owned" ${s.cOwned ? 'checked' : ''}> только мои</label>
    <label class="toggle"><input type="checkbox" id="c-all" ${s.cAll ? 'checked' : ''}> показать и без билдов</label></div></div>`;
  html += `<div class="roster-bar"><span>В ростере: <b>${roster.size}</b></span><button type="button" class="linkbtn" data-act="markshown">отметить всех показанных</button><button type="button" class="linkbtn" data-act="io">экспорт / импорт</button>${roster.size ? `<button type="button" class="linkbtn" data-act="clearroster">${s.confirmClear ? 'точно очистить? нажми ещё раз' : 'очистить ростер'}</button>` : ''}</div>`;
  if (s.io) {
    const code = [...roster].map((id) => CHAR[id].slug).join(', ');
    html += `<div class="roster-io"><label class="small muted" for="roster-code">Код ростера (slug через запятую). Скопируй, чтобы перенести в другой браузер, или вставь свой: «Заменить» заменит текущий ростер, «Добавить» — допишет.</label>
      <textarea id="roster-code">${esc(code)}</textarea><div class="filt"><button type="button" class="btn" data-act="copyroster">Скопировать</button><button type="button" class="btn" data-act="applyroster">Заменить</button><button type="button" class="btn" data-act="addroster">Добавить</button><span class="small muted" id="io-msg" role="status"></span></div></div>`;
  }
  const list = D.chars.filter(charMatches);
  html += `<div class="cgrid" id="cgrid">${list.map(charTile).join('') || '<p class="empty">Никого не нашлось.</p>'}</div>`;
  $('#char-list').innerHTML = html;
}

function charTile(c) {
  const own = roster.has(c.id);
  const base = c.prefix ? c.name.slice(c.prefix.length + 1) : c.name;
  return `<div class="cwrap"><button type="button" class="ctile${c.builds.length ? '' : ' nob'}" data-char="${c.id}" aria-pressed="${state.charId === c.id}" title="${esc(c.name + (c.nick && c.nick !== c.prefix ? ' — ' + c.nick : ''))}">
    <span class="badges">${img('elem:' + c.element, '', '')}${img('class:' + c.class, '', '')}</span>
    ${img('face:' + c.icon, 'face', '')}${NEW.has(c.id) ? '<span class="newb">NEW</span>' : ''}
    <span class="cn">${c.prefix ? `<span class="cp">${esc(c.prefix)}</span>` : ''}${esc(base)}</span></button>
    <button type="button" class="star" data-own="${c.id}" aria-pressed="${own}" aria-label="${esc(c.name)} — ${own ? 'убрать из ростера' : 'добавить в ростер'}">${own ? '★' : '☆'}</button></div>`;
}

function renderCharDetail() {
  const s = state;
  const c = CHAR[s.charId];
  const box = $('#char-detail');
  box.classList.toggle('open', !!c);
  if (document.body) document.body.classList.toggle('sheet-open', !!c && isSheet() && s.tab === 'chars');
  if (!c) { box.innerHTML = `<div class="cd-empty">Выбери персонажа — покажу рекомендованные сеты, оружие, аксессуары и приоритет сабстатов по билдам outerpedia.</div>`; return; }
  const own = roster.has(c.id);
  let html = `<div class="cd-top"><button type="button" class="btn" data-act="closechar">← к списку</button></div>
    <div class="cd-head">${img('face:' + c.icon, 'face', '')}<div><h2>${esc(c.name)}</h2>
    <div class="meta"><span>${img('elem:' + c.element, '', '')} ${esc(D.elements[c.element] || c.element)}</span><span>${img('class:' + c.class, '', '')} ${esc(D.classes[c.class] || c.class)}${c.subClass ? ' · ' + esc(cap(c.subClass)) : ''}</span>${c.role ? `<span>${esc(({ dps: 'DPS', support: 'Support', sustain: 'Sustain' })[c.role] || c.role)}</span>` : ''}${c.rank ? `<span>PvE ${esc(c.rank)}</span>` : ''}${c.rankPvp ? `<span>PvP ${esc(c.rankPvp)}</span>` : ''}</div>
    ${c.nick && c.nick !== c.prefix ? `<div class="muted small">${esc(c.nick)}</div>` : ''}</div></div>
    <div class="own-row"><button type="button" class="own-btn" data-own="${c.id}" aria-pressed="${own}">${own ? '★ в ростере' : '☆ добавить в ростер'}</button></div>`;
  if (!c.builds.length) {
    html += `<div class="cd-empty">У outerpedia пока нет рекомендаций по шмоту для этого персонажа.${c.gameSets && c.gameSets.length ? `<br>Сама игра советует сеты: ${c.gameSets.map((id) => esc(SET[id] ? SET[id].short : id)).join(', ')}.` : ''}</div>`;
    box.innerHTML = html; return;
  }
  const bi = Math.min(s.buildIdx, c.builds.length - 1);
  html += `<div class="btabs" role="tablist" aria-label="Билды">${c.builds.map((b, i) => `<button type="button" role="tab" data-build="${i}" aria-selected="${i === bi}">${esc(b.name)}</button>`).join('')}</div>`;
  const b = c.builds[bi];
  html += `<div class="bsec">`;
  html += `<div><h4>Сеты брони</h4>${b.sets.map((combo, i) => `<div class="combo">${i ? '<span class="or">или</span>' : ''}${combo.map((p) => { const st = SET[p.set]; return `<span class="setpill">${img('eq:' + (st ? st.icon : ''), '', '')}${esc(st ? st.short : p.set)} <span class="n">×${p.n}</span></span>`; }).join('')}</div>`).join('') || '<span class="muted">—</span>'}</div>`;
  html += gearBlock('Оружие', b.weapons, 'weapon');
  html += gearBlock('Аксессуар', b.amulets, 'accessory');
  html += `<div><h4>Приоритет сабстатов</h4><div class="prio">${b.subs.map((tier, t) => (t ? '<span class="gt">›</span>' : '') + (tier.length ? tier.map((k) => (SUB[k] || FLAT.has(k.replace(/%$/, ''))) ? `<span class="tok t${Math.min(t, 2)}">${esc(k)}</span>` : `<span class="tok no" title="не выпадает сабстатом на 6★ снаряжении">${esc(k)}</span>`).join('<span class="gt">=</span>') : '<span class="gt" title="разрыв в приоритете">…</span>')).join('')}</div>${prioHint(c, b)}</div>`;
  if (b.talismans.length) html += `<div><h4>Талисманы</h4><div class="tal">${b.talismans.map((id) => { const t = D.talismans[id]; return `<span>${img('eq:' + t.icon, '', '')}${esc(t.name)}${t.name === "Executioner's Charm" ? ' +10' : ''}</span>`; }).join('')}</div></div>`;
  if (b.note) html += `<div><h4>Заметка outerpedia</h4><div class="bnote">${esc(b.note)}</div></div>`;
  html += `</div>`;
  box.innerHTML = html;
}

// «ATK, DEF, HP в приоритете — что брать: flat или %» для этого персонажа
function prioHint(c, b) {
  const axes = [...new Set(b.subs.flat().map((k) => k.replace(/%$/, '')).filter((k) => FLAT.has(k)))];
  if (!axes.length) return '';
  const items = axes.map((ax) => {
    const r = flatFactor(c, ax);
    const pct = Math.round(r * 100);
    if (Math.abs(1 / r - 1) <= 0.05) return `<li><b>${ax}</b> — flat и ${ax}% примерно равны, бери любой.</li>`;
    if (r > 1) return `<li><b>${ax}</b> — выгоднее flat: сегмент flat ${ax} даёт ≈${pct}% от сегмента ${ax}% (то есть больше).</li>`;
    return `<li><b>${ax}</b> — выгоднее ${ax}%: сегмент flat ${ax} даёт только ≈${pct}% от сегмента ${ax}%.</li>`;
  });
  return `<ul class="prio-hint">${items.join('')}</ul><p class="muted small" style="margin:4px 0 0">Для lv ${state.lv120 ? 120 : 100}${state.quirks ? ' с прокачанными Quirks' : ' без Quirks'} — меняется в «Настройках оценки».</p>`;
}

function gearBlock(title, refs, kind) {
  if (!refs.length) return '';
  return `<div><h4>${title}</h4><div class="gear">${refs.map((g) => {
    const it = ITEM[kind][g.key];
    if (!it) return '';
    return `<div class="gearrow">${frame(it)}<div><b>${esc(it.name)}</b>${it.passives[0] ? ` <span class="ps">· ${esc(it.passives[0].name)}</span>` : ''}${it.star < 6 ? ` <span class="ps">· ${it.star}★</span>` : ''}
      <div class="gm">${g.mains.map((m) => `<span class="tok ok">${esc(m)}</span>`).join('')}${(g.bad || []).map((m) => `<span class="tok bad" title="у этого предмета не бывает такого main stat — вероятно, опечатка в outerpedia">${esc(m)}?</span>`).join('')}${it.classLimits.length ? `<span class="tok">${esc(classText(it))}</span>` : ''}</div></div></div>`;
  }).join('')}</div></div>`;
}

/* =====================================================================
   Навигация, события
   ===================================================================== */
function renderTabs() {
  for (const t of ['eval', 'chars']) {
    $('#tab-' + t).setAttribute('aria-selected', String(state.tab === t));
    $('#view-' + t).hidden = state.tab !== t;
  }
}
const FOCUS_KEYS = ['sub', 'roll', 'set', 'slot', 'grade', 'main', 'item', 'lv', 'stage', 'act', 'expand', 'cls'];
function focusKey() {
  const el = document.activeElement;
  if (!el || !el.dataset || typeof CSS === 'undefined') return null;
  for (const k of FOCUS_KEYS) if (el.dataset[k] !== undefined) return `[data-${k}="${CSS.escape(el.dataset[k])}"]${el.dataset.n !== undefined ? `[data-n="${el.dataset.n}"]` : ''}`;
  return el.id ? '#' + CSS.escape(el.id) : null;
}
function renderEval() {
  const f = focusKey();
  renderEvalInput(); renderVerdict();
  if (f) { const el = document.querySelector(f); if (el && el.focus) el.focus({ preventScroll: true }); }
}
function renderChars() { renderCharList(); renderCharDetail(); }
function renderAll() {
  renderTabs();
  if (state.tab === 'eval') { renderEval(); if (document.body) document.body.classList.remove('sheet-open'); }
  else { renderChars(); $('#vbar').hidden = true; if (document.body) document.body.classList.remove('has-vbar'); }
  persist();
}
function resetItem() { Object.assign(state, { setId: null, itemKey: null, main: null, subs: {}, q: '', cls: '', expand: {} }); }
function setGrade(g) {
  if (state.grade !== g && !isArmor(state.slot)) { state.itemKey = null; state.main = null; }
  state.grade = g; state.expand = {}; renderEval(); persist();
}
function setSlot(id) {
  if (state.slot !== id) resetItem();
  state.slot = id; renderEval(); persist();
}
function syncHash(slug) {
  try { history.replaceState(null, '', slug ? '#' + slug : location.pathname + location.search); } catch { /* file:// или песочница */ }
}
function openChar(id) {
  const c = CHAR[id];
  state.tab = 'chars'; state.charId = id; state.buildIdx = 0;
  if (c && !charMatches(c)) { state.cel = ''; state.ccl = ''; state.cq = ''; state.cOwned = false; if (!c.builds.length) state.cAll = true; }
  syncHash(c && c.slug);
  renderAll();
  if (!isSheet()) $('#char-detail').scrollTop = 0;
}
function closeChar() { state.charId = null; syncHash(null); renderChars(); persist(); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const s = state;
  const ds = t.dataset;
  if (ds.act !== 'clearroster' && s.confirmClear) s.confirmClear = false;

  if (ds.tab) { s.tab = ds.tab; if (ds.tab === 'eval') syncHash(null); else if (CHAR[s.charId]) syncHash(CHAR[s.charId].slug); renderAll(); return; }
  if (ds.own) {
    roster.has(ds.own) ? roster.delete(ds.own) : roster.add(ds.own);
    saveRoster(); renderChars(); persist();
    const again = document.querySelector(`${t.classList.contains('star') ? '.star' : '.own-btn'}[data-own="${ds.own}"]`);
    if (again) again.focus({ preventScroll: true });
    return;
  }
  if (ds.roll) { if (ds.roll in s.subs) s.subs[ds.roll] = Number(ds.n); renderEval(); return; }
  if (ds.sub) {
    // выбранный стат сразу получает 1 жёлтый сегмент; повторное нажатие снимает выбор
    const k = ds.sub;
    if (k in s.subs) delete s.subs[k]; else if (Object.keys(s.subs).length < 4) s.subs[k] = 1;
    renderEval(); return;
  }
  if (ds.slot) { setSlot(ds.slot); return; }
  if (ds.grade) { setGrade(ds.grade); return; }
  if (ds.set) { s.setId = ds.set; s.expand = {}; renderEval(); return; }
  if (ds.item) { s.itemKey = ds.item; s.main = null; s.expand = {}; renderEval(); return; }
  if (ds.main) { s.main = s.main === ds.main ? null : ds.main; if (s.main) delete s.subs[s.main]; s.expand = {}; renderEval(); return; }
  if (ds.cls !== undefined) { s.cls = s.cls === ds.cls ? '' : ds.cls; renderEval(); return; }
  if (ds.expand) { s.expand[ds.expand] = true; renderVerdict(); return; }
  if (ds.open) { openChar(ds.open); return; }
  if (ds.char) { s.charId = ds.char; s.buildIdx = 0; syncHash(CHAR[ds.char].slug); renderChars(); persist(); if (!isSheet()) $('#char-detail').scrollTop = 0; return; }
  if (ds.build) { s.buildIdx = Number(ds.build); renderCharDetail(); return; }
  if (ds.lv) { s.lv120 = ds.lv === '120'; renderEval(); persist(); return; }
  if (ds.stage) { s.stage = ds.stage; renderEval(); persist(); return; }
  if (ds.cel !== undefined) { s.cel = s.cel === ds.cel ? '' : ds.cel; renderCharList(); persist(); return; }
  if (ds.ccl !== undefined) { s.ccl = s.ccl === ds.ccl ? '' : ds.ccl; renderCharList(); persist(); return; }

  switch (ds.act) {
    case 'next':
      resetItem(); renderEval();
      if (isNarrow()) $('#eval-in').scrollIntoView({ block: 'start' });
      break;
    case 'toverdict': $('#verdict').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'unpick': s.itemKey = null; s.main = null; renderEval(); break;
    case 'unset': s.setId = null; renderEval(); break;
    case 'clearsubs': s.subs = {}; renderEval(); break;
    case 'closechar': closeChar(); break;
    case 'hidefit': store.set('fitnoteHidden', true); renderFitNote(); break;
    case 'applyupdate': if (pendingWorker) pendingWorker.postMessage('skipWaiting'); break;
    case 'install': if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; renderFoot(); }); } break;
    case 'markshown': D.chars.filter(charMatches).forEach((c) => roster.add(c.id)); saveRoster(); renderChars(); break;
    case 'clearroster':
      if (s.confirmClear) { roster.clear(); s.confirmClear = false; saveRoster(); }
      else { s.confirmClear = true; setTimeout(() => { if (s.confirmClear) { s.confirmClear = false; if (s.tab === 'chars') renderCharList(); } }, 4000); }
      renderCharList(); break;
    case 'io': s.io = !s.io; renderCharList(); break;
    case 'copyroster': {
      const ta = $('#roster-code');
      const fallback = () => { ta.select(); $('#io-msg').textContent = 'Выделено — нажми Ctrl/Cmd+C'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => { $('#io-msg').textContent = 'Скопировано'; }, fallback);
      else fallback();
      break;
    }
    case 'applyroster':
    case 'addroster': {
      const bySlug = Object.fromEntries(D.chars.map((c) => [c.slug, c.id]));
      const raw = $('#roster-code').value.split(/[\s,;]+/).map((x) => x.trim().toLowerCase()).filter(Boolean);
      const found = [], missed = [];
      for (const x of raw) { const id = bySlug[x] || (CHAR[x] ? x : null); if (id) found.push(id); else missed.push(x); }
      if (ds.act === 'applyroster') roster.clear();
      found.forEach((id) => roster.add(id)); saveRoster(); renderCharList();
      $('#io-msg').textContent = `${ds.act === 'applyroster' ? 'Заменено' : 'Добавлено'}: ${found.length}${missed.length ? `; не распознано: ${missed.slice(0, 5).join(', ')}${missed.length > 5 ? '…' : ''}` : ''}`;
      break;
    }
  }
});

document.addEventListener('toggle', (e) => { if (e.target.id === 'settings') { state.settingsOpen = e.target.open; persist(); } }, true);
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('broken'); }, true);
document.addEventListener('change', (e) => {
  const s = state;
  const id = e.target.id;
  if (id === 'opt-roster') { s.rosterOnly = e.target.checked; renderEval(); persist(); }
  if (id === 'opt-fodder') { s.fodder = e.target.checked; renderEval(); persist(); }
  if (id === 'opt-quirks') { s.quirks = e.target.checked; renderEval(); persist(); }
  if (id === 'c-owned') { s.cOwned = e.target.checked; renderCharList(); persist(); }
  if (id === 'c-all') { s.cAll = e.target.checked; renderCharList(); persist(); }
});
document.addEventListener('input', (e) => {
  const s = state;
  if (e.target.id === 'item-q') { s.q = e.target.value; $('#items').innerHTML = renderItems(); }
  if (e.target.id === 'char-q') { s.cq = e.target.value; $('#cgrid').innerHTML = D.chars.filter(charMatches).map(charTile).join('') || '<p class="empty">Никого не нашлось.</p>'; }
});
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.tab === 'chars' && e.key === 'Escape' && state.charId && isSheet()) { closeChar(); return; }
  if (state.tab !== 'eval') return;
  const typing = e.target.matches('input[type="search"], input[type="text"], textarea');
  if (e.key === 'Escape') { if (typing) e.target.blur(); resetItem(); renderEval(); return; }
  if (typing) return;
  if (/^[1-6]$/.test(e.key)) setSlot(SLOTS[Number(e.key) - 1].id);
  else if (['l', 'L', 'д', 'Д'].includes(e.key)) setGrade('unique');
  else if (['e', 'E', 'у', 'У'].includes(e.key)) setGrade('rare');
  else if (e.key === '/' || e.code === 'Slash') { const q = $('#item-q'); if (q) { e.preventDefault(); q.focus(); } }
});
window.addEventListener('resize', () => {
  const before = root.className;
  applyLayout();
  if (root.className !== before) { renderAll(); renderFitNote(); }
});
function renderFitNote() {
  const box = $('#fitnote');
  const show = desktopModeOnPhone && !store.get('fitnoteHidden', false);
  box.hidden = !show;
  if (show) box.innerHTML = `<p class="fitnote"><span>Браузер открыл страницу в режиме «Версия для ПК» — я подстроил масштаб. Если что-то выглядит странно, выключи этот режим: меню ⋮ → «Версия для ПК».</span><button type="button" data-act="hidefit">Понятно</button></p>`;
}
// PWA (сборка для GitHub Pages): офлайн через service worker, обновление данных и установка на экран
let installPrompt = null;
let pendingWorker = null;
function setupPwa() {
  if (!window.OGC_PWA || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (worker) => { pendingWorker = worker; renderUpdNote(); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    // проверяем обновление каждый раз, когда возвращаешься в приложение
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => { /* без service worker страница просто работает онлайн */ });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; renderFoot(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; renderFoot(); });
}
function renderUpdNote() {
  const box = $('#updnote');
  box.hidden = !pendingWorker;
  if (pendingWorker) box.innerHTML = `<p class="fitnote"><span>Вышли новые данные outerpedia — обнови, чтобы видеть свежие билды.</span><button type="button" data-act="applyupdate">Обновить</button></p>`;
}

window.addEventListener('hashchange', () => {
  const c = D.chars.find((x) => x.slug === decodeURIComponent(location.hash.slice(1)));
  if (c && c.id !== state.charId) openChar(c.id);
});

/* ---------- подвал и старт */
function renderFoot() {
  const m = D.meta;
  const when = (m.commitDate || m.generatedAt || '').slice(0, 10);
  $('#foot').innerHTML = `<span>Данные: <a href="https://github.com/Sevih/outerpedia" target="_blank" rel="noopener">outerpedia</a> (curated gear-reco) · версия игры ${esc(m.gameVersion || '?')} · снимок от ${esc(when)}${m.commit ? ` · <span class="mono">${esc(String(m.commit).slice(0, 7))}</span>` : ''} · ${persons(m.counts.characters)}, с билдами ${m.counts.withBuilds}, билдов ${m.counts.builds}.</span>
    <span>${window.OGC_PWA ? 'Данные обновляются автоматически каждый день.' : 'Обновить данные: <span class="mono">python3 update.py</span> в папке со страницей.'} Игровые данные и изображения принадлежат Major9 / VA Games, билды — авторам outerpedia; это личный инструмент, не связанный с издателем.</span>
    ${installPrompt ? '<span><button type="button" class="btn" data-act="install">Установить как приложение</button></span>' : ''}`;
}

const hash = decodeURIComponent(location.hash.slice(1));
const fromHash = hash && D.chars.find((x) => x.slug === hash);
saveRoster();
renderFoot();
renderFitNote();
setupPwa();
if (fromHash) openChar(fromHash.id); else renderAll();
// для отладки и автотестов
window.__ogc = { state, roster, evaluate, scoreBuild, flatFactor, subWeights, renderAll, CFG, D };
})();
</script>

</body>
</html>
