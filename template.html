<title>Outerplane Gear Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --surface-3: #e5e9f0;
  --ink: #121722;
  --ink-2: #454f60;
  --ink-3: #5f6979;
  --line: #d6dce6;
  --line-2: #bcc5d2;
  --accent: #1d4fcf;
  --accent-soft: #e2e9fb;
  --keep: #11744a;
  --keep-soft: #d9f0e3;
  --temp: #8a5a00;
  --temp-soft: #fbedd2;
  --fodder: #6041b8;
  --fodder-soft: #ebe4fb;
  --junk: #b3262e;
  --junk-soft: #fae0e1;
  --idle: #566174;
  --idle-soft: #e5e9f0;
  --epic: #2f6bd8;
  --legend: #cf3a31;
  --seg-y: #e5a00f;
  --seg-off: #aeb7c4;
  --star-on: #b97c00;
  --radius: 10px;
  --radius-s: 7px;
  --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  --font-display: "Unbounded", "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0f14;
    --surface: #151a22;
    --surface-2: #1a2029;
    --surface-3: #232b36;
    --ink: #e7ebf1;
    --ink-2: #b0bacb;
    --ink-3: #8b97aa;
    --line: #29313e;
    --line-2: #3b4555;
    --accent: #7aa2ff;
    --accent-soft: #1e2a44;
    --keep: #45d193;
    --keep-soft: #113322;
    --temp: #f2b64e;
    --temp-soft: #392a0d;
    --fodder: #b39aff;
    --fodder-soft: #2a2145;
    --junk: #ff7373;
    --junk-soft: #3d1618;
    --idle: #b0bacb;
    --idle-soft: #232b36;
    --epic: #74a0ff;
    --legend: #ff6d62;
    --seg-y: #f0b030;
    --seg-off: #3d4757;
    --star-on: #f0b030;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f14;
  --surface: #151a22;
  --surface-2: #1a2029;
  --surface-3: #232b36;
  --ink: #e7ebf1;
  --ink-2: #b0bacb;
  --ink-3: #8b97aa;
  --line: #29313e;
  --line-2: #3b4555;
  --accent: #7aa2ff;
  --accent-soft: #1e2a44;
  --keep: #45d193;
  --keep-soft: #113322;
  --temp: #f2b64e;
  --temp-soft: #392a0d;
  --fodder: #b39aff;
  --fodder-soft: #2a2145;
  --junk: #ff7373;
  --junk-soft: #3d1618;
  --idle: #b0bacb;
  --idle-soft: #232b36;
  --epic: #74a0ff;
  --legend: #ff6d62;
  --seg-y: #f0b030;
  --seg-off: #3d4757;
  --star-on: #f0b030;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 40px;
}
img { max-width: 100%; }
img.broken { visibility: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.app { max-width: 1240px; margin: 0 auto; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-2); background: var(--surface-2); }
.noimg { display: inline-block; background: var(--surface-3); border-radius: 6px; }

/* ---------- шапка */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 16px 12px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand h1 { font: 700 19px/1.1 var(--font-display); letter-spacing: .01em; margin: 0; }
.brand p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.brand-mark { display: block; width: 34px; height: 34px; flex: none; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-3); border-radius: 12px; }
.tabs button { border: 0; background: transparent; padding: 9px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tabs .count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); margin-left: 4px; }
html.xs .tabs { width: 100%; }
html.xs .tabs button { flex: 1; }

/* ---------- общие блоки */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.step { padding: 14px 16px 16px; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; min-height: 20px; }
.step-h h2 { margin: 0; flex: none; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.step-h .hint { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--accent); font-size: 13px; font-weight: 600; flex: none; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn.ghost { visibility: hidden; }
.note-line { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
.empty { padding: 12px; color: var(--ink-3); font-size: 13px; }

/* ---------- оценка: раскладка */
.eval { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
html:not(.narrow) .eval { grid-template-columns: minmax(0, 1fr) minmax(290px, 340px); align-items: start; }
html:not(.narrow) .eval-out { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 170px); overflow: auto; overscroll-behavior: contain; }
html.wide .eval { grid-template-columns: minmax(0, 1fr) minmax(360px, 430px); }

/* слоты и грейд */
.slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
html.xs .slots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.slot { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.slot img, .slot .noimg { width: 38px; height: 38px; object-fit: contain; }
.slot kbd { display: none; }
@media (hover: hover) and (pointer: fine) { html:not(.sheet) .slot kbd { display: inline-block; } }
.grades { display: flex; flex-wrap: wrap; gap: 8px; }
.grade { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); font-weight: 700; }
.grade img, .grade .noimg { width: 26px; height: 26px; border-radius: 5px; }
.grade .gname { font-family: var(--font-mono); letter-spacing: .02em; }
.grade.unique .gname { color: var(--legend); }
.grade.rare .gname { color: var(--epic); }
[aria-pressed="true"].slot, [aria-pressed="true"].grade, [aria-pressed="true"].set, [aria-pressed="true"].item, [aria-pressed="true"].chip, [aria-pressed="true"].sub, [aria-pressed="true"].ctile {
  border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); color: var(--ink);
}

/* сеты */
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
.set { display: grid; grid-template-columns: 32px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 7px 10px 7px 7px; min-height: 48px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); text-align: left; }
.set img, .set .noimg { grid-row: 1 / 3; width: 32px; height: 32px; object-fit: contain; }
.set b { font-weight: 600; font-size: 14px; line-height: 1.2; }
.set span { font-size: 12px; color: var(--ink-3); }
.dead-h { margin: 12px 0 6px; font-size: 12.5px; color: var(--ink-3); }
.dead { display: flex; flex-wrap: wrap; gap: 6px; }
.deadchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px 5px 5px; min-height: 36px; border: 1px dashed var(--line-2); border-radius: 999px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.deadchip img, .deadchip .noimg { width: 22px; height: 22px; }
.picked { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 10px; border-radius: var(--radius-s); background: var(--surface-2); border: 1px solid var(--line); }
.picked .pi { width: 44px; height: 44px; object-fit: contain; }
.picked b { display: block; font-size: 15px; }
.picked span { display: block; font-size: 12.5px; color: var(--ink-3); }

/* предметы */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
.search { flex: 1 1 200px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--radius-s); background: var(--surface); font-size: 16px; }
.search::placeholder { color: var(--ink-3); }
.filt { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.fbtn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px 6px 7px; min-height: 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: left; }
.fbtn img, .fbtn .noimg { width: 18px; height: 18px; }
.fbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; max-height: min(420px, 55vh); overflow: auto; padding: 2px; overscroll-behavior: contain; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 10px; align-items: center; text-align: left; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); }
.item b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.item span { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.unused b { color: var(--ink-2); font-weight: 500; }
.frame { position: relative; flex: none; width: 44px; height: 44px; border-radius: 7px; overflow: hidden; background: var(--surface-3); }
.frame > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.frame > img.ic { object-fit: contain; padding: 3px; }
.passive { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.passive b { color: var(--ink); }

/* статы */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px 7px 7px; min-height: 38px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.chip img, .chip .noimg { width: 18px; height: 18px; }
.chip.rare-main { border-style: dashed; }
.chip .want { font-family: var(--font-body); font-weight: 600; font-size: 11px; color: var(--keep); }
.subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
.sub { display: grid; grid-template-columns: 18px 1fr; grid-template-rows: auto auto; gap: 5px 7px; align-items: center; padding: 8px 8px 9px; min-height: 48px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); text-align: left; }
.sub img, .sub .noimg { width: 18px; height: 18px; }
.sub .lab { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.sub.flat .lab { font-weight: 500; color: var(--ink-2); }
.sub .segs { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.sub .segs i { height: 5px; border-radius: 1.5px; background: var(--seg-off); opacity: .55; }
.sub[aria-pressed="true"] .segs i { opacity: 1; }
.sub[aria-pressed="true"] .segs i.on { background: var(--seg-y); }
.sub:disabled { opacity: .35; cursor: not-allowed; }
.rolls { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-s); background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 6px; }
.rolls-h { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.roll { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.roll-k { display: inline-flex; align-items: center; gap: 6px; min-width: 78px; }
.roll-k img, .roll-k .noimg { width: 18px; height: 18px; }
.roll-k .lab { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.roll-b { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.roll-b button { min-width: 42px; height: 40px; border: 0; border-left: 1px solid var(--line); background: transparent; font: 700 14px/1 var(--font-mono); color: var(--ink-2); }
.roll-b button:first-child { border-left: 0; }
.roll-b button.r4 { color: var(--ink-3); }
.roll-b button.lit { background: color-mix(in srgb, var(--seg-y) 40%, var(--surface)); color: #1b1300; }
.roll-b button[aria-pressed="true"] { background: var(--seg-y); color: #1b1300; }

.actions { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.actions .hk { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.btn { padding: 9px 14px; min-height: 40px; border-radius: var(--radius-s); border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; min-height: 32px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.settings { border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); }
.settings summary { cursor: pointer; padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.settings summary .cur { font-weight: 500; color: var(--ink-3); }
.settings-body { padding: 0 16px 14px; display: grid; gap: 12px; }
.settings-body p { margin: 0; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg .muted { margin-right: 4px; }

/* ---------- вердикт */
.verdict { overflow: hidden; }
.v-head { padding: 16px 16px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); background: var(--v-soft, var(--idle-soft)); }
.v-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stamp { display: inline-block; padding: 7px 12px 6px; border: 2px solid var(--v, var(--idle)); border-radius: 6px; font: 700 clamp(18px, 2.6vw, 23px)/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--v, var(--idle)); box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 3.5px var(--v, var(--idle)); background: var(--surface); }
.badge { font: 700 11px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; background: var(--seg-y); color: #1b1300; }
.v-item { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.v-item img.seticon { width: 28px; height: 28px; }
.v-summary { margin: 0; font-weight: 700; font-size: 15px; }
.v-reasons { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.v-reasons b { color: var(--ink); }
.v-keep { --v: var(--keep); --v-soft: var(--keep-soft); }
.v-temp, .v-maybe { --v: var(--temp); --v-soft: var(--temp-soft); }
.v-fodder { --v: var(--fodder); --v-soft: var(--fodder-soft); }
.v-junk { --v: var(--junk); --v-soft: var(--junk-soft); }
.v-idle { --v: var(--idle); --v-soft: var(--idle-soft); }
.v-sec { border-top: 1px solid var(--line); }
.v-list-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px 4px; }
.v-list-h h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.v-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; min-height: 44px; border: 0; background: none; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.matches { list-style: none; margin: 0; padding: 4px 8px 10px; display: grid; gap: 2px; }
.match { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 8px; border-radius: var(--radius-s); }
.match:hover { background: var(--surface-2); }
.match .face { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--surface-3); }
.match .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.match .nm button { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; }
.match .nm button:hover { color: var(--accent); }
.match .bn { font-size: 12px; color: var(--ink-3); }
.match .det { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; }
.match.dim { opacity: .82; }
.score { font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); min-width: 44px; text-align: center; }
.score.hi { background: var(--keep-soft); color: var(--keep); }
.score.mid { background: var(--temp-soft); color: var(--temp); }
.score.lo { background: var(--junk-soft); color: var(--junk); }
.tok { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.tok.ok { background: var(--keep-soft); color: var(--keep); }
.tok.half { background: var(--temp-soft); color: var(--temp); }
.tok.no { background: transparent; color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.tok.bad { background: var(--junk-soft); color: var(--junk); }
.tok.cmb { font-family: var(--font-body); font-weight: 600; }
.more { padding: 0 16px 14px; }
.v-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); display: grid; gap: 6px; }

/* мобильная плашка вердикта */
.vbar { display: none; }
html.narrow body.has-vbar { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
html.narrow .vbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--v-soft, var(--idle-soft)); border-top: 2px solid var(--v, var(--idle)); box-shadow: 0 -6px 18px rgb(0 0 0 / .14); }
html.narrow .vbar .vb-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); min-height: 44px; }
html.narrow .vbar .vb-next { flex: none; min-height: 44px; padding: 8px 14px; border-radius: var(--radius-s); border: 0; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 14px; }
html.narrow .vbar .stamp { font-size: 14px; padding: 5px 8px 4px; flex: none; }
html.narrow .vbar .vt { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- персонажи */
.chars { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
html:not(.sheet) .chars { grid-template-columns: minmax(0, 1fr) minmax(400px, 500px); align-items: start; }
html:not(.sheet) .char-detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; overscroll-behavior: contain; }
html.sheet .char-detail:not(.open) { display: none; }
